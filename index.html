      cx.fillStyle='#f00';cx.fillRect(fishX-4.5*sc,fy-2.5*sc,1*sc,1*sc);
      // Tail
      cx.fillStyle='#2a5a1a';
      cx.beginPath();cx.moveTo(fishX+8*sc,fy);cx.lineTo(fishX+11*sc,fy-4*sc);cx.lineTo(fishX+11*sc,fy+4*sc);cx.fill();
    } else if(n==='The Fungi King'){
      // Giant mushroom creature
      cx.fillStyle='#8a5a3a';
      cx.fillRect(fishX-2*sc,fy,4*sc,6*sc); // stem
      // Huge mushroom cap
      cx.fillStyle='#c04040';
      cx.beginPath();cx.ellipse(fishX,fy-1*sc,7*sc,4*sc,0,Math.PI,Math.PI*2);cx.fill();
      cx.fillStyle='#e06060';
      cx.beginPath();cx.ellipse(fishX,fy-2*sc,5*sc,3*sc,0,Math.PI,Math.PI*2);cx.fill();
      // Spots on cap
      cx.fillStyle='#fff';
      cx.beginPath();cx.arc(fishX-3*sc,fy-3*sc,1*sc,0,Math.PI*2);cx.fill();
      cx.beginPath();cx.arc(fishX+2*sc,fy-4*sc,0.8*sc,0,Math.PI*2);cx.fill();
      cx.beginPath();cx.arc(fishX+1*sc,fy-2*sc,0.6*sc,0,Math.PI*2);cx.fill();
      // Angry face
      cx.fillStyle='#ff0';cx.fillRect(fishX-2*sc,fy,1.5*sc,1.5*sc);cx.fillRect(fishX+0.5*sc,fy,1.5*sc,1.5*sc);
      cx.fillStyle='#f00';cx.fillRect(fishX-1.5*sc,fy+0.5*sc,0.8*sc,0.8*sc);cx.fillRect(fishX+1*sc,fy+0.5*sc,0.8*sc,0.8*sc);
      // Spore particles
      cx.fillStyle='rgba(200,180,100,0.5)';
      for(let i=0;i<4;i++){cx.fillRect(fishX+Math.sin(time*2+i*1.5)*5*sc,fy-5*sc-Math.abs(Math.sin(time+i))*3*sc,0.8*sc,0.8*sc)}
    } else if(n==='The Ocean King'){
      // Massive blue sea serpent with crown
      cx.fillStyle='#1a4a8a';
      for(let i=0;i<8;i++){
        const ex=fishX-8*sc+i*2*sc;
        const ey2=fy+Math.sin(time*2.5+i)*2*sc;
        cx.fillRect(ex,ey2-2*sc,2.5*sc,4*sc);
      }
      cx.fillStyle='#2a6aaa';
      for(let i=0;i<7;i++){
        const ex=fishX-7*sc+i*2*sc;
        const ey2=fy+Math.sin(time*2.5+i)*2*sc;
        cx.fillRect(ex,ey2-0.5*sc,2*sc,1.5*sc);
      }
      // Crown on head
      cx.fillStyle='#f0d040';
      const hy=fy+Math.sin(time*2.5)*2*sc;
      cx.fillRect(fishX-8*sc,hy-4*sc,4*sc,1.5*sc);
      cx.fillRect(fishX-8*sc,hy-5.5*sc,1*sc,1.5*sc);cx.fillRect(fishX-5.5*sc,hy-5.5*sc,1*sc,1.5*sc);
      // Eye
      cx.fillStyle='#0ff';cx.fillRect(fishX-7*sc,hy-2*sc,1.5*sc,1.5*sc);
      cx.fillStyle='#fff';cx.fillRect(fishX-6.5*sc,hy-1.5*sc,0.5*sc,0.5*sc);
    } else if(n==='The Dragon King'){
      // Huge red dragon
      cx.fillStyle='#a02020';
      cx.beginPath();cx.ellipse(fishX,fy,7*sc,4*sc,0,0,Math.PI*2);cx.fill();
      cx.fillStyle='#c04040';
      cx.beginPath();cx.ellipse(fishX,fy+1*sc,6*sc,3*sc,0,0,Math.PI*2);cx.fill();
      // Big head
      cx.fillStyle='#a02020';cx.fillRect(fishX-8*sc,fy-3*sc,4*sc,4*sc);
      // Horns
      cx.fillStyle='#802020';cx.fillRect(fishX-8*sc,fy-6*sc,1.5*sc,3*sc);cx.fillRect(fishX-5*sc,fy-6*sc,1.5*sc,3*sc);
      // Huge wings
      cx.fillStyle='#802020';
      cx.beginPath();cx.moveTo(fishX-1*sc,fy-4*sc);cx.lineTo(fishX+4*sc,fy-10*sc);cx.lineTo(fishX+7*sc,fy-3*sc);cx.fill();
      // Fire breath
      cx.fillStyle='#f08020';
      cx.beginPath();cx.moveTo(fishX-9*sc,fy-1*sc);cx.lineTo(fishX-13*sc,fy-2*sc+Math.sin(time*5)*sc);cx.lineTo(fishX-9*sc,fy+1*sc);cx.fill();
      cx.fillStyle='#f0c030';
      cx.beginPath();cx.moveTo(fishX-9*sc,fy-0.5*sc);cx.lineTo(fishX-11*sc,fy-1*sc);cx.lineTo(fishX-9*sc,fy+0.5*sc);cx.fill();
      // Eye
      cx.fillStyle='#ff0';cx.fillRect(fishX-7*sc,fy-2*sc,1.5*sc,1.5*sc);
      cx.fillStyle='#f00';cx.fillRect(fishX-6.5*sc,fy-1.5*sc,0.8*sc,0.8*sc);
      // Tail
      cx.fillStyle='#a02020';cx.fillRect(fishX+6*sc,fy-1*sc,4*sc,2*sc);
      cx.fillRect(fishX+9*sc,fy-2*sc,2*sc,1*sc);cx.fillRect(fishX+9*sc,fy+1*sc,2*sc,1*sc);
    } else if(n==='The Void Emperor'){
      // Enormous dark entity with glowing eyes
      cx.fillStyle='#0a0a1a';
      cx.beginPath();cx.ellipse(fishX,fy,8*sc,5*sc,0,0,Math.PI*2);cx.fill();
      cx.fillStyle='#1a1a2a';
      cx.beginPath();cx.ellipse(fishX,fy,6*sc,4*sc,0,0,Math.PI*2);cx.fill();
      // Void aura
      cx.fillStyle=`rgba(80,20,150,${0.15+0.15*Math.sin(time*2)})`;
      cx.beginPath();cx.arc(fishX,fy,10*sc,0,Math.PI*2);cx.fill();
      // Multiple glowing eyes
      cx.fillStyle='#c040f0';
      cx.beginPath();cx.arc(fishX-3*sc,fy-2*sc,1.2*sc,0,Math.PI*2);cx.fill();
      cx.beginPath();cx.arc(fishX+2*sc,fy-2*sc,1.2*sc,0,Math.PI*2);cx.fill();
      cx.fillStyle='#e080ff';
      cx.beginPath();cx.arc(fishX-0.5*sc,fy-1*sc,0.8*sc,0,Math.PI*2);cx.fill();
      cx.fillStyle='#fff';
      cx.fillRect(fishX-3.3*sc,fy-2.3*sc,0.5*sc,0.5*sc);cx.fillRect(fishX+1.7*sc,fy-2.3*sc,0.5*sc,0.5*sc);
      // Dark tendrils
      cx.fillStyle='#0a0a1a';
      for(let t=0;t<6;t++){
        const ta=t*Math.PI*2/6+time*0.5;
        cx.fillRect(fishX+Math.cos(ta)*7*sc,fy+Math.sin(ta)*4*sc,1.5*sc,1.5*sc);
      }
      // Crown of void energy
      cx.fillStyle='#6a20a0';
      cx.fillRect(fishX-4*sc,fy-5.5*sc,1*sc,2*sc);cx.fillRect(fishX-1*sc,fy-6*sc,1*sc,2.5*sc);cx.fillRect(fishX+2*sc,fy-5.5*sc,1*sc,2*sc);
    } else {
      // Default fish shape for all others
      const fishCols={common:['#6a9a6a','#8ac88a'],uncommon:['#3a8aaa','#5ac8e0'],rare:['#4a5ac8','#7a8af8'],epic:['#8a4ab8','#ba7ae8'],legendary:['#c8a030','#f8d060']};
      const fc=fishCols[f.rarity]||fishCols.common;
      const bw=5*sc, bh=2.5*sc;
      // Body
      cx.fillStyle=fc[0];
      cx.beginPath();cx.ellipse(fishX,fy,bw,bh,0,0,Math.PI*2);cx.fill();
      // Belly
      cx.fillStyle=fc[1];
      cx.beginPath();cx.ellipse(fishX,fy+bh*0.3,bw*0.7,bh*0.5,0,0,Math.PI*2);cx.fill();
      // Tail
      cx.fillStyle=fc[0];
      cx.beginPath();cx.moveTo(fishX+bw,fy);cx.lineTo(fishX+bw+3*sc,fy-2*sc);cx.lineTo(fishX+bw+3*sc,fy+2*sc);cx.closePath();cx.fill();
      // Fin
      cx.beginPath();cx.moveTo(fishX,fy-bh);cx.lineTo(fishX+1*sc,fy-bh-2*sc);cx.lineTo(fishX+2*sc,fy-bh);cx.fill();
      // Eye
      cx.fillStyle='#fff';cx.fillRect(fishX-bw*0.5,fy-bh*0.3,Math.max(1,1.5*sc),Math.max(1,1.5*sc));
      cx.fillStyle='#111';cx.fillRect(fishX-bw*0.5,fy-bh*0.2,Math.max(1,1*sc),Math.max(1,1*sc));
    }

    // Sparkle for rare+
    if(f.rarity==='rare'||f.rarity==='epic'||f.rarity==='legendary'){
      cx.fillStyle=f.rarity==='legendary'?'#ffd700':'#fff';
      for(let s=0;s<3;s++){
        const sa=time*4+s*2.1;
        const sx2=fishX+Math.cos(sa)*6*sc;
        const sy2=fy+Math.sin(sa)*4*sc;
        cx.fillRect(Math.floor(sx2),Math.floor(sy2),1,1);
      }
    }

    cx.globalAlpha=1;
  }
}

let textOverlays=[];
let toastOverlay=null;
let sailingText=null;
let reelLabel=null;

function render(){
  textOverlays=[];toastOverlay=null;sailingText=null;reelLabel=null;
  bx.fillStyle='#2a4a2a';bx.fillRect(0,0,RW,RH);
  if(!gameStarted){ctx.fillStyle='#0a1628';ctx.fillRect(0,0,W,H);return}

  const sx=Math.max(0,Math.floor(camX/T)),sy=Math.max(0,Math.floor(camY/T));
  const ex=Math.min(MW,Math.ceil((camX+RW)/T)+1),ey=Math.min(MH,Math.ceil((camY+RH)/T)+1);

  const isl=ISLANDS[curIsland];
  // Perf: use pre-cached RGB values instead of parsing hex every frame
  const wc=isl._waterRgb;
  const oRgb=isl._oceanRgb;

  for(let ty=sy;ty<ey;ty++)for(let tx=sx;tx<ex;tx++){
    const t=map[ty][tx],px=tx*T-camX,py=ty*T-camY;
    if(t===0){
      // Grass - use island theme
      const gc=isl.grass[(tx+ty)%isl.grass.length];
      bx.fillStyle=gc;bx.fillRect(px,py,T+1,T+1);
      // Grass blades (slightly lighter)
      if((tx+ty)%3===0){bx.fillStyle=isl.grass[1]||gc;bx.fillRect(px+4,py+6,1,2);bx.fillRect(px+10,py+3,1,2)}
      if((tx*17+ty*23)%41===0){bx.fillStyle='rgba(0,0,0,0.08)';bx.fillRect(px+3,py+5,3,2)}
    }
    else if(t===1){
      // Water - use island theme with pre-cached RGB
      const w1=Math.sin(time*1.8+tx*0.7+ty*0.4)*10;
      const w2=Math.sin(time*2.5+tx*1.1+ty*0.8)*6;
      bx.fillStyle=`rgb(${wc.r},${(wc.g+w1)|0},${(wc.b+w2)|0})`;
      bx.fillRect(px,py,T+1,T+1);
      if(Math.sin(time*2.2+tx*2.3+ty*1.1)>0.85){
        bx.fillStyle='rgba(180,220,255,0.2)';bx.fillRect(px+5,py+4,3,1);
      }
      bx.fillStyle='rgba(255,255,255,0.06)';
      bx.fillRect(px+1,py+6+((Math.sin(time+tx)*2)|0),T-2,1);
    }
    else if(t===2){
      // Sand/shore
      bx.fillStyle=isl.sand;bx.fillRect(px,py,T+1,T+1);
      if((tx+ty)%3===0){bx.fillStyle='rgba(0,0,0,0.06)';bx.fillRect(px+5,py+7,2,1)}
    }
    else if(t===3){
      bx.fillStyle=(tx+ty)%2===0?'#5a5040':'#655a4a';bx.fillRect(px,py,T+1,T+1);
      bx.fillStyle='#4a4030';bx.fillRect(px+T-1,py,1,T);bx.fillRect(px,py+T-1,T,1);
    }
    else if(t===4){
      bx.fillStyle='#8a6a3a';bx.fillRect(px,py,T+1,T+1);
      bx.fillStyle='#7a5a2a';bx.fillRect(px,py+3,T,1);bx.fillRect(px,py+8,T,1);bx.fillRect(px,py+13,T,1);
      bx.fillStyle='rgba(0,0,0,0.1)';bx.fillRect(px,py+T-1,T,1);
    }
    else if(t===5){
      // Boat dock - wooden pier over water
      bx.fillStyle=isl.ocean||'#1a4080';bx.fillRect(px,py,T+1,T+1); // water underneath
      bx.fillStyle='#8a6a3a';bx.fillRect(px,py+2,T,T-4); // planks
      bx.fillStyle='#7a5a2a';bx.fillRect(px,py+5,T,1);bx.fillRect(px,py+10,T,1);
    }
    else if(t===6){
      // Ocean - use pre-cached oRgb
      const w1=Math.sin(time*1.2+tx*0.5+ty*0.3)*8;
      const w1f=w1|0;
      bx.fillStyle=`rgb(${oRgb.r},${oRgb.g+w1f},${oRgb.b+w1f})`;
      bx.fillRect(px,py,T+1,T+1);
      // Ocean waves
      bx.fillStyle='rgba(255,255,255,0.04)';
      const owy=py+7+Math.sin(time*0.8+tx*0.4)*3;
      bx.fillRect(px,Math.floor(owy),T,1);
      // Foam near shore
      if(Math.sin(time*2+tx+ty)>0.95){bx.fillStyle='rgba(255,255,255,0.1)';bx.fillRect(px+4,py+4,3,1)}
    }
  }

  // Draw boat at dock - use cached position
  const dockX=cachedDockTile.x*T-camX;
  const dockY=cachedDockTile.y*T-camY;
  // Boat body
  bx.fillStyle='#6a4a2a';
  bx.beginPath();bx.moveTo(dockX-12,dockY-4);bx.lineTo(dockX+20,dockY-4);
  bx.lineTo(dockX+16,dockY+4);bx.lineTo(dockX-8,dockY+4);bx.fill();
  bx.fillStyle='#8a6a3a';
  bx.fillRect(dockX-8,dockY-6,24,3);
  // Mast
  bx.fillStyle='#5a3a1a';bx.fillRect(dockX+4,dockY-18,2,14);
  // Sail
  bx.fillStyle='#e0d8c8';
  bx.beginPath();bx.moveTo(dockX+6,dockY-16);bx.lineTo(dockX+18,dockY-10);bx.lineTo(dockX+6,dockY-4);bx.fill();
  // Flag
  bx.fillStyle='#e03030';bx.fillRect(dockX+3,dockY-20,4,3);
  // Sign
  textOverlays.push({type:'label',text:'DOCK',x:dockX+4,y:dockY+10,color:'#ffd700'});

  // Perf: reeds and lily pads merged into single pass over visible tiles
  for(let ty=sy;ty<ey;ty++)for(let tx=sx;tx<ex;tx++){
    const tt=map[ty][tx];
    if(tt===2&&(tx+ty*3)%5===0){
      // Reeds along water edges - check if adjacent to water
      let adjWater=false;
      for(let dy=-1;dy<=1&&!adjWater;dy++)for(let dx=-1;dx<=1;dx++){
        const yy=ty+dy,xx=tx+dx;
        if(yy>=0&&yy<MH&&xx>=0&&xx<MW&&map[yy][xx]===1){adjWater=true;break}
      }
      if(adjWater){
        const px2=tx*T-camX,py2=ty*T-camY;
        const sway=Math.sin(time*1.5+tx*2)*1;
        bx.fillStyle='#5a7a3a';
        bx.fillRect(px2+3+sway,py2-6,1,10);
        bx.fillRect(px2+7+sway,py2-4,1,8);
        bx.fillStyle='#6a8a4a';
        bx.fillRect(px2+3+sway,py2-8,2,3);
        bx.fillRect(px2+7+sway,py2-6,2,3);
      }
    }else if(tt===1&&(tx*13+ty*7)%17===0){
      // Lily pads on water
      const px2=tx*T-camX,py2=ty*T-camY;
      const bob=Math.sin(time*0.8+tx+ty)*0.5;
      bx.fillStyle='#3a8a3a';
      bx.beginPath();bx.arc(px2+8,py2+8+bob,3,0,Math.PI*2);bx.fill();
      bx.fillStyle='#2a6a2a';
      bx.fillRect(px2+8,py2+7+bob,3,1);
      if((tx+ty)%7===0){
        bx.fillStyle='#f0a0c0';
        bx.fillRect(px2+7,py2+5+bob,2,2);
      }
    }
  }

  // Trees (themed by island)
  const tc=isl.treeCol;
  for(const t of trees){
    const px=Math.floor(t.x-camX),py=Math.floor(t.y-camY);
    if(px<-20||py<-20||px>RW+20||py>RH+20)continue;
    bx.fillStyle='rgba(0,0,0,0.12)';
    bx.beginPath();bx.ellipse(px+2,py+7,6,3,0,0,Math.PI*2);bx.fill();

    if(isl.treeType==='palm'){
      // Palm tree
      bx.fillStyle='#6a4a2a';bx.fillRect(px-1,py-2,3,10);
      bx.fillStyle=tc[0];bx.fillRect(px-6,py-6,5,3);bx.fillRect(px+2,py-6,5,3);
      bx.fillStyle=tc[1];bx.fillRect(px-5,py-8,4,3);bx.fillRect(px+2,py-8,4,3);
      bx.fillStyle=tc[2];bx.fillRect(px-2,py-9,5,2);
    } else if(isl.treeType==='pine'){
      bx.fillStyle='#5a3a1a';bx.fillRect(px-1,py-1,3,8);
      bx.fillStyle=tc[0];bx.fillRect(px-2,py-3,5,3);
      bx.fillStyle=tc[1];bx.fillRect(px-3,py-6,7,4);
      bx.fillStyle=tc[0];bx.fillRect(px-4,py-9,9,4);
      bx.fillStyle=tc[2];bx.fillRect(px-2,py-11,5,3);
    } else if(isl.treeType==='mushroom'){
      // Giant mushroom
      bx.fillStyle='#b0a090';bx.fillRect(px-1,py-1,3,8);
      bx.fillStyle=tc[0];bx.beginPath();bx.ellipse(px,py-4,6,4,0,0,Math.PI*2);bx.fill();
      bx.fillStyle=tc[1];bx.fillRect(px-2,py-5,2,2);bx.fillRect(px+1,py-3,2,2);
      bx.fillStyle=tc[2];bx.fillRect(px-4,py-2,2,1);
    } else if(isl.treeType==='dead'){
      // Charred dead tree
      bx.fillStyle=tc[0];bx.fillRect(px-1,py-2,3,10);
      bx.fillStyle=tc[1];bx.fillRect(px-4,py-4,3,2);bx.fillRect(px+2,py-6,3,2);
      bx.fillStyle=tc[2];bx.fillRect(px-3,py-6,2,2);
    } else if(isl.treeType==='crystal'){
      // Crystal pillars
      bx.fillStyle=tc[0];bx.fillRect(px-1,py-8,3,14);
      bx.fillStyle=tc[1];bx.fillRect(px-3,py-6,2,10);
      bx.fillStyle=tc[2];bx.fillRect(px+2,py-4,2,8);
      // Sparkle
      if(Math.sin(time*3+px)>0.8){bx.fillStyle='#fff';bx.fillRect(px,py-7,1,1)}
    } else if(isl.treeType==='coral'){
      // Coral formations
      bx.fillStyle=tc[0];bx.fillRect(px-2,py-4,5,8);
      bx.fillStyle=tc[1];bx.fillRect(px-4,py-2,3,5);bx.fillRect(px+2,py-3,3,5);
      bx.fillStyle=tc[2];bx.fillRect(px-1,py-6,3,3);
    } else if(isl.treeType==='cloud'){
      // Cloud puffs
      bx.fillStyle=tc[0];bx.beginPath();bx.ellipse(px,py-2,6,4,0,0,Math.PI*2);bx.fill();
      bx.fillStyle=tc[1];bx.beginPath();bx.ellipse(px-3,py,4,3,0,0,Math.PI*2);bx.fill();
      bx.fillStyle=tc[2];bx.beginPath();bx.ellipse(px+3,py-1,4,3,0,0,Math.PI*2);bx.fill();
    } else if(isl.treeType==='swamp'){
      // Swamp tree with hanging moss
      bx.fillStyle='#3a2a1a';bx.fillRect(px-1,py-2,3,10);
      bx.fillStyle=tc[0];bx.fillRect(px-5,py-5,11,5);
      bx.fillStyle=tc[1];bx.fillRect(px-4,py-7,9,4);
      // Hanging moss
      bx.fillStyle='#5a7a4a';
      bx.fillRect(px-4,py-1,1,4);bx.fillRect(px+4,py-1,1,3);bx.fillRect(px-2,py,1,3);
    } else {
      // Default round tree
      bx.fillStyle='#5a3a1a';bx.fillRect(px-1,py-1,3,8);
      bx.fillStyle=tc[0];bx.fillRect(px-5,py-4,11,6);
      bx.fillStyle=tc[1];bx.fillRect(px-4,py-7,9,5);
      bx.fillStyle=tc[2];bx.fillRect(px-3,py-8,7,3);
    }
  }

  // Perf: rocks and flowers merged into single pass over grass tiles
  const _flowerCols=['#f0e040','#e06080','#8080f0','#f0a040'];
  for(let ty=sy;ty<ey;ty++)for(let tx=sx;tx<ex;tx++){
    if(map[ty][tx]!==0)continue;
    const px2=tx*T-camX,py2=ty*T-camY;
    if((tx*11+ty*17)%31===0){
      bx.fillStyle='#7a7a7a';bx.fillRect(px2+4,py2+8,5,4);
      bx.fillStyle='#8a8a8a';bx.fillRect(px2+5,py2+7,3,3);
      bx.fillStyle='#6a6a6a';bx.fillRect(px2+4,py2+11,5,1);
    }
    if((tx*23+ty*19)%29===0){
      bx.fillStyle='#4a8a3a';bx.fillRect(px2+7,py2+6,1,4);
      bx.fillStyle=_flowerCols[(tx+ty)%4];bx.fillRect(px2+6,py2+4,3,3);
      bx.fillStyle='#fff';bx.fillRect(px2+7,py2+5,1,1);
    }
  }

  // Shop booths (open market stall with awning)
  function drawBooth(sx2,sy2,stripeCol){
    const spx=sx2*T-camX,spy=sy2*T-camY;
    const bw=T*3,bh=T*2;
    // Counter/table
    bx.fillStyle='#8a6a3a';bx.fillRect(spx,spy+bh-6,bw,6);
    bx.fillStyle='#9a7a4a';bx.fillRect(spx+1,spy+bh-5,bw-2,4);
    // Items on counter
    bx.fillStyle='#4a8af5';bx.fillRect(spx+4,spy+bh-9,4,3);  // rod
    bx.fillStyle='#e0a030';bx.fillRect(spx+12,spy+bh-9,3,3);  // bait

    bx.fillStyle='#333';bx.fillRect(bhpX,bhpY,bhpW,bhpH);
    bx.fillStyle=bossDmgTimer>0?'#fff':'#e03030';
    bx.fillRect(bhpX,bhpY,Math.max(0,bhpW*(bossHP/bossMaxHP)),bhpH);

    // Player HP bar
    const phpY=bhpY+bhpH+8;
    bx.fillStyle='rgba(0,0,0,0.7)';bx.fillRect(bhpX-2,phpY-2,bhpW+4,bhpH+4);
    bx.fillStyle='#333';bx.fillRect(bhpX,phpY,bhpW,bhpH);
    bx.fillStyle='#22c55e';
    bx.fillRect(bhpX,phpY,Math.max(0,bhpW*(bossPlayerHP/bossPlayerMaxHP)),bhpH);

    // Fight bar (timing attacks)
    const fbY=phpY+bhpH+20;
    const fbW=180,fbH=16,fbX=(RW-fbW)/2;
    bx.fillStyle='rgba(0,0,0,0.7)';bx.fillRect(fbX-2,fbY-2,fbW+4,fbH+4);
    bx.fillStyle='#1a1a3a';bx.fillRect(fbX,fbY,fbW,fbH);

    // Hit zone (where boss is)
    const hzW=20-curWorld*2;
    const hzX=fbX+(bossHitZone/100)*fbW-hzW/2;
    bx.fillStyle='rgba(255,50,50,0.5)';bx.fillRect(hzX,fbY,hzW,fbH);

    // Player swing cursor
    const scX=fbX+(bossSwingPos/100)*fbW;
    bx.fillStyle='#ffd700';bx.fillRect(scX-2,fbY-2,4,fbH+4);

    // Labels
    textOverlays.push({type:'label',text:'BOSS',x:bhpX+bhpW/2,y:bhpY+bhpH/2+1,color:'#ff4444'});
    textOverlays.push({type:'label',text:'YOU',x:bhpX+bhpW/2,y:phpY+bhpH/2+1,color:'#44ff44'});
    textOverlays.push({type:'label',text:'PRESS SPACE TO ATTACK!',x:fbX+fbW/2,y:fbY+fbH+12,color:'#ffd700'});
  }

  // Toast - draw box on pixel buffer, text on full-res
  if(me.toast&&me.toastT>0){
    bx.globalAlpha=Math.min(1,me.toastT);
    const tw=60,th=22,tx2=RW/2-tw/2,ty2=RH/2-40;
    bx.fillStyle='rgba(0,0,0,0.85)';bx.fillRect(tx2,ty2,tw,th);
    bx.globalAlpha=1;
    const tCol=me.toast.lost?'#f56565':me.toast.full?'#f5a623':me.toast.fish?RARITY_COL[me.toast.fish.rarity]:'#5be0f5';
    toastOverlay={msg:me.toast.msg,color:tCol,alpha:Math.min(1,me.toastT),
      fish:me.toast.fish,lost:me.toast.lost,y:ty2};
  }

  // Manual sailing - ocean map view
  if(sailing){
    // Ocean background
    bx.fillStyle='#0a2040';bx.fillRect(0,0,RW,RH);
    // Animated waves
    for(let row=0;row<RH;row+=4){
      const w=Math.sin(time*1.5+row*0.08)*5;
      bx.fillStyle=`rgba(20,${60+w},${130+w},0.4)`;
      bx.fillRect(0,row,RW,3);
    }
    // Foam dots
    for(let i=0;i<15;i++){
      const fx=((time*8+i*23)%(RW+10))-5;
      const fy2=((time*3+i*37)%(RH+10))-5;
      bx.fillStyle='rgba(255,255,255,0.08)';
      bx.fillRect(fx,fy2,3,1);
    }

    // Camera centered on boat
    const ocCamX=sailX-RW/2;
    const ocCamY=sailY-RH/2;

    // Draw islands for the target world only
    const sailWorld=ISLANDS[sailTargetIsland].world||0;
    const sailWorldIslands=ISLANDS.filter(isl3=>isl3.world===sailWorld);
    for(const isl3 of sailWorldIslands){
      const i=isl3.id;
      const ip=ISLAND_POS[i];
      const ix=ip.x-ocCamX,iy=ip.y-ocCamY;
      if(ix<-30||iy<-30||ix>RW+30||iy>RH+30)continue;
      const unlocked=islandUnlocked(isl3);
      const isTarget=i===sailTargetIsland;

      // Island blob
      if(unlocked){
        bx.fillStyle=isl3.sand;
        bx.beginPath();bx.ellipse(ix,iy,10,8,0,0,Math.PI*2);bx.fill();
        bx.fillStyle=isl3.grass[0];
        bx.beginPath();bx.ellipse(ix,iy-1,8,6,0,0,Math.PI*2);bx.fill();
        const wc2=isl3.water[0];
        bx.fillStyle=wc2;
        bx.beginPath();bx.ellipse(ix+1,iy,3,2,0,0,Math.PI*2);bx.fill();
        // Boss crown icon
        if(isl3.isBossIsland){
          bx.fillStyle='#ffd700';
          bx.fillRect(ix-3,iy-11,6,3);
          bx.fillRect(ix-4,iy-13,2,2);
          bx.fillRect(ix-1,iy-14,2,3);
          bx.fillRect(ix+2,iy-13,2,2);
        }
      }else{
        bx.fillStyle='rgba(100,100,100,0.3)';
        bx.beginPath();bx.ellipse(ix,iy,10,8,0,0,Math.PI*2);bx.fill();
        bx.fillStyle='rgba(60,60,60,0.4)';
        bx.fillRect(ix-1,iy-1,3,3);
      }

      if(isTarget){
        const pulse=Math.sin(time*4)*0.3+0.7;
        bx.strokeStyle=`rgba(91,224,245,${pulse})`;
        bx.lineWidth=1;
        bx.beginPath();bx.ellipse(ix,iy,13,11,0,0,Math.PI*2);bx.stroke();
      }

      textOverlays.push({type:'label',text:isl3.name+(unlocked?'':` (Lv.${isl3.level})`),x:ix,y:iy+14,color:isTarget?'#5be0f5':unlocked?'#fff':'#666'});
    }

    // Boat (player)
    const bx2=sailX-ocCamX,by2=sailY-ocCamY;
    const boatRock=Math.sin(time*2)*0.1;
    bx.save();bx.translate(bx2,by2);bx.rotate(boatRock);
    // Hull
    bx.fillStyle='#6a4a2a';
    bx.beginPath();bx.moveTo(-6,-2);bx.lineTo(8,-2);bx.lineTo(6,3);bx.lineTo(-4,3);bx.fill();
    bx.fillStyle='#8a6a3a';bx.fillRect(-4,-3,10,2);
    // Mast + sail
    bx.fillStyle='#5a3a1a';bx.fillRect(1,-10,1,8);
    bx.fillStyle='#e8e0d0';
    bx.beginPath();bx.moveTo(2,-9);bx.lineTo(7+Math.sin(time*3),-6);bx.lineTo(2,-3);bx.fill();
    // Player
    const col=me.color||COLORS[me.colorIdx||0];
    bx.fillStyle=col.body;bx.fillRect(-2,-5,3,3);
    bx.fillStyle='#f5c06a';bx.fillRect(-1,-7,2,2);
    bx.restore();
    // Wake
    bx.fillStyle='rgba(255,255,255,0.15)';
    for(let w2=0;w2<3;w2++)bx.fillRect(bx2-6-w2*4,by2+2+Math.sin(time*3+w2),3,1);

    // Compass arrow pointing to target
    const tgt=ISLAND_POS[sailTargetIsland];
    const angle=Math.atan2(tgt.y-sailY,tgt.x-sailX);
    const dist2=Math.sqrt(Math.pow(tgt.x-sailX,2)+Math.pow(tgt.y-sailY,2));
    // Draw compass in corner of pixel buffer
    const compX=RW-18,compY=18;
    // Circle
    bx.strokeStyle='rgba(255,255,255,0.3)';bx.lineWidth=1;
    bx.beginPath();bx.arc(compX,compY,12,0,Math.PI*2);bx.stroke();
    bx.fillStyle='rgba(0,0,0,0.5)';
    bx.beginPath();bx.arc(compX,compY,11,0,Math.PI*2);bx.fill();
    // Arrow
    bx.save();bx.translate(compX,compY);bx.rotate(angle);
    bx.fillStyle='#e03030';
    bx.beginPath();bx.moveTo(9,0);bx.lineTo(-3,-4);bx.lineTo(-1,0);bx.lineTo(-3,4);bx.fill();
    bx.fillStyle='#fff';
    bx.beginPath();bx.moveTo(-9,0);bx.lineTo(-1,-3);bx.lineTo(-1,3);bx.fill();
    bx.restore();

    // Distance + target name on full-res canvas
    sailingText=`${ISLANDS[sailTargetIsland].name} - ${Math.round(dist2)}m`;
  }

  ctx.clearRect(0,0,W,H);
  ctx.imageSmoothingEnabled=false;
  ctx.drawImage(buf,0,0,RW,RH,0,0,W,H);

  // ---- FULL-RES TEXT OVERLAY ----
  ctx.imageSmoothingEnabled=true;
  ctx.textAlign='center';

  // Player names, chat, labels
  for(const t of textOverlays){
    const sx2=t.x*SC,sy2=t.y*SC;
    if(t.type==='name'){
      ctx.font=t.isBoss?'bold 14px monospace':'bold 13px monospace';
      ctx.fillStyle='rgba(0,0,0,0.5)';
      ctx.fillText(t.text,sx2+1,sy2+1);
      ctx.fillStyle=t.isBoss?'#ff4444':t.isMe?'#5be0f5':'#fff';
      ctx.fillText(t.text,sx2,sy2);
    }
    if(t.type==='chat'){
      ctx.font='12px monospace';
      const tw2=ctx.measureText(t.text).width+10;
      ctx.fillStyle='rgba(255,255,255,0.9)';
      ctx.fillRect(sx2-tw2/2,sy2-10,tw2,16);
      ctx.fillStyle='#111';
      ctx.fillText(t.text,sx2,sy2+2);
    }
    if(t.type==='label'){
      ctx.font='bold 14px monospace';
      ctx.fillStyle='rgba(0,0,0,0.5)';
      ctx.fillText(t.text,sx2+1,sy2+1);
      ctx.fillStyle=t.color||'#ffd700';
      ctx.fillText(t.text,sx2,sy2);
    }
  }

  // Bite indicators
  for(const t of textOverlays){
    if(t.type==='bite'){
      ctx.font='bold 20px monospace';
      ctx.fillStyle='#ffd700';
      ctx.fillText('!',t.x*SC,t.y*SC);
    }
  }

  // Toast overlay text
  if(toastOverlay){
    const t=toastOverlay;
    ctx.globalAlpha=t.alpha;
    ctx.font='bold 16px monospace';
    ctx.fillStyle=t.color;
    ctx.fillText(t.msg,W/2,t.y*SC+22);
    if(t.fish){
      ctx.font='14px monospace';
      ctx.fillStyle='#ddd';
      ctx.fillText(`${t.fish.name} ${t.fish.size}cm`,W/2,t.y*SC+42);
      if(!t.lost){ctx.fillStyle='#ffd700';ctx.fillText(`$${fishVal(t.fish)}`,W/2,t.y*SC+60)}
    }
    ctx.globalAlpha=1;
  }

  // Sailing text
  if(sailingText){
    ctx.font='bold 22px monospace';
    ctx.fillStyle='rgba(0,0,0,0.5)';
    ctx.fillText(sailingText,W/2+1,H-55);
    ctx.fillStyle='#fff';
    ctx.fillText(sailingText,W/2,H-56);
  }

  // Reel minigame label
  if(reelLabel){
    ctx.font='bold 18px monospace';
    ctx.fillStyle='rgba(0,0,0,0.6)';
    ctx.fillText(reelLabel,W/2+1,H-115);
    ctx.fillStyle='#5be0f5';
    ctx.fillText(reelLabel,W/2,H-116);
  }


  ctx.imageSmoothingEnabled=false;
}

// ========== LOOP ==========
let lastT=0;
function loop(t){
  const dt=Math.min((t-lastT)/1000,0.05);
  lastT=t;
  update(dt);
  render();
  for(const k in justKeys)justKeys[k]=false;
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
</body>
</html>
