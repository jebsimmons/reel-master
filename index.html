function openShop(){
  $('shop-modal').style.display='flex';
  // Filter: show universal items (island=-1) and items for this island
  const available=UPGRADES.filter(u=>{
    if(u.type==='boss_weapon')return u.island===curIsland;
    return u.island===-1||u.island===curIsland;
  });
  const items=available.map(u=>{
    const isRod=u.type==='rod';
    const isBossWeapon=u.type==='boss_weapon';
    const owned=isRod?me.ownedRods.includes(u.id):isBossWeapon?me.bossWeapons.includes(u.id):me.owned.includes(u.id);
    const equipped=isRod&&me.equippedRod===u.id;
    const can=me.coins>=u.price&&!owned;
    const tag=u.island>=0&&!isBossWeapon?` <span style="color:#5be0f5;font-size:9px">[${ISLANDS[u.island].name}]</span>`:'';
    const bossTag=isBossWeapon?' <span style="color:#ff4444;font-size:9px">[BOSS WEAPON]</span>':'';
    let btn='';
    if(isRod){
      if(equipped)btn='<span class="shop-owned">EQUIPPED</span>';
      else if(owned)btn=`<button class="shop-buy" onclick="equipRod('${u.id}')">EQUIP</button>`;
      else btn=`<button class="shop-buy" ${!can?'disabled':''} onclick="buyUp('${u.id}')">BUY</button>`;
    }else if(isBossWeapon){
      btn=owned?'<span class="shop-owned">OWNED</span>':`<button class="shop-buy" ${!can?'disabled':''} onclick="buyBossWeapon('${u.id}')" style="background:#ff4444;border-color:#aa2222">BUY</button>`;
    }else{
      btn=owned?'<span class="shop-owned">OWNED</span>':`<button class="shop-buy" ${!can?'disabled':''} onclick="buyUp('${u.id}')">BUY</button>`;
    }
    return`<div class="shop-item"${isBossWeapon?' style="border-color:#ff4444"':''}><div><h4>${u.name}${tag}${bossTag}</h4><p>${u.desc} - $${u.price}</p></div>${btn}</div>`;
  }).join('');
  $('shop-content').innerHTML=`<h2>${ISLANDS[curIsland].name} SHOP</h2><div class="shop-coins-d">Coins: $${me.coins}</div>${items}<button class="shop-close" onclick="closeShop()">CLOSE</button>`;
}

window.buyBossWeapon=function(uid){
  const u=UPGRADES_BY_ID[uid];
  if(!u||me.coins<u.price)return;
  if(me.bossWeapons.includes(uid))return;
  me.coins-=u.price;
  me.bossWeapons.push(uid);
  SFX.play('buy');
  saveGame();
  openShop();
};
window.buyUp=function(uid){
  const u=UPGRADES_BY_ID[uid];
  if(!u||me.coins<u.price)return;
  if(u.type==='rod'){
    if(me.ownedRods.includes(uid))return;
    me.coins-=u.price;me.ownedRods.push(uid);
    me.equippedRod=uid;me.rodLv=u.val;
  }else{
    if(me.owned.includes(uid))return;
    me.coins-=u.price;me.owned.push(uid);
    if(u.type==='bag')me.bagMax=u.val;
    if(u.type==='speed')me.speedBoost=u.val;
    if(u.type==='boat')me.hasBoat=true;
  }
  SFX.play('buy');
  saveGame();
  openShop();
};

window.equipRod=function(uid){
  const u=UPGRADES_BY_ID[uid];
  if(!u||!me.ownedRods.includes(uid))return;
  me.equippedRod=uid;me.rodLv=u.val;

};

// ========== QUESTS ==========
function nearQuestGiver(px,py){
  const dx=px-questGiverPos.x,dy=py-questGiverPos.y;
  return Math.sqrt(dx*dx+dy*dy)<24;
}

function questDesc(q){
  if(q.type==='catch_name')return`Catch ${q.count} ${q.fish}${q.count>1?'s':''}`;
  if(q.type==='catch_count')return`Catch any ${q.count} fish`;
  if(q.type==='catch_size')return`Catch a ${q.fish} at least ${q.size}cm long`;
  if(q.type==='earn_coins')return`Earn $${q.amount} from selling fish`;
  return'???';
}

function questComplete(q,progress){
  if(q.type==='catch_size')return progress>=1;
  if(q.type==='earn_coins')return progress>=q.amount;
  return progress>=q.count;
}

function questProgressText(q,progress){
  if(q.type==='catch_size')return progress>=1?'Done!':'0/1';
  if(q.type==='earn_coins')return`$${progress}/$${q.amount}`;
  return`${progress}/${q.count}`;
}

function openQuest(){
  const modal=$('quest-modal');
  modal.style.display='flex';
  const giverName=QUEST_NAMES[curIsland];
  let html=`<h2>Quest Board</h2><div class="giver-name">- ${giverName} -</div>`;

  // If has active quest
  if(me.activeQuest&&me.questIsland===curIsland){
    const q=me.activeQuest;
    const done=questComplete(q,me.questProgress);
    html+=`<div class="quest-desc"><b style="color:#5be0f5">${q.title}</b><br>${questDesc(q)}</div>`;
    html+=`<div class="quest-progress">${questProgressText(q,me.questProgress)}</div>`;
    html+=`<div class="quest-reward">Reward: $${q.reward} + ${q.xp} XP</div>`;
    html+='<div class="quest-btn-row">';
    if(done){
      html+='<button class="quest-btn quest-turn-in" onclick="turnInQuest()">TURN IN</button>';
    }else{
      html+='<button class="quest-btn quest-close-btn" onclick="abandonQuest()">ABANDON</button>';
    }
    html+='<button class="quest-btn quest-close-btn" onclick="closeQuest()">CLOSE</button>';
    html+='</div>';
  }else if(me.activeQuest){
    html+=`<div class="quest-desc">You already have a quest from <b>${QUEST_NAMES[me.questIsland]}</b>. Finish or abandon it first!</div>`;
    html+='<div class="quest-btn-row"><button class="quest-btn quest-close-btn" onclick="closeQuest()">CLOSE</button></div>';
  }else{
    // Offer a random new quest
    const pool=QUEST_TEMPLATES[curIsland];
    if(!pool||pool.length===0){
      html+='<div class="quest-desc">No quests here right now.</div>';
      html+='<div class="quest-btn-row"><button class="quest-btn quest-close-btn" onclick="closeQuest()">CLOSE</button></div>';
    }else{
      const q=pool[Math.floor(Math.random()*pool.length)];
      html+=`<div class="quest-desc">"Ahoy! I need help with this..."<br><br><b style="color:#5be0f5">${q.title}</b><br>${questDesc(q)}</div>`;
      html+=`<div class="quest-reward">Reward: $${q.reward} + ${q.xp} XP</div>`;
      html+='<div class="quest-btn-row">';
      html+=`<button class="quest-btn quest-accept" onclick='acceptQuest(${JSON.stringify(q).replace(/'/g,"&#39;")})'>ACCEPT</button>`;
      html+='<button class="quest-btn quest-close-btn" onclick="closeQuest()">DECLINE</button>';
      html+='</div>';
    }
  }
  $('quest-content').innerHTML=html;
}

window.acceptQuest=function(q){
  me.activeQuest=q;
  me.questProgress=0;
  me.questIsland=curIsland;
  saveGame();
  closeQuest();
};

window.abandonQuest=function(){
  me.activeQuest=null;me.questProgress=0;me.questIsland=-1;
  saveGame();
  openQuest();
};

window.turnInQuest=function(){
  const q=me.activeQuest;
  me.coins+=q.reward;
  me.totalEarned=(me.totalEarned||0)+q.reward;
  me.xp+=q.xp;
  const prevLvQ=me.level;
  while(me.xp>=me.xpToNext){me.xp-=me.xpToNext;me.level++;me.xpToNext=Math.floor(50+me.level*20)}
  if(me.level>prevLvQ)SFX.play('levelup');
  me.activeQuest=null;me.questProgress=0;me.questIsland=-1;
  saveGame();
  closeQuest();
};

window.closeQuest=function(){$('quest-modal').style.display='none'};

function updateQuestTracker(){
  const el=$('quest-tracker');
  if(!me.activeQuest){el.style.display='none';return}
  const q=me.activeQuest;
  const done=questComplete(q,me.questProgress);
  let pct=0;
  if(q.type==='earn_coins')pct=Math.min(100,(me.questProgress/q.amount)*100);
  else if(q.type==='catch_size')pct=done?100:0;
  else pct=Math.min(100,(me.questProgress/q.count)*100);

  el.style.display='block';
  el.className=done?'complete':'';
  el.innerHTML=`
    <div class="qt-label">${done?'✓ COMPLETE':'Active Quest'}</div>
    <div class="qt-title">${q.title}</div>
    <div class="qt-desc">${questDesc(q)}</div>
    <div class="qt-progress-bar"><div class="qt-progress-fill" style="width:${pct}%"></div></div>
    <div class="qt-progress-text">${questProgressText(q,me.questProgress)}</div>
    <div class="qt-reward">$${q.reward} + ${q.xp} XP${done?' - Return to giver!':''}</div>
  `;
}

// ========== BOAT / TRAVEL ==========
function onBoatDock(px2,py2){return tileAt(px2,py2)===5}

function findSafeSpawn(){
  // Search outward from center for a grass tile
  const cx2=Math.floor(MW/2),cy2=Math.floor(MH/2);
  for(let r=0;r<Math.max(MW,MH);r++){
    for(let dy=-r;dy<=r;dy++)for(let dx=-r;dx<=r;dx++){
      const tx=cx2+dx,ty=cy2+dy;
      if(tx>=0&&ty>=0&&tx<MW&&ty<MH&&map[ty][tx]===0){
        return{x:tx*T+T/2,y:ty*T+T/2};
      }
    }
  }
  return{x:cx2*T,y:cy2*T};
}

function updateIslandName(){
  const w=WORLDS[ISLANDS[curIsland].world||0];
  $('island-name').textContent=w.name+' - '+ISLANDS[curIsland].name;
  $('island-name').style.display='block';
}

function islandUnlocked(isl){
  if(isl.id===0)return true;
  if(!me)return false;
  const world=isl.world||0;
  if(world>0 && !me.bossesDefeated.includes(world-1))return false;
  // First island of each world is free if world is unlocked
  const worldIslands=ISLANDS.filter(i=>i.world===world);
  if(isl.id===worldIslands[0].id)return true;
  // Other islands need boat and level
  if(!me.hasBoat)return false;
  if(me.level<isl.level)return false;
  return true;
}

let travelWorldTab=0;
function openTravel(){
  if(!me.hasBoat){return}
  $('travel-modal').style.display='flex';
  travelWorldTab=ISLANDS[curIsland].world||0;
  renderTravelModal();
}

function renderTravelModal(){
  let html='<h2>SET SAIL</h2>';
  // World tabs
  html+='<div style="display:flex;gap:4px;margin-bottom:10px;flex-wrap:wrap;justify-content:center">';
  for(const w of WORLDS){
    const unlocked=w.id===0 || me.bossesDefeated.includes(w.id-1);
    const active=w.id===travelWorldTab;
    html+=`<button onclick="switchWorldTab(${w.id})" style="padding:4px 10px;font-family:monospace;font-size:11px;border:1px solid ${active?w.color:'#2a3a5a'};background:${active?w.color+'33':'#0a0a2e'};color:${unlocked?'#fff':'#3a3a5a'};cursor:${unlocked?'pointer':'default'};border-radius:4px;${!unlocked?'opacity:0.4':''}">${unlocked?w.name:'???'}</button>`;
  }
  html+='</div>';
  // Current world info
  const cw=WORLDS[travelWorldTab];
  const cwUnlocked=cw.id===0||me.bossesDefeated.includes(cw.id-1);
  if(cwUnlocked){
    html+=`<div style="text-align:center;color:${cw.color};font-size:13px;margin-bottom:8px">${cw.name} - ${cw.desc}</div>`;
    const bossDefeated=me.bossesDefeated.includes(cw.id);
    html+=`<div style="text-align:center;font-size:11px;color:${bossDefeated?'#4ade80':'#ff4444'};margin-bottom:8px">Boss: ${cw.bossName} ${bossDefeated?'DEFEATED':'UNDEFEATED'}</div>`;
  }
  // Islands for this world tab (boss island always last)
  const worldIslands=ISLANDS.filter(i=>i.world===travelWorldTab).sort((a,b)=>(a.isBossIsland?1:0)-(b.isBossIsland?1:0));
  for(const isl of worldIslands){
    const isCurrent=isl.id===curIsland;
    const unlocked=islandUnlocked(isl);
    const bossDefeated=isl.isBossIsland && me.bossesDefeated.includes(travelWorldTab);
    const isBoss=isl.isBossIsland;
    const bossStyle=isBoss?'border-color:'+(bossDefeated?'#4ade80':'#ff3030'):'';
    if(isCurrent){
      html+=`<div class="island-card current" style="${bossStyle}">
        <div><h4>${isBoss?'&#128081; ':''}${isl.name}</h4><p>${isl.desc}</p>${isBoss?'<span style="color:'+(bossDefeated?'#4ade80':'#ff4444')+';font-size:10px">BOSS'+(bossDefeated?' DEFEATED':'')+'</span>':''}</div>
        <span class="island-current">YOU ARE HERE</span></div>`;
    }else if(unlocked){
      html+=`<div class="island-card" style="${bossStyle}" onclick="travelTo(${isl.id})">
        <div><h4>${isBoss?'&#128081; ':''}${isl.name}</h4><p>${isl.desc}</p>${isBoss?'<span style="color:'+(bossDefeated?'#4ade80':'#ff4444')+';font-size:10px">BOSS'+(bossDefeated?' DEFEATED':'')+'</span>':''}</div>
        <span class="island-unlocked">SAIL HERE</span></div>`;
    }else{
      let lockReason='';
      if(!me.hasBoat)lockReason='Need Boat';
      else if(me.level<isl.level)lockReason=`Lv.${isl.level} needed`;
      else lockReason='Locked';
      html+=`<div class="island-card locked" style="${bossStyle}">
        <div><h4>${isBoss?'&#128081; ':''}${isl.name}</h4><p>${isl.desc}</p></div>
        <span class="island-price">${lockReason}</span></div>`;
    }
  }
  html+=`<p style="text-align:center;color:#5a7a9a;font-size:11px;margin-top:8px">Your Level: ${me.level}</p>`;
  html+='<button class="travel-close" onclick="closeTravel()">CLOSE</button>';
  $('travel-content').innerHTML=html;
}

window.switchWorldTab=function(wid){
  const unlocked=wid===0 || me.bossesDefeated.includes(wid-1);
  if(!unlocked)return;
  travelWorldTab=wid;
  renderTravelModal();
};

window.travelTo=function(i){
  const isl=ISLANDS[i];
  if(!islandUnlocked(isl)||i===curIsland)return;
  closeTravel();
  sailing=true;
  sailTimer=0;
  sailFrom=curIsland;
  sailTargetIsland=i;
  sailX=ISLAND_POS[curIsland].x;
  sailY=ISLAND_POS[curIsland].y;
  curWorld=isl.world||0;
};

function finishSailing(){
  sailing=false;
  curIsland=sailTargetIsland;
  curWorld=ISLANDS[curIsland].world||0;
  genIslandMap(ISLANDS[sailTargetIsland]);
  const sp2=findSafeSpawn();me.x=sp2.x;me.y=sp2.y;
  me.state='idle';
  closeTravel();
  updateIslandName();
  saveGame();
};

window.closeTravel=function(){$('travel-modal').style.display='none'};

    modal.style.display='flex';

      $('admin-login').style.display='block';
      $('admin-content').style.display='none';
      $('admin-pass').value='';
      $('admin-wrong').textContent='';
      setTimeout(()=>$('admin-pass').focus(),100);
    }else{
      renderAdmin();
    }
  }
}

function drawPlayerSprite(cx,p,px,py,isMe){
  const col=p.color||COLORS[p.colorIdx||0];
  // Check if player has a mount (rod val >= 6)
  const _mountRod=p.equippedRod?UPGRADES_BY_ID[p.equippedRod]:null;
  const _hasMount=_mountRod&&_mountRod.type==='rod'&&_mountRod.val>=6;
  // Shadow (oval) - hide if mounted
  if(!_hasMount){
    cx.fillStyle='rgba(0,0,0,0.2)';
    cx.beginPath();cx.ellipse(px,py+6,5,2.5,0,0,Math.PI*2);cx.fill();
  }
  // Feet/shoes
  cx.fillStyle='#4a3020';
  const walk=_hasMount?0:(p.frame||0)%4;
  if(walk===0||walk===2){cx.fillRect(px-2,py+4,2,3);cx.fillRect(px+1,py+4,2,3)}
  else if(walk===1){cx.fillRect(px-3,py+3,2,3);cx.fillRect(px+2,py+5,2,3)}
  else{cx.fillRect(px-2,py+5,2,3);cx.fillRect(px+1,py+3,2,3)}
  // Legs
  cx.fillStyle=col.dark;
  if(walk===0||walk===2){cx.fillRect(px-2,py+2,2,3);cx.fillRect(px+1,py+2,2,3)}
  else if(walk===1){cx.fillRect(px-3,py+1,2,3);cx.fillRect(px+2,py+3,2,3)}
  else{cx.fillRect(px-2,py+3,2,3);cx.fillRect(px+1,py+1,2,3)}
  // Body/shirt
  cx.fillStyle=col.body;cx.fillRect(px-3,py-3,7,6);
  // Shirt detail
  cx.fillStyle=col.light;cx.fillRect(px-1,py-2,3,1);
  // Rod colors by type (uses module-level _ROD_COLORS)
  const eqRod=p.equippedRod||'rod_m1';
  const rc=_ROD_COLORS[eqRod]||_ROD_COLORS_DEFAULT;

  // ---- ROD + ARMS (clean pixel art, always visible) ----
  const rodUpgrade=UPGRADES_BY_ID[eqRod];
  const rodPower=rodUpgrade?rodUpgrade.val:1;
  const rodLen=10+rodPower; // longer = better rod

  // Draw rod as pixel line in a direction (no rotation - clean pixels)
  function drawRodPixel(cx2,bx2,by2,ex2,ey2){
    const dx2=ex2-bx2,dy2=ey2-by2;
    const rodLen=Math.sqrt(dx2*dx2+dy2*dy2);
    // Perpendicular unit vector (for rod width)
    const nx=-dy2/rodLen,ny=dx2/rodLen;
    // Direction unit
    const ux=dx2/rodLen,uy=dy2/rodLen;

    // ---- HANDLE (cork/leather grip at base) ----
    // Goes from bx,by backwards (opposite direction from rod)
    const handleLen=4;
    const hx=bx2-ux*handleLen,hy=by2-uy*handleLen;
    // Handle cork (light brown base)
    cx2.fillStyle='#b8825a';
    for(let s=0;s<=handleLen;s++){
      const t=s/handleLen;
      const sx=Math.round(bx2-ux*s),sy=Math.round(by2-uy*s);
      cx2.fillRect(sx-1,sy-1,2,2);
    }
    // Handle grip wraps (dark bands)
    cx2.fillStyle='#3a2010';
    for(let s=1;s<=handleLen;s+=2){
      const sx=Math.round(bx2-ux*s),sy=Math.round(by2-uy*s);
      cx2.fillRect(sx-1,sy,2,1);
    }
    // Handle end cap
    cx2.fillStyle='#2a1a0a';
    cx2.fillRect(Math.round(hx)-1,Math.round(hy)-1,2,2);

    // ---- REEL (perpendicular to rod, at base) ----
    const reelX=Math.round(bx2+nx*2);
    const reelY=Math.round(by2+ny*2);
    // Reel seat (silver mount)
    cx2.fillStyle='#5a5a6a';
    cx2.fillRect(Math.round(bx2+nx*1)-1,Math.round(by2+ny*1)-1,2,2);
    // Reel body (side profile)
    cx2.fillStyle='#2a2a3a';
    cx2.fillRect(reelX-1,reelY-2,3,3);
    cx2.fillStyle='#4a4a5a';
    cx2.fillRect(reelX,reelY-2,2,2);
    // Reel spool shine
    cx2.fillStyle='#7a7a8a';
    cx2.fillRect(reelX,reelY-1,1,1);
    // Reel handle/crank
    cx2.fillStyle='#3a3a4a';
    cx2.fillRect(reelX+2,reelY-1,1,1);
    cx2.fillStyle='#8a8a9a';
    cx2.fillRect(reelX+3,reelY-1,1,1);

    // ---- SHAFT (tapered with realistic colors) ----
    const steps=Math.ceil(rodLen);
    for(let s=0;s<=steps;s++){
      const t=s/Math.max(1,steps);
      const lx2=Math.round(bx2+dx2*t);
      const ly2=Math.round(by2+dy2*t);

      // Tapered width - thick at base, thin at tip
      if(t<0.15){
        // Base section - thickest with reel seat
        cx2.fillStyle=rc[0];
        cx2.fillRect(lx2,ly2,2,1);
        cx2.fillRect(lx2-1,ly2,1,1);
        // Highlight
        cx2.fillStyle=rc[1];
        cx2.fillRect(lx2,ly2,1,1);
      }else if(t<0.4){
        // Lower shaft - thick
        cx2.fillStyle=rc[0];
        cx2.fillRect(lx2,ly2,2,1);
        // Shine line
        if(s%2===0){cx2.fillStyle=rc[1];cx2.fillRect(lx2,ly2,1,1)}
      }else if(t<0.7){
        // Mid shaft - medium
        cx2.fillStyle=rc[0];
        cx2.fillRect(lx2,ly2,2,1);
      }else if(t<0.9){
        // Upper shaft - thinner
        cx2.fillStyle=rc[1];
        cx2.fillRect(lx2,ly2,1,1);
      }else{
        // Tip - thinnest
        cx2.fillStyle=rc[1];
        cx2.fillRect(lx2,ly2,1,1);
      }
    }

    // ---- LINE GUIDES (metal rings along rod) ----
    const guideCount=4;
    for(let g=1;g<=guideCount;g++){
      const t=0.2+g*0.18;
      const gx=Math.round(bx2+dx2*t);
      const gy=Math.round(by2+dy2*t);
      // Guide ring (silver)
      cx2.fillStyle='#b0b0c0';
      cx2.fillRect(gx+Math.round(nx),gy+Math.round(ny),1,1);
      cx2.fillRect(gx-Math.round(nx),gy-Math.round(ny),1,1);
      // Outer ring
      cx2.fillStyle='#7a7a8a';
      cx2.fillRect(gx+Math.round(nx*2),gy+Math.round(ny*2),1,1);
    }

    // ---- TIP (very light) ----
    cx2.fillStyle='#e0e0f0';
    cx2.fillRect(ex2,ey2,1,1);
    cx2.fillStyle='#b0b0c0';
    cx2.fillRect(ex2-Math.round(ux),ey2-Math.round(uy),1,1);
  }

  cx.fillStyle=col.body;
  const isFishing=p.state==='waiting'||p.state==='bite'||p.state==='reeling';
  const isCasting=p.state==='casting';

  if(isCasting){
    // Arms raised
    cx.fillRect(px-4,py-4,2,3);
    cx.fillRect(px+3,py-5,2,3);
    // Casting animation - rod swings up based on power
    const cpow=(p.castPow||0)/100;
    const swing=Math.floor(cpow*rodLen);
    // Rod goes from pointing right to pointing up
    if(p.dir==='down'){
      drawRodPixel(cx, px+4,py-4, px+4+rodLen-swing,py-4-swing);
    }else if(p.dir==='up'){
      drawRodPixel(cx, px+4,py-4, px+4+rodLen-swing,py-4-swing);
    }else if(p.dir==='left'){
      drawRodPixel(cx, px-3,py-4, px-3-rodLen+swing,py-4-swing);
    }else{
      drawRodPixel(cx, px+4,py-4, px+4+rodLen-swing,py-4-swing);
    }
    // Power glow at tip
    if(cpow>0.6){
      const tipX=p.dir==='left'?px-3-rodLen+swing:px+4+rodLen-swing;
      cx.fillStyle=`rgba(255,220,80,${cpow*0.5})`;
      cx.fillRect(tipX-1,py-4-swing-1,3,3);
    }
  }else if(isFishing){
    // Arms holding rod out
    cx.fillRect(px-4,py-3,2,3);
    cx.fillRect(px+3,py-4,2,3);
    // Rod points toward bobber direction
    const wobble=p.state==='reeling'?Math.floor(Math.sin(time*8)*2):
                 p.state==='bite'?Math.floor(Math.sin(time*12)*2):0;
    const tipBob=p.state==='reeling'?Math.floor(Math.sin(time*10)*3):0;
    if(p.dir==='down'){
      drawRodPixel(cx, px+4,py-3, px+4,py-3+rodLen+tipBob);
    }else if(p.dir==='up'){
      drawRodPixel(cx, px+4,py-3, px+4+wobble,py-3-rodLen+tipBob);
    }else if(p.dir==='left'){
      drawRodPixel(cx, px-3,py-3, px-3-rodLen,py-3+wobble+tipBob);
    }else{
      drawRodPixel(cx, px+4,py-3, px+4+rodLen,py-3+wobble+tipBob);
    }
  }else{
    // Idle/walking - rod on shoulder (diagonal up-right)
    const walkBob=p.frame%2===1?1:0;
    cx.fillRect(px-4,py-2+walkBob,2,4); // left arm swings
    cx.fillRect(px+3,py-3,2,4); // right arm holds rod
    // Rod rests diagonally upward
    drawRodPixel(cx, px+4,py-3, px+4+Math.floor(rodLen*0.6),py-3-Math.floor(rodLen*0.8));
  }
  // Skin (hands)
  cx.fillStyle='#f5c06a';cx.fillRect(px-4,py+1,1,1);cx.fillRect(px+4,py+1,1,1);
  // Head
  cx.fillStyle='#f5c06a';cx.fillRect(px-2,py-7,5,5);
  // Hair/hat
  cx.fillStyle=col.dark;cx.fillRect(px-3,py-8,7,2);cx.fillRect(px-2,py-9,5,2);
  // Brim
  cx.fillStyle=col.dark;
  if(p.dir==='down')cx.fillRect(px-3,py-7,7,1);
  else if(p.dir==='left')cx.fillRect(px-4,py-7,5,1);
  else if(p.dir==='right')cx.fillRect(px,py-7,5,1);
  // Eyes
  if(p.dir==='down'){cx.fillStyle='#222';cx.fillRect(px-1,py-5,1,1);cx.fillRect(px+1,py-5,1,1);
    cx.fillStyle='#fff';cx.fillRect(px-1,py-6,1,1);cx.fillRect(px+1,py-6,1,1)}
  else if(p.dir==='left'){cx.fillStyle='#222';cx.fillRect(px-2,py-5,1,1);cx.fillStyle='#fff';cx.fillRect(px-2,py-6,1,1)}
  else if(p.dir==='right'){cx.fillStyle='#222';cx.fillRect(px+2,py-5,1,1);cx.fillStyle='#fff';cx.fillRect(px+2,py-6,1,1)}
  // Name + Chat drawn later on full-res canvas (see textOverlays)
  if(typeof textOverlays!=='undefined'){
    textOverlays.push({type:'name',text:p.name||'???',x:px,y:py-12,isMe});
    if(p.chatT>0&&p.chatMsg){
      textOverlays.push({type:'chat',text:p.chatMsg,x:px,y:py-20});
    }
  }
  // Cast bar
  if(p.state==='casting'){
    cx.fillStyle='#111';cx.fillRect(px-12,py-24,24,3);
    const pct=(p.castPow||0)/100;
    cx.fillStyle=pct>0.7?'#e03030':pct>0.4?'#f5a623':'#22c55e';
    cx.fillRect(px-12,py-24,Math.floor(24*pct),3);
  }
  // Line+bobber
  if(p.state==='waiting'||p.state==='bite'||p.state==='reeling'){
    const bpx=Math.floor((p.bobX||0)-camX),bpy=Math.floor((p.bobY||0)-camY);
    cx.strokeStyle='rgba(200,200,200,0.5)';cx.lineWidth=0.5;
    cx.beginPath();cx.moveTo(px,py);cx.lineTo(bpx,bpy);cx.stroke();cx.lineWidth=1;
    // Bobber shadow on water
    cx.fillStyle='rgba(0,0,0,0.15)';
    cx.beginPath();cx.ellipse(bpx,bpy+3,3,1.5,0,0,Math.PI*2);cx.fill();
    // Water ripples (continuous)
    for(let ri=0;ri<2;ri++){
      const rr=((time*0.8+ri*0.4)%1)*10;
      cx.strokeStyle=`rgba(150,200,255,${0.25*(1-rr/10)})`;cx.lineWidth=0.5;
      cx.beginPath();cx.ellipse(bpx,bpy+1,rr+2,rr*0.5+1,0,0,Math.PI*2);cx.stroke();cx.lineWidth=1;
    }
    // Bobber body
    const bobDip=p.state==='bite'?Math.sin(time*12)*2:Math.sin(time*2)*0.5;
    cx.fillStyle='#fff';cx.fillRect(bpx-1,bpy-2+bobDip,3,4);
    cx.fillStyle='#e03030';cx.fillRect(bpx-1,bpy-3+bobDip,3,2);
    cx.fillStyle='#fff';cx.fillRect(bpx,bpy-4+bobDip,1,2); // antenna
    // Bite indicator
    if(p.state==='bite'){
      // "!" drawn on full-res canvas
      if(typeof textOverlays!=='undefined')textOverlays.push({type:'bite',x:bpx,y:bpy-12+bobDip});
      // Splash
      cx.fillStyle='rgba(180,220,255,0.4)';
      for(let s=0;s<3;s++){
        const sa=time*8+s*2.1,sr=3+Math.sin(sa)*2;
        cx.fillRect(bpx+Math.cos(sa)*sr,bpy-2+Math.sin(sa*1.3)*sr,1,1);
      }
    }
    if(p.state==='reeling'){
      cx.fillStyle='#111';cx.fillRect(bpx-10,bpy-7,20,2);
      cx.fillStyle='#22c55e';cx.fillRect(bpx-10,bpy-7,Math.floor(20*((p.reelProg||0)/100)),2);
    }
  }

  // Holding caught fish above head
  if(p.holdFish&&p.holdTimer>0){
    const f=p.holdFish;
    const alpha=Math.min(1,p.holdTimer);
    cx.globalAlpha=alpha;
    const maxSz=FISH_BY_NAME[f.name]||f;
    const sizeRatio=maxSz?f.size/maxSz.maxSz:0.5;
    const sc=0.7+sizeRatio*0.8; // scale factor
    const fishX=px;
    const fishY=py-18;
    const bob=Math.sin(time*3)*1;
    const fy=fishY+bob;

    // Shadow
    cx.fillStyle='rgba(0,0,0,0.15)';
    cx.beginPath();cx.ellipse(fishX,fy+8*sc,5*sc,2,0,0,Math.PI*2);cx.fill();

    // Draw unique sprite per fish type
    drawFishSprite(cx,f.name,f.rarity,fishX,fy,sc);

    // Sparkle for rare+
    if(f.rarity==='rare'||f.rarity==='epic'||f.rarity==='legendary'){
      cx.fillStyle=f.rarity==='legendary'?'#ffd700':'#fff';
      for(let s=0;s<3;s++){
        const sa=time*4+s*2.1;
        const sx2=fishX+Math.cos(sa)*6*sc;
        const sy2=fy+Math.sin(sa)*4*sc;
        cx.fillRect(Math.floor(sx2),Math.floor(sy2),1,1);
      }
    }

    cx.globalAlpha=1;
  }
}

let textOverlays=[];
let toastOverlay=null;
let sailingText=null;
let reelLabel=null;

function drawFishSprite(cx,n,rarity,fishX,fy,sc){
    if(n==='Seaweed'){
      cx.fillStyle='#2a6a3a';
      for(let i=0;i<4;i++){
        const sy=fy-i*3*sc+Math.sin(time*2+i)*sc;
        cx.fillRect(fishX-1*sc+Math.sin(time+i)*sc,sy,2*sc,3*sc);
      }
      cx.fillStyle='#3a8a4a';
      cx.fillRect(fishX-3*sc,fy+4*sc,2*sc,1*sc);
      cx.fillRect(fishX+2*sc,fy+4*sc,2*sc,1*sc);
    }else if(n==='Old Boot'){
      cx.fillStyle='#3a2a1a';
      cx.fillRect(fishX-4*sc,fy-1*sc,5*sc,5*sc);
      cx.fillRect(fishX-4*sc,fy-4*sc,3*sc,4*sc);
      cx.fillStyle='#5a4030';
      cx.fillRect(fishX-3*sc,fy,3*sc,2*sc);
      cx.fillStyle='#2a6a3a';
      cx.fillRect(fishX+1*sc,fy-3*sc,1*sc,1*sc); // algae
    }else if(n==='Tin Can'){
      cx.fillStyle='#8a8a9a';
      cx.fillRect(fishX-3*sc,fy-3*sc,6*sc,6*sc);
      cx.fillStyle='#aaaabc';
      cx.fillRect(fishX-3*sc,fy-3*sc,6*sc,1*sc);
      cx.fillRect(fishX-3*sc,fy+2*sc,6*sc,1*sc);
      cx.fillStyle='#6a6a7a';
      cx.fillRect(fishX-2*sc,fy-1*sc,4*sc,2*sc);
    }else if(n==='Plastic Bottle'){
      cx.fillStyle='rgba(180,220,255,0.7)';
      cx.fillRect(fishX-2*sc,fy-4*sc,4*sc,8*sc);
      cx.fillStyle='#60a0c0';
      cx.fillRect(fishX-1*sc,fy-5*sc,2*sc,2*sc);
      cx.fillStyle='#e03030';
      cx.fillRect(fishX-2*sc,fy-1*sc,4*sc,1*sc); // label
    }else if(n==='Old Tire'){
      cx.fillStyle='#1a1a1a';
      cx.beginPath();cx.arc(fishX,fy,6*sc,0,Math.PI*2);cx.fill();
      cx.fillStyle='#0a0a0a';
      cx.beginPath();cx.arc(fishX,fy,3*sc,0,Math.PI*2);cx.fill();
      cx.fillStyle='#2a2a2a';
      for(let i=0;i<6;i++){
        const a=i*Math.PI/3;
        cx.fillRect(fishX+Math.cos(a)*5*sc,fy+Math.sin(a)*5*sc,1*sc,1*sc);
      }
    }else if(n==='Driftwood'){
      cx.fillStyle='#6a4a2a';
      cx.fillRect(fishX-5*sc,fy-1*sc,10*sc,3*sc);
      cx.fillStyle='#8a6a3a';
      cx.fillRect(fishX-5*sc,fy-1*sc,10*sc,1*sc);
      cx.fillStyle='#4a2a1a';
      cx.fillRect(fishX-4*sc,fy+1*sc,1*sc,1*sc);
      cx.fillRect(fishX+2*sc,fy+1*sc,1*sc,1*sc);
    }else if(n==='Frog'){
      // Green frog body
      cx.fillStyle='#3a8a3a';
      cx.fillRect(fishX-4*sc,fy-2*sc,8*sc,5*sc); // body
      cx.fillStyle='#4aaa4a';
      cx.fillRect(fishX-3*sc,fy-1*sc,6*sc,3*sc); // belly
      // Eyes (big bulging)
      cx.fillStyle='#4aaa4a';
      cx.fillRect(fishX-4*sc,fy-4*sc,3*sc,3*sc);
      cx.fillRect(fishX+1*sc,fy-4*sc,3*sc,3*sc);
      cx.fillStyle='#fff';
      cx.fillRect(fishX-3*sc,fy-3*sc,2*sc,2*sc);
      cx.fillRect(fishX+2*sc,fy-3*sc,2*sc,2*sc);
      cx.fillStyle='#111';
      cx.fillRect(fishX-3*sc,fy-3*sc,1*sc,1*sc);
      cx.fillRect(fishX+2*sc,fy-3*sc,1*sc,1*sc);
      // Legs
      cx.fillStyle='#3a8a3a';
      cx.fillRect(fishX-5*sc,fy+3*sc,2*sc,2*sc);
      cx.fillRect(fishX+3*sc,fy+3*sc,2*sc,2*sc);
      // Feet
      cx.fillStyle='#2a6a2a';
      cx.fillRect(fishX-6*sc,fy+4*sc,3*sc,1*sc);
      cx.fillRect(fishX+3*sc,fy+4*sc,3*sc,1*sc);
    } else if(n==='Turtle'){
      // Shell
      cx.fillStyle='#6a5a3a';
      cx.beginPath();cx.ellipse(fishX,fy,5*sc,4*sc,0,0,Math.PI*2);cx.fill();
      cx.fillStyle='#8a7a4a';
      cx.beginPath();cx.ellipse(fishX,fy-1*sc,4*sc,3*sc,0,0,Math.PI*2);cx.fill();
      // Shell pattern
      cx.fillStyle='#6a5a3a';
      cx.fillRect(fishX-1*sc,fy-2*sc,2*sc,4*sc);
      cx.fillRect(fishX-3*sc,fy-0.5*sc,6*sc,1*sc);
      // Head
      cx.fillStyle='#5a8a4a';
      cx.fillRect(fishX-7*sc,fy-1*sc,3*sc,3*sc);
      cx.fillStyle='#111';cx.fillRect(fishX-6*sc,fy-1*sc,1*sc,1*sc);
      // Legs
      cx.fillStyle='#5a8a4a';
      cx.fillRect(fishX-4*sc,fy+3*sc,2*sc,2*sc);
      cx.fillRect(fishX+2*sc,fy+3*sc,2*sc,2*sc);
    } else if(n==='Eel'||n==='Electric Eel'){
      // Long wavy body
      cx.fillStyle='#4a4a8a';
      for(let i=0;i<6;i++){
        const ex=fishX-6*sc+i*2*sc;
        const ey2=fy+Math.sin(time*4+i)*1.5*sc;
        cx.fillRect(ex,ey2-1*sc,2.5*sc,2*sc);
      }
      cx.fillStyle='#6a6aba';
      for(let i=0;i<5;i++){
        const ex=fishX-5*sc+i*2*sc;
        const ey2=fy+Math.sin(time*4+i)*1.5*sc;
        cx.fillRect(ex,ey2-0.5*sc,2*sc,1*sc);
      }
      // Eye
      cx.fillStyle='#ff0';cx.fillRect(fishX-5*sc,fy-1.5*sc+Math.sin(time*4)*1.5*sc,1*sc,1*sc);
      // Lightning bolts
      if(n==='Electric Eel'){
        cx.fillStyle='#ff0';
        cx.fillRect(fishX+Math.sin(time*6)*3*sc,fy-3*sc,1*sc,2*sc);
        cx.fillRect(fishX+Math.cos(time*5)*2*sc,fy+2*sc,1*sc,2*sc);
      }
    } else if(n==='Octopus'){
      // Head
      cx.fillStyle='#8a3a6a';
      cx.beginPath();cx.ellipse(fishX,fy-2*sc,4*sc,3*sc,0,0,Math.PI*2);cx.fill();
      cx.fillStyle='#aa4a8a';
      cx.beginPath();cx.ellipse(fishX,fy-2*sc,3*sc,2*sc,0,0,Math.PI*2);cx.fill();
      // Eyes
      cx.fillStyle='#fff';cx.fillRect(fishX-2*sc,fy-3*sc,2*sc,2*sc);cx.fillRect(fishX+1*sc,fy-3*sc,2*sc,2*sc);
      cx.fillStyle='#111';cx.fillRect(fishX-1*sc,fy-2*sc,1*sc,1*sc);cx.fillRect(fishX+1*sc,fy-2*sc,1*sc,1*sc);
      // Tentacles (wavy)
      cx.fillStyle='#8a3a6a';
      for(let t=0;t<4;t++){
        const tx2=fishX+(-3+t*2)*sc;
        const ty2=fy+1*sc+Math.sin(time*3+t)*1.5*sc;
        cx.fillRect(tx2,ty2,1.5*sc,3*sc);
      }
    } else if(n==='Kraken'){
      // Big version of octopus
      cx.fillStyle='#4a1a3a';
      cx.beginPath();cx.ellipse(fishX,fy-2*sc,6*sc,4*sc,0,0,Math.PI*2);cx.fill();
      cx.fillStyle='#6a2a5a';
      cx.beginPath();cx.ellipse(fishX,fy-3*sc,5*sc,3*sc,0,0,Math.PI*2);cx.fill();
      cx.fillStyle='#f00';cx.fillRect(fishX-3*sc,fy-4*sc,2*sc,2*sc);cx.fillRect(fishX+1*sc,fy-4*sc,2*sc,2*sc);
      cx.fillStyle='#fff';cx.fillRect(fishX-2*sc,fy-3*sc,1*sc,1*sc);cx.fillRect(fishX+2*sc,fy-3*sc,1*sc,1*sc);
      cx.fillStyle='#4a1a3a';
      for(let t=0;t<6;t++){const tx2=fishX+(-5+t*2)*sc;cx.fillRect(tx2,fy+2*sc+Math.sin(time*3+t)*2*sc,1.5*sc,4*sc)}
    } else if(n==='Dragon'||n==='Golden Dragon'){
      // Dragon body
      cx.fillStyle='#c8a030';
      cx.beginPath();cx.ellipse(fishX,fy,5*sc,3*sc,0,0,Math.PI*2);cx.fill();
      cx.fillStyle='#f8d060';
      cx.beginPath();cx.ellipse(fishX,fy+1*sc,4*sc,2*sc,0,0,Math.PI*2);cx.fill();
      // Head
      cx.fillStyle='#c8a030';cx.fillRect(fishX-6*sc,fy-2*sc,3*sc,3*sc);
      // Horns
      cx.fillStyle='#a08020';cx.fillRect(fishX-6*sc,fy-4*sc,1*sc,2*sc);cx.fillRect(fishX-4*sc,fy-4*sc,1*sc,2*sc);
      // Eye
      cx.fillStyle='#f00';cx.fillRect(fishX-5*sc,fy-1*sc,1*sc,1*sc);
      // Wings
      cx.fillStyle='#c89030';
      cx.beginPath();cx.moveTo(fishX,fy-3*sc);cx.lineTo(fishX+3*sc,fy-7*sc);cx.lineTo(fishX+5*sc,fy-2*sc);cx.fill();
      // Tail
      cx.fillStyle='#c8a030';
      cx.fillRect(fishX+4*sc,fy-1*sc,3*sc,2*sc);
      cx.fillRect(fishX+6*sc,fy-2*sc,2*sc,1*sc);
      cx.fillRect(fishX+6*sc,fy+1*sc,2*sc,1*sc);
    } else if(n==='Phoenix'){
      // Fiery bird-fish
      cx.fillStyle='#e05020';
      cx.beginPath();cx.ellipse(fishX,fy,4*sc,3*sc,0,0,Math.PI*2);cx.fill();
      cx.fillStyle='#f08030';
      cx.beginPath();cx.ellipse(fishX,fy,3*sc,2*sc,0,0,Math.PI*2);cx.fill();
      // Flame tail
      cx.fillStyle='#f0a030';
      cx.beginPath();cx.moveTo(fishX+4*sc,fy);cx.lineTo(fishX+8*sc,fy-2*sc);cx.lineTo(fishX+6*sc,fy);cx.lineTo(fishX+8*sc,fy+2*sc);cx.fill();
      cx.fillStyle='#f0e040';
      cx.beginPath();cx.moveTo(fishX+4*sc,fy);cx.lineTo(fishX+7*sc,fy-1*sc);cx.lineTo(fishX+5*sc,fy);cx.lineTo(fishX+7*sc,fy+1*sc);cx.fill();
      // Eye
      cx.fillStyle='#fff';cx.fillRect(fishX-2*sc,fy-1*sc,2*sc,1*sc);
      cx.fillStyle='#111';cx.fillRect(fishX-2*sc,fy-1*sc,1*sc,1*sc);
    } else if(n==='Koi'){
      // White and orange koi
      cx.fillStyle='#f0e0d0';
      cx.beginPath();cx.ellipse(fishX,fy,5*sc,2.5*sc,0,0,Math.PI*2);cx.fill();
      cx.fillStyle='#e06030';
      cx.fillRect(fishX-2*sc,fy-2*sc,3*sc,2*sc);
      cx.fillRect(fishX+1*sc,fy,2*sc,2*sc);
      // Tail
      cx.fillStyle='#f0e0d0';
      cx.beginPath();cx.moveTo(fishX+5*sc,fy);cx.lineTo(fishX+7*sc,fy-2*sc);cx.lineTo(fishX+7*sc,fy+2*sc);cx.fill();
      // Eye
      cx.fillStyle='#111';cx.fillRect(fishX-4*sc,fy-1*sc,1*sc,1*sc);
    } else if(n==='Rainbow'){
      // Rainbow colored fish
      const cols=['#f44','#f80','#ff0','#4f4','#48f','#a4f'];
      for(let i=0;i<6;i++){
        cx.fillStyle=cols[i];
        cx.fillRect(fishX-4*sc+i*1.5*sc,fy-2*sc,1.8*sc,4*sc);
      }
      cx.fillStyle='#f44';
      cx.beginPath();cx.moveTo(fishX+5*sc,fy);cx.lineTo(fishX+7*sc,fy-2*sc);cx.lineTo(fishX+7*sc,fy+2*sc);cx.fill();
      cx.fillStyle='#fff';cx.fillRect(fishX-3*sc,fy-1*sc,1*sc,1*sc);
      cx.fillStyle='#111';cx.fillRect(fishX-3*sc,fy-1*sc,0.5*sc,0.5*sc);
    } else if(n==='Minnow'){
      // Tiny silver fish
      cx.fillStyle='#c0c8d0';
      cx.beginPath();cx.ellipse(fishX,fy,3*sc,1.2*sc,0,0,Math.PI*2);cx.fill();
      cx.fillStyle='#e0e8f0';
      cx.beginPath();cx.ellipse(fishX,fy+0.3*sc,2*sc,0.6*sc,0,0,Math.PI*2);cx.fill();
      cx.fillStyle='#c0c8d0';
      cx.beginPath();cx.moveTo(fishX+3*sc,fy);cx.lineTo(fishX+5*sc,fy-1*sc);cx.lineTo(fishX+5*sc,fy+1*sc);cx.fill();
      cx.fillStyle='#111';cx.fillRect(fishX-2*sc,fy-0.5*sc,0.8*sc,0.8*sc);
    } else if(n==='Goldfish'){
      // Orange/gold round fish with flowing tail
      cx.fillStyle='#f0a020';
      cx.beginPath();cx.ellipse(fishX,fy,4*sc,3.5*sc,0,0,Math.PI*2);cx.fill();
      cx.fillStyle='#f8c040';
      cx.beginPath();cx.ellipse(fishX,fy+1*sc,3*sc,2*sc,0,0,Math.PI*2);cx.fill();
      // Flowing tail
      cx.fillStyle='#f0a020';
      cx.beginPath();cx.moveTo(fishX+4*sc,fy);cx.lineTo(fishX+8*sc,fy-3*sc+Math.sin(time*3)*sc);cx.lineTo(fishX+6*sc,fy);cx.lineTo(fishX+8*sc,fy+3*sc+Math.sin(time*3+1)*sc);cx.fill();
      // Dorsal fin
      cx.beginPath();cx.moveTo(fishX-1*sc,fy-3.5*sc);cx.lineTo(fishX+1*sc,fy-5*sc);cx.lineTo(fishX+3*sc,fy-3*sc);cx.fill();
      cx.fillStyle='#111';cx.fillRect(fishX-2*sc,fy-1*sc,1*sc,1*sc);
    } else if(n==='Perch'){
      // Green-striped fish
      cx.fillStyle='#4a8a3a';
      cx.beginPath();cx.ellipse(fishX,fy,5*sc,2.5*sc,0,0,Math.PI*2);cx.fill();
      cx.fillStyle='#6aba5a';
      cx.beginPath();cx.ellipse(fishX,fy+0.5*sc,4*sc,1.5*sc,0,0,Math.PI*2);cx.fill();
      // Dark stripes
      cx.fillStyle='#2a5a1a';
      for(let i=0;i<4;i++){cx.fillRect(fishX-3*sc+i*2*sc,fy-2*sc,1*sc,4*sc)}
      cx.fillStyle='#4a8a3a';
      cx.beginPath();cx.moveTo(fishX+5*sc,fy);cx.lineTo(fishX+7*sc,fy-2*sc);cx.lineTo(fishX+7*sc,fy+2*sc);cx.fill();
      cx.fillStyle='#111';cx.fillRect(fishX-4*sc,fy-1*sc,1*sc,1*sc);
    } else if(n==='Bass'){
      // Large dark green fish with wide mouth
      cx.fillStyle='#2a5a2a';
      cx.beginPath();cx.ellipse(fishX,fy,6*sc,3*sc,0,0,Math.PI*2);cx.fill();
      cx.fillStyle='#4a8a4a';
      cx.beginPath();cx.ellipse(fishX,fy+1*sc,5*sc,2*sc,0,0,Math.PI*2);cx.fill();
      // Wide mouth

      cx.fillRect(fishX-3.3*sc,fy-2.3*sc,0.5*sc,0.5*sc);cx.fillRect(fishX+1.7*sc,fy-2.3*sc,0.5*sc,0.5*sc);
      // Dark tendrils
      cx.fillStyle='#0a0a1a';
      for(let t=0;t<6;t++){
        const ta=t*Math.PI*2/6+time*0.5;
        cx.fillRect(fishX+Math.cos(ta)*7*sc,fy+Math.sin(ta)*4*sc,1.5*sc,1.5*sc);
      }
      // Crown of void energy
      cx.fillStyle='#6a20a0';
      cx.fillRect(fishX-4*sc,fy-5.5*sc,1*sc,2*sc);cx.fillRect(fishX-1*sc,fy-6*sc,1*sc,2.5*sc);cx.fillRect(fishX+2*sc,fy-5.5*sc,1*sc,2*sc);
    } else {
      // Default fish shape for all others
      const fc=_FISH_COLS_DEFAULT[rarity]||_FISH_COLS_DEFAULT.common;
      const bw=5*sc, bh=2.5*sc;
      // Body
      cx.fillStyle=fc[0];
      cx.beginPath();cx.ellipse(fishX,fy,bw,bh,0,0,Math.PI*2);cx.fill();
      // Belly
      cx.fillStyle=fc[1];
      cx.beginPath();cx.ellipse(fishX,fy+bh*0.3,bw*0.7,bh*0.5,0,0,Math.PI*2);cx.fill();
      // Tail
      cx.fillStyle=fc[0];
      cx.beginPath();cx.moveTo(fishX+bw,fy);cx.lineTo(fishX+bw+3*sc,fy-2*sc);cx.lineTo(fishX+bw+3*sc,fy+2*sc);cx.closePath();cx.fill();
      // Fin
      cx.beginPath();cx.moveTo(fishX,fy-bh);cx.lineTo(fishX+1*sc,fy-bh-2*sc);cx.lineTo(fishX+2*sc,fy-bh);cx.fill();
      // Eye
      cx.fillStyle='#fff';cx.fillRect(fishX-bw*0.5,fy-bh*0.3,Math.max(1,1.5*sc),Math.max(1,1.5*sc));
      cx.fillStyle='#111';cx.fillRect(fishX-bw*0.5,fy-bh*0.2,Math.max(1,1*sc),Math.max(1,1*sc));
    }
}

function render(){
  textOverlays=[];toastOverlay=null;sailingText=null;reelLabel=null;
  bx.fillStyle='#2a4a2a';bx.fillRect(0,0,RW,RH);
  if(!gameStarted){ctx.fillStyle='#0a1628';ctx.fillRect(0,0,W,H);return}

  const sx=Math.max(0,Math.floor(camX/T)),sy=Math.max(0,Math.floor(camY/T));
  const ex=Math.min(MW,Math.ceil((camX+RW)/T)+1),ey=Math.min(MH,Math.ceil((camY+RH)/T)+1);

  const isl=ISLANDS[curIsland];
  // Perf: use pre-cached RGB values instead of parsing hex every frame
  const wc=isl._waterRgb;
  const oRgb=isl._oceanRgb;

  for(let ty=sy;ty<ey;ty++)for(let tx=sx;tx<ex;tx++){
    const t=map[ty][tx],px=tx*T-camX,py=ty*T-camY;
    if(t===0){
      // Grass - use island theme
      const gc=isl.grass[(tx+ty)%isl.grass.length];
      bx.fillStyle=gc;bx.fillRect(px,py,T+1,T+1);
      // Grass blades (slightly lighter)
      if((tx+ty)%3===0){bx.fillStyle=isl.grass[1]||gc;bx.fillRect(px+4,py+6,1,2);bx.fillRect(px+10,py+3,1,2)}
      if((tx*17+ty*23)%41===0){bx.fillStyle='rgba(0,0,0,0.08)';bx.fillRect(px+3,py+5,3,2)}
    }
    else if(t===1){
      // Water - use island theme with pre-cached RGB
      const w1=Math.sin(time*1.8+tx*0.7+ty*0.4)*10;
      const w2=Math.sin(time*2.5+tx*1.1+ty*0.8)*6;
      bx.fillStyle=`rgb(${wc.r},${(wc.g+w1)|0},${(wc.b+w2)|0})`;
      bx.fillRect(px,py,T+1,T+1);
      if(Math.sin(time*2.2+tx*2.3+ty*1.1)>0.85){
        bx.fillStyle='rgba(180,220,255,0.2)';bx.fillRect(px+5,py+4,3,1);
      }
      bx.fillStyle='rgba(255,255,255,0.06)';
      bx.fillRect(px+1,py+6+((Math.sin(time+tx)*2)|0),T-2,1);
    }
    else if(t===2){
      // Sand/shore
      bx.fillStyle=isl.sand;bx.fillRect(px,py,T+1,T+1);
      if((tx+ty)%3===0){bx.fillStyle='rgba(0,0,0,0.06)';bx.fillRect(px+5,py+7,2,1)}
    }
    else if(t===3){
      bx.fillStyle=(tx+ty)%2===0?'#5a5040':'#655a4a';bx.fillRect(px,py,T+1,T+1);
      bx.fillStyle='#4a4030';bx.fillRect(px+T-1,py,1,T);bx.fillRect(px,py+T-1,T,1);
    }
    else if(t===4){
      bx.fillStyle='#8a6a3a';bx.fillRect(px,py,T+1,T+1);
      bx.fillStyle='#7a5a2a';bx.fillRect(px,py+3,T,1);bx.fillRect(px,py+8,T,1);bx.fillRect(px,py+13,T,1);
      bx.fillStyle='rgba(0,0,0,0.1)';bx.fillRect(px,py+T-1,T,1);
    }
    else if(t===5){
      // Boat dock - wooden pier over water
      bx.fillStyle=isl.ocean||'#1a4080';bx.fillRect(px,py,T+1,T+1); // water underneath
      bx.fillStyle='#8a6a3a';bx.fillRect(px,py+2,T,T-4); // planks
      bx.fillStyle='#7a5a2a';bx.fillRect(px,py+5,T,1);bx.fillRect(px,py+10,T,1);
    }
    else if(t===7){
      // Secret cave entrance
      const gc2=isl.grass[(tx+ty)%isl.grass.length];
      bx.fillStyle=gc2;bx.fillRect(px,py,T+1,T+1);
      bx.fillStyle='#1a1a2a';bx.beginPath();bx.ellipse(px+T/2,py+T/2,5,6,0,0,Math.PI*2);bx.fill();
      bx.fillStyle='#2a2a3a';bx.fillRect(px+3,py+2,T-6,3);
      bx.fillStyle='#3a3a4a';bx.fillRect(px+2,py+1,T-4,2);
      // Sparkle hint
      if(Math.sin(time*3+px*0.1+py*0.1)>0.8){
        bx.fillStyle='rgba(255,220,100,0.4)';
        bx.fillRect(px+T/2-1,py+T/2-3,2,1);
      }
    }
    else if(t===6){
      // Ocean - use pre-cached oRgb
      const w1=Math.sin(time*1.2+tx*0.5+ty*0.3)*8;
      const w1f=w1|0;
      bx.fillStyle=`rgb(${oRgb.r},${oRgb.g+w1f},${oRgb.b+w1f})`;
      bx.fillRect(px,py,T+1,T+1);
      // Ocean waves
      bx.fillStyle='rgba(255,255,255,0.04)';
      const owy=py+7+Math.sin(time*0.8+tx*0.4)*3;
      bx.fillRect(px,Math.floor(owy),T,1);
      // Foam near shore
      if(Math.sin(time*2+tx+ty)>0.95){bx.fillStyle='rgba(255,255,255,0.1)';bx.fillRect(px+4,py+4,3,1)}
    }
  }

  // Draw boat at dock - use cached position
  const dockX=cachedDockTile.x*T-camX;
  const dockY=cachedDockTile.y*T-camY;
  // Boat body
  bx.fillStyle='#6a4a2a';
  bx.beginPath();bx.moveTo(dockX-12,dockY-4);bx.lineTo(dockX+20,dockY-4);
  bx.lineTo(dockX+16,dockY+4);bx.lineTo(dockX-8,dockY+4);bx.fill();
  bx.fillStyle='#8a6a3a';
  bx.fillRect(dockX-8,dockY-6,24,3);
  // Mast
  bx.fillStyle='#5a3a1a';bx.fillRect(dockX+4,dockY-18,2,14);
  // Sail
  bx.fillStyle='#e0d8c8';
  bx.beginPath();bx.moveTo(dockX+6,dockY-16);bx.lineTo(dockX+18,dockY-10);bx.lineTo(dockX+6,dockY-4);bx.fill();
  // Flag
  bx.fillStyle='#e03030';bx.fillRect(dockX+3,dockY-20,4,3);
  // Sign
  textOverlays.push({type:'label',text:'DOCK',x:dockX+4,y:dockY+10,color:'#ffd700'});

  // Perf: reeds and lily pads merged into single pass over visible tiles
  for(let ty=sy;ty<ey;ty++)for(let tx=sx;tx<ex;tx++){
    const tt=map[ty][tx];
    if(tt===2&&(tx+ty*3)%5===0){
      // Reeds along water edges - check if adjacent to water
      let adjWater=false;
      for(let dy=-1;dy<=1&&!adjWater;dy++)for(let dx=-1;dx<=1;dx++){
        const yy=ty+dy,xx=tx+dx;
        if(yy>=0&&yy<MH&&xx>=0&&xx<MW&&map[yy][xx]===1){adjWater=true;break}
      }
      if(adjWater){
        const px2=tx*T-camX,py2=ty*T-camY;
        const sway=Math.sin(time*1.5+tx*2)*1;
        bx.fillStyle='#5a7a3a';
        bx.fillRect(px2+3+sway,py2-6,1,10);
        bx.fillRect(px2+7+sway,py2-4,1,8);
        bx.fillStyle='#6a8a4a';
        bx.fillRect(px2+3+sway,py2-8,2,3);
        bx.fillRect(px2+7+sway,py2-6,2,3);
      }
    }else if(tt===1&&(tx*13+ty*7)%17===0){
      // Lily pads on water
      const px2=tx*T-camX,py2=ty*T-camY;
      const bob=Math.sin(time*0.8+tx+ty)*0.5;
      bx.fillStyle='#3a8a3a';
      bx.beginPath();bx.arc(px2+8,py2+8+bob,3,0,Math.PI*2);bx.fill();
      bx.fillStyle='#2a6a2a';
      bx.fillRect(px2+8,py2+7+bob,3,1);
      if((tx+ty)%7===0){
        bx.fillStyle='#f0a0c0';
        bx.fillRect(px2+7,py2+5+bob,2,2);
      }
    }
  }

  // Trees (themed by island)
  const tc=isl.treeCol;
  for(const t of trees){
    const px=Math.floor(t.x-camX),py=Math.floor(t.y-camY);
    if(px<-20||py<-20||px>RW+20||py>RH+20)continue;
    bx.fillStyle='rgba(0,0,0,0.12)';
    bx.beginPath();bx.ellipse(px+2,py+7,6,3,0,0,Math.PI*2);bx.fill();

    if(isl.treeType==='palm'){
      // Palm tree
      bx.fillStyle='#6a4a2a';bx.fillRect(px-1,py-2,3,10);
      bx.fillStyle=tc[0];bx.fillRect(px-6,py-6,5,3);bx.fillRect(px+2,py-6,5,3);
      bx.fillStyle=tc[1];bx.fillRect(px-5,py-8,4,3);bx.fillRect(px+2,py-8,4,3);
      bx.fillStyle=tc[2];bx.fillRect(px-2,py-9,5,2);
    } else if(isl.treeType==='pine'){
      bx.fillStyle='#5a3a1a';bx.fillRect(px-1,py-1,3,8);
      bx.fillStyle=tc[0];bx.fillRect(px-2,py-3,5,3);
      bx.fillStyle=tc[1];bx.fillRect(px-3,py-6,7,4);
      bx.fillStyle=tc[0];bx.fillRect(px-4,py-9,9,4);
      bx.fillStyle=tc[2];bx.fillRect(px-2,py-11,5,3);
    } else if(isl.treeType==='mushroom'){
      // Giant mushroom
      bx.fillStyle='#b0a090';bx.fillRect(px-1,py-1,3,8);
      bx.fillStyle=tc[0];bx.beginPath();bx.ellipse(px,py-4,6,4,0,0,Math.PI*2);bx.fill();
      bx.fillStyle=tc[1];bx.fillRect(px-2,py-5,2,2);bx.fillRect(px+1,py-3,2,2);
      bx.fillStyle=tc[2];bx.fillRect(px-4,py-2,2,1);
    } else if(isl.treeType==='dead'){
      // Charred dead tree
      bx.fillStyle=tc[0];bx.fillRect(px-1,py-2,3,10);
      bx.fillStyle=tc[1];bx.fillRect(px-4,py-4,3,2);bx.fillRect(px+2,py-6,3,2);
      bx.fillStyle=tc[2];bx.fillRect(px-3,py-6,2,2);
    } else if(isl.treeType==='crystal'){
      // Crystal pillars
      bx.fillStyle=tc[0];bx.fillRect(px-1,py-8,3,14);
      bx.fillStyle=tc[1];bx.fillRect(px-3,py-6,2,10);
      bx.fillStyle=tc[2];bx.fillRect(px+2,py-4,2,8);
      // Sparkle
      if(Math.sin(time*3+px)>0.8){bx.fillStyle='#fff';bx.fillRect(px,py-7,1,1)}
    } else if(isl.treeType==='coral'){
      // Coral formations
      bx.fillStyle=tc[0];bx.fillRect(px-2,py-4,5,8);
      bx.fillStyle=tc[1];bx.fillRect(px-4,py-2,3,5);bx.fillRect(px+2,py-3,3,5);
      bx.fillStyle=tc[2];bx.fillRect(px-1,py-6,3,3);
    } else if(isl.treeType==='cloud'){
      // Cloud puffs
      bx.fillStyle=tc[0];bx.beginPath();bx.ellipse(px,py-2,6,4,0,0,Math.PI*2);bx.fill();
      bx.fillStyle=tc[1];bx.beginPath();bx.ellipse(px-3,py,4,3,0,0,Math.PI*2);bx.fill();
      bx.fillStyle=tc[2];bx.beginPath();bx.ellipse(px+3,py-1,4,3,0,0,Math.PI*2);bx.fill();
    } else if(isl.treeType==='swamp'){
      // Swamp tree with hanging moss
      bx.fillStyle='#3a2a1a';bx.fillRect(px-1,py-2,3,10);
      bx.fillStyle=tc[0];bx.fillRect(px-5,py-5,11,5);
      bx.fillStyle=tc[1];bx.fillRect(px-4,py-7,9,4);
      // Hanging moss
      bx.fillStyle='#5a7a4a';
      bx.fillRect(px-4,py-1,1,4);bx.fillRect(px+4,py-1,1,3);bx.fillRect(px-2,py,1,3);
    } else {
      // Default round tree
      bx.fillStyle='#5a3a1a';bx.fillRect(px-1,py-1,3,8);
      bx.fillStyle=tc[0];bx.fillRect(px-5,py-4,11,6);
      bx.fillStyle=tc[1];bx.fillRect(px-4,py-7,9,5);
      bx.fillStyle=tc[2];bx.fillRect(px-3,py-8,7,3);
    }
  }

  // Perf: rocks and flowers merged into single pass over grass tiles
  const _flowerCols=['#f0e040','#e06080','#8080f0','#f0a040'];
  for(let ty=sy;ty<ey;ty++)for(let tx=sx;tx<ex;tx++){
    if(map[ty][tx]!==0)continue;
    const px2=tx*T-camX,py2=ty*T-camY;
    if((tx*11+ty*17)%31===0){
      bx.fillStyle='#7a7a7a';bx.fillRect(px2+4,py2+8,5,4);
      bx.fillStyle='#8a8a8a';bx.fillRect(px2+5,py2+7,3,3);
      bx.fillStyle='#6a6a6a';bx.fillRect(px2+4,py2+11,5,1);
    }
    if((tx*23+ty*19)%29===0){
      bx.fillStyle='#4a8a3a';bx.fillRect(px2+7,py2+6,1,4);
      bx.fillStyle=_flowerCols[(tx+ty)%4];bx.fillRect(px2+6,py2+4,3,3);
      bx.fillStyle='#fff';bx.fillRect(px2+7,py2+5,1,1);
    }
  }

  // Shop booths (open market stall with awning)
  function drawBooth(sx2,sy2,stripeCol){
    const spx=sx2*T-camX,spy=sy2*T-camY;
    const bw=T*3,bh=T*2;
    // Counter/table
    bx.fillStyle='#8a6a3a';bx.fillRect(spx,spy+bh-6,bw,6);
    bx.fillStyle='#9a7a4a';bx.fillRect(spx+1,spy+bh-5,bw-2,4);
    // Items on counter
    bx.fillStyle='#4a8af5';bx.fillRect(spx+4,spy+bh-9,4,3);  // rod
    bx.fillStyle='#e0a030';bx.fillRect(spx+12,spy+bh-9,3,3);  // bait
    bx.fillStyle='#7a5a3a';bx.fillRect(spx+20,spy+bh-10,5,4); // bag
    bx.fillStyle='#6a4a2a';bx.fillRect(spx+30,spy+bh-9,4,3);  // box
    // Awning posts
    bx.fillStyle='#5a3a1a';
    bx.fillRect(spx+1,spy-2,2,bh+2);
    bx.fillRect(spx+bw-3,spy-2,2,bh+2);
    // Awning (striped)
    for(let i=0;i<bw;i+=4){
      bx.fillStyle=i%8<4?stripeCol:'#f0e8d8';
      bx.fillRect(spx+i,spy-6,4,5);
    }
    // Awning shadow
    bx.fillStyle='rgba(0,0,0,0.1)';bx.fillRect(spx,spy-1,bw,2);
    // Sign hanging from awning
    bx.fillStyle='#3a2a1a';bx.fillRect(spx+bw/2-8,spy-10,16,5);
    textOverlays.push({type:'label',text:'SHOP',x:spx+bw/2,y:spy-7,color:'#ffd700'});
    // Shopkeeper (little NPC behind counter)
    bx.fillStyle='#f5c06a';bx.fillRect(spx+bw/2-2,spy+bh-16,4,4); // head
    bx.fillStyle='#2a6a2a';bx.fillRect(spx+bw/2-2,spy+bh-12,4,5); // body
    bx.fillStyle='#222';bx.fillRect(spx+bw/2-1,spy+bh-14,1,1);bx.fillRect(spx+bw/2+1,spy+bh-14,1,1); // eyes
  }
  // Use cached shop position
  drawBooth(cachedShopTile.x,cachedShopTile.y,'#c03030');

  // Ambient fish in water (more realistic movement)
  bx.globalAlpha=0.35;
  for(let i=0;i<6;i++){
    const speed=0.2+i*0.05;
    const fx=35*T+Math.sin(time*speed+i*2.1)*7*T-camX;
    const fy=25*T+Math.cos(time*(speed*0.8)+i*1.7)*6*T-camY;
    if(fx<-10||fy<-10||fx>RW+10||fy>RH+10)continue;
    const dir=Math.cos(time*speed+i*2.1)>0?1:-1;
    const tailWag=Math.sin(time*6+i)*1.5;
    bx.fillStyle=i<3?'#5a9adc':'#7abc8a';
    // Body
    bx.beginPath();bx.ellipse(Math.floor(fx),Math.floor(fy),4,2,0,0,Math.PI*2);bx.fill();
    // Tail
    bx.beginPath();
    bx.moveTo(Math.floor(fx)+4*dir,Math.floor(fy));
    bx.lineTo(Math.floor(fx)+7*dir,Math.floor(fy)-2+tailWag);
    bx.lineTo(Math.floor(fx)+7*dir,Math.floor(fy)+2+tailWag);
    bx.fill();
  }
  bx.globalAlpha=1;

  // Quest giver NPC
  const qgx=Math.floor(questGiverPos.x-camX),qgy=Math.floor(questGiverPos.y-camY);
  if(qgx>=-20&&qgy>=-20&&qgx<=RW+20&&qgy<=RH+20){
    // Shadow
    bx.fillStyle='rgba(0,0,0,0.2)';
    bx.beginPath();bx.ellipse(qgx,qgy+6,5,2,0,0,Math.PI*2);bx.fill();
    // Body - old fisherman in blue outfit
    bx.fillStyle='#1e40af';bx.fillRect(qgx-3,qgy-3,7,7);
    // Head
    bx.fillStyle='#e0b080';bx.fillRect(qgx-2,qgy-8,5,5);
    // Grey beard
    bx.fillStyle='#ccc';bx.fillRect(qgx-2,qgy-4,5,2);
    // Yellow hat
    bx.fillStyle='#eab308';bx.fillRect(qgx-3,qgy-10,7,3);
    bx.fillStyle='#a07010';bx.fillRect(qgx-4,qgy-8,9,1);
    // Eyes
    bx.fillStyle='#111';bx.fillRect(qgx-1,qgy-6,1,1);bx.fillRect(qgx+1,qgy-6,1,1);
    // Arms
    bx.fillStyle='#1e40af';bx.fillRect(qgx-4,qgy-2,2,4);bx.fillRect(qgx+3,qgy-2,2,4);
    // Legs
    bx.fillStyle='#3a2a1a';bx.fillRect(qgx-2,qgy+4,2,3);bx.fillRect(qgx+1,qgy+4,2,3);
    // ! indicator floating above
    const bobble=Math.sin(time*3)*1;
    bx.fillStyle='#ffd700';
    bx.fillRect(qgx-1,qgy-16+bobble,2,4);
    bx.fillRect(qgx-1,qgy-11+bobble,2,1);
    // Label
    textOverlays.push({type:'name',text:QUEST_NAMES[curIsland],x:qgx,y:qgy-20+bobble,isMe:false});
  }

  // Boss King rendering
  if(bossActive && bossPos.x>0){
    const bx2=Math.floor(bossPos.x-camX),by2=Math.floor(bossPos.y-camY);
    if(bx2>=-30&&by2>=-30&&bx2<=RW+30&&by2<=RH+30){
      const w=WORLDS.find(ww=>ww.bossIsland===curIsland);
      const bossCol=w?w.color:'#ff0000';
      const wobble2=Math.sin(time*2)*2;

      // Large shadow
      bx.fillStyle='rgba(0,0,0,0.3)';
      bx.beginPath();bx.ellipse(bx2,by2+12,10,4,0,0,Math.PI*2);bx.fill();

      // Cape (flowing behind)
      bx.fillStyle='rgba(180,0,0,0.8)';
      const capeWave=Math.sin(time*3)*3;
      bx.beginPath();
      bx.moveTo(bx2-7,by2-6+wobble2);
      bx.lineTo(bx2-10+capeWave,by2+10);
      bx.lineTo(bx2+11-capeWave,by2+10);
      bx.lineTo(bx2+8,by2-6+wobble2);
      bx.fill();

      // Legs
      bx.fillStyle='#2a1a1a';
      bx.fillRect(bx2-5,by2+6,4,6);bx.fillRect(bx2+2,by2+6,4,6);

      // Body
      bx.fillStyle=bossCol;
      bx.fillRect(bx2-7,by2-8+wobble2,15,15);
      bx.fillStyle='rgba(0,0,0,0.2)';
      bx.fillRect(bx2-5,by2-2+wobble2,11,2);

      // Arms
      bx.fillStyle=bossCol;
      bx.fillRect(bx2-10,by2-5+wobble2,4,8);
      bx.fillRect(bx2+7,by2-5+wobble2,4,8);

      // Head
      bx.fillStyle='#d0a070';
      bx.fillRect(bx2-5,by2-16+wobble2,11,9);

      // Evil eyes (red glow)
      bx.fillStyle='#ff0000';
