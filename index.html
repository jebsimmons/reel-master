<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reel Master - Online</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:#0a1628;overflow:hidden;font-family:monospace;user-select:none;color:#fff}
  canvas{display:block;image-rendering:pixelated;image-rendering:crisp-edges}

  /* Screens */
  .screen{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:100;background:#0a1628}
  .screen h1{font-size:48px;color:#5be0f5;text-shadow:3px 3px 0 #1a5a6e;margin-bottom:4px}
  .screen .sub{font-size:15px;color:#4a6a8a;margin-bottom:20px}

  .avatar-row{display:flex;gap:10px;margin-bottom:16px;flex-wrap:wrap;justify-content:center}
  .avatar-pick{
    width:44px;height:44px;border-radius:6px;cursor:pointer;
    border:3px solid transparent;display:flex;align-items:center;justify-content:center;
    font-size:22px;transition:border-color 0.15s;
  }
  .avatar-pick:hover{border-color:#5a8af5}
  .avatar-pick.sel{border-color:#5be0f5}

  input[type=text]{
    width:240px;padding:10px 16px;font-size:16px;font-family:monospace;
    background:#1a2a4a;border:2px solid #2a3a5a;color:#fff;
    text-align:center;margin-bottom:12px;border-radius:4px;outline:none;
  }
  input:focus{border-color:#5be0f5}

  .btn{
    padding:12px 36px;font-size:17px;font-weight:700;font-family:monospace;
    border:none;border-bottom:4px solid;cursor:pointer;color:#fff;
    text-transform:uppercase;letter-spacing:2px;margin:4px;
  }
  .btn:hover{filter:brightness(1.15)}
  .btn:active{border-bottom-width:2px;margin-top:6px}
  .btn-green{background:#22c55e;border-color:#1a8a3a}
  .btn-blue{background:#3b82f6;border-color:#1e40af}
  .btn-orange{background:#f59e0b;border-color:#b45309}
  .btn-sm{padding:8px 20px;font-size:14px}

  .row{display:flex;gap:8px;margin-bottom:12px}

  .room-code{
    font-size:36px;color:#ffd700;letter-spacing:6px;
    background:#1a2a4a;padding:12px 28px;border-radius:6px;
    border:2px solid #3a4a6a;margin:12px 0;
  }
  .waiting{color:#5a7a9a;font-size:14px;margin-top:8px}
  .dot-anim::after{content:'';animation:dots 1.5s infinite}
  @keyframes dots{0%{content:''}33%{content:'.'}66%{content:'..'}100%{content:'...'}}

  .status-msg{color:#4ade80;font-size:14px;margin:8px 0}
  .error-msg{color:#f56565;font-size:14px;margin:8px 0}

  /* HUD */
  #hud{
    position:fixed;top:0;left:0;right:0;height:30px;
    display:none;align-items:center;justify-content:space-between;
    padding:0 12px;background:rgba(0,0,0,0.75);
    font-size:13px;z-index:10;
  }
  .hud-coins{color:#ffd700}
  .hud-bag{color:#7dd3fc}
  .hud-status{color:#5a7a9a;font-size:11px}

  /* Leaderboard */
  #leaderboard{
    position:fixed;right:8px;top:38px;width:155px;
    background:rgba(0,0,0,0.75);border:1px solid #2a2a4e;
    padding:8px;font-size:11px;display:none;z-index:10;
  }
  #leaderboard h4{text-align:center;color:#ffd700;margin-bottom:6px;font-size:12px}
  .lb-row{display:flex;justify-content:space-between;padding:2px 4px;border-bottom:1px solid #1a1a3e}
  .lb-row.me{color:#5be0f5}

  /* Hotbar */
  /* Backpack button */
  #bp-btn{
    position:fixed;bottom:12px;left:12px;
    width:50px;height:50px;
    background:rgba(0,0,0,0.8);border:2px solid #2a3a5a;
    border-radius:10px;cursor:pointer;
    display:none;z-index:15;
    font-size:24px;line-height:50px;text-align:center;
    transition:border-color 0.15s;
  }
  #bp-btn:hover{border-color:#5be0f5}
  #mute-btn{position:fixed;top:4px;right:4px;width:28px;height:28px;background:rgba(0,0,0,0.6);border:1px solid #333;border-radius:4px;color:#fff;font-size:14px;cursor:pointer;z-index:15;display:none;text-align:center;line-height:28px}

  /* Boat button */
  #boat-btn{
    position:fixed;bottom:12px;left:70px;
    width:50px;height:50px;
    background:rgba(0,0,0,0.8);border:2px solid #1a4a6a;
    border-radius:10px;cursor:pointer;
    display:none;z-index:15;
    font-size:22px;line-height:50px;text-align:center;
    transition:border-color 0.15s;
  }
  #boat-btn:hover{border-color:#5be0f5}
  #boat-btn.at-dock{border-color:#5be0f5;box-shadow:0 0 8px rgba(91,224,245,0.4)}
  #bp-btn .bp-count{
    position:absolute;top:-4px;right:-4px;
    background:#e03030;color:#fff;font-size:10px;font-family:monospace;font-weight:700;
    padding:1px 5px;border-radius:8px;min-width:16px;text-align:center;
  }

  /* Backpack panel */
  #bp-panel{
    position:fixed;bottom:70px;left:12px;
    width:320px;max-width:85vw;max-height:70vh;overflow-y:auto;
    background:rgba(0,0,0,0.9);border:2px solid #2a3a5a;
    border-radius:10px;padding:14px;
    font-family:monospace;font-size:12px;color:#fff;
    display:none;z-index:14;
  }
  #bp-panel h4{text-align:center;margin-bottom:8px;font-size:14px}
  .bp-tab-row{display:flex;gap:4px;margin-bottom:10px;justify-content:center}
  .bp-tab{
    padding:5px 14px;border:1px solid #2a3a5a;background:#0a0a2e;
    color:#5a7a9a;font-family:monospace;font-size:12px;cursor:pointer;border-radius:4px;
  }
  .bp-tab:hover{border-color:#5a8af5;color:#fff}
  .bp-tab.active{border-color:#5be0f5;color:#5be0f5;background:#0a1a3e}
  .bp-item{
    display:flex;justify-content:space-between;align-items:center;
    padding:6px 8px;background:#0a0a2e;border:1px solid #1a1a3e;
    margin-bottom:3px;border-radius:4px;
  }
  .bp-item-info{display:flex;align-items:center;gap:8px}
  .bp-item-icon{
    width:28px;height:22px;border-radius:3px;display:flex;
    align-items:center;justify-content:center;font-size:14px;
  }
  .bp-item-name{font-size:12px}
  .bp-item-detail{font-size:10px;color:#5a7a9a}
  .bp-item-btn{
    padding:3px 8px;border:1px solid;font-family:monospace;font-size:11px;
    font-weight:700;cursor:pointer;border-radius:3px;
  }
  .bp-sell-btn{border-color:#b08020;background:#f5a623;color:#111}
  .bp-sell-btn:hover{background:#ffc040}
  .bp-equip-btn{border-color:#2a8a4a;background:#22c55e;color:#fff}
  .bp-equip-btn:hover{background:#16a34a}
  .bp-equipped{color:#4ade80;font-size:11px;font-weight:700}
  .bp-sail-btn{border-color:#1a6a9a;background:#0ea5e9;color:#fff}
  .bp-sail-btn:hover{background:#0284c7}
  .fp-sell-all{
    width:100%;padding:7px;margin-top:6px;
    border:1px solid #b08020;background:#f5a623;
    color:#111;font-family:monospace;font-size:12px;font-weight:700;
    cursor:pointer;border-radius:4px;
  }
  .fp-sell-all:hover{background:#ffc040}
  .fp-empty{color:#3a3a5e;text-align:center;padding:14px 0}

  /* Shop */
  #shop-modal{
    position:fixed;inset:0;background:rgba(0,0,0,0.7);
    display:none;align-items:center;justify-content:center;z-index:50;
  }
  .shop-box{
    background:#111;border:2px solid #444;padding:16px 20px;
    width:340px;max-width:95vw;
  }
  .shop-box h2{text-align:center;color:#f5a623;font-size:18px;margin-bottom:2px}
  .shop-coins-d{text-align:center;color:#ffd700;margin-bottom:10px;font-size:13px}
  .shop-item{
    display:flex;justify-content:space-between;align-items:center;
    padding:6px 8px;background:#0a0a1e;border:1px solid #1a1a3e;margin-bottom:3px;
  }
  .shop-item h4{font-size:12px;color:#ccc}
  .shop-item p{font-size:10px;color:#666}
  .shop-buy{
    padding:3px 10px;border:1px solid #2a8a4a;background:#22c55e;
    color:#fff;font-family:monospace;font-size:11px;font-weight:700;cursor:pointer;
  }
  .shop-buy:disabled{opacity:0.3;cursor:not-allowed}
  .shop-owned{color:#4ade80;font-size:11px}
  .shop-close{
    display:block;margin:10px auto 0;padding:6px 20px;
    border:1px solid #555;background:#333;color:#fff;font-family:monospace;font-size:13px;cursor:pointer;
  }

  /* Admin Panel */
  #admin-modal{
    position:fixed;inset:0;background:rgba(0,0,0,0.85);
    display:none;align-items:center;justify-content:center;z-index:200;
  }
  .admin-box{
    background:#0a0a1a;border:2px solid #ff4444;padding:16px 20px;
    width:380px;max-width:95vw;max-height:85vh;overflow-y:auto;
    font-family:monospace;color:#fff;border-radius:8px;
  }
  .admin-box h2{text-align:center;color:#ff4444;font-size:18px;margin-bottom:10px}
  .admin-section{margin-bottom:12px}
  .admin-section h4{color:#ff8888;font-size:12px;text-transform:uppercase;margin-bottom:6px;border-bottom:1px solid #2a1a1a;padding-bottom:3px}
  .admin-row{
    display:flex;justify-content:space-between;align-items:center;
    padding:4px 6px;margin-bottom:3px;background:#111;border:1px solid #1a1a2a;border-radius:3px;
  }
  .admin-row label{font-size:12px;color:#ccc}
  .admin-btn{
    padding:3px 10px;border:1px solid #ff4444;background:#cc0000;
    color:#fff;font-family:monospace;font-size:11px;font-weight:700;cursor:pointer;border-radius:3px;
  }
  .admin-btn:hover{background:#ff2222}
  .admin-btn-green{border-color:#2a8a4a;background:#22c55e}
  .admin-btn-green:hover{background:#16a34a}
  .admin-btn-gold{border-color:#b08020;background:#f5a623;color:#111}
  .admin-btn-gold:hover{background:#ffc040}
  .admin-input{
    width:70px;padding:3px 6px;font-family:monospace;font-size:12px;
    background:#1a1a2a;border:1px solid #333;color:#fff;text-align:center;border-radius:3px;
  }
  .admin-close{
    display:block;margin:10px auto 0;padding:6px 20px;
    border:1px solid #555;background:#333;color:#fff;font-family:monospace;font-size:13px;cursor:pointer;
  }
  #admin-login{text-align:center}
  #admin-login input{
    width:120px;padding:8px;font-size:18px;font-family:monospace;
    background:#1a1a2a;border:2px solid #333;color:#fff;text-align:center;
    letter-spacing:6px;border-radius:4px;margin-bottom:10px;
  }
  #admin-login input:focus{border-color:#ff4444;outline:none}
  .admin-wrong{color:#ff4444;font-size:12px;margin-top:6px}

  /* Tutorial */
  #tutorial{
    position:fixed;inset:0;display:none;align-items:center;justify-content:center;
    z-index:60;background:rgba(0,0,0,0.65);
  }
  .tut-box{
    background:#0f1e38;border:2px solid #2a4a7a;border-radius:12px;
    padding:24px 32px;color:#fff;text-align:center;
    max-width:380px;font-family:monospace;animation:popIn 0.3s ease;
  }
  .tut-box h2{font-size:20px;color:#5be0f5;margin-bottom:8px}
  .tut-box p{font-size:14px;color:#b0c4de;line-height:1.7;margin-bottom:16px}
  .tut-box .tut-keys{
    display:inline-block;background:#1a2a4a;border:1px solid #3a5a8a;
    padding:3px 10px;border-radius:4px;font-size:13px;color:#ffd700;
    margin:2px;
  }
  .tut-box .tut-step{color:#5a7a9a;font-size:12px;margin-bottom:10px}
  .tut-box img{image-rendering:pixelated}
  .btn-tut{
    padding:10px 32px;font-size:16px;font-weight:700;font-family:monospace;
    border:none;border-bottom:3px solid #1a8a3a;
    background:#22c55e;color:#fff;cursor:pointer;text-transform:uppercase;
  }
  .btn-tut:hover{background:#16a34a}
  .btn-skip{
    display:block;margin:10px auto 0;background:none;border:none;
    color:#5a7a9a;font-family:monospace;font-size:12px;cursor:pointer;
  }
  .btn-skip:hover{color:#fff}

  /* Travel modal */
  #travel-modal{
    position:fixed;inset:0;background:rgba(0,0,0,0.75);
    display:none;align-items:center;justify-content:center;z-index:50;
  }
  .travel-box{
    background:#0f1e38;border:2px solid #2a4a7a;padding:16px 20px;
    width:380px;max-width:95vw;max-height:80vh;overflow-y:auto;font-family:monospace;color:#fff;
  }
  .travel-box h2{text-align:center;color:#5be0f5;font-size:18px;margin-bottom:12px}
  .island-card{
    padding:8px 10px;background:#0a0a2e;border:1px solid #1a1a3e;
    margin-bottom:4px;display:flex;justify-content:space-between;align-items:center;
    cursor:pointer;border-radius:4px;
  }
  .island-card:hover{border-color:#3a5a8a}
  .island-card.current{border-color:#5be0f5;background:#0a1a3e}
  .island-card.locked{opacity:0.4;cursor:default}
  .island-card h4{font-size:13px;color:#ccc}
  .island-card p{font-size:10px;color:#5a7a9a}
  .island-card .island-price{color:#ffd700;font-size:12px;font-weight:700}
  .island-card .island-current{color:#5be0f5;font-size:11px}
  .island-card .island-unlocked{color:#4ade80;font-size:11px}
  .travel-close{
    display:block;margin:10px auto 0;padding:6px 20px;
    border:1px solid #555;background:#333;color:#fff;font-family:monospace;font-size:13px;cursor:pointer;
  }
  /* Island name display */
  #island-name{
    position:fixed;top:34px;left:50%;transform:translateX(-50%);
    background:rgba(0,0,0,0.6);padding:3px 14px;border-radius:0 0 8px 8px;
    color:#5be0f5;font-family:monospace;font-size:12px;font-weight:700;
    z-index:10;display:none;
  }

  /* Active quest tracker */
  #quest-tracker{
    position:fixed;right:8px;top:38px;width:180px;
    background:rgba(10,15,30,0.55);backdrop-filter:blur(4px);
    border:1px solid rgba(91,224,245,0.4);border-radius:6px;
    padding:8px 10px;font-family:monospace;color:#fff;font-size:11px;
    display:none;z-index:10;
  }
  #quest-tracker .qt-label{
    color:#5be0f5;font-size:10px;text-transform:uppercase;letter-spacing:1px;margin-bottom:3px;
  }
  #quest-tracker .qt-title{color:#fff;font-size:12px;font-weight:700;margin-bottom:4px}
  #quest-tracker .qt-desc{color:#b0c4de;font-size:10px;line-height:1.4;margin-bottom:6px}
  #quest-tracker .qt-progress-bar{
    background:rgba(0,0,0,0.4);height:4px;border-radius:2px;overflow:hidden;margin-bottom:4px;
  }
  #quest-tracker .qt-progress-fill{
    background:linear-gradient(90deg,#4ade80,#5be0f5);height:100%;
  }
  #quest-tracker .qt-progress-text{color:#4ade80;font-size:11px;text-align:right}
  #quest-tracker .qt-reward{color:#ffd700;font-size:10px;margin-top:4px;text-align:center}
  #quest-tracker.complete{border-color:#4ade80;background:rgba(20,40,20,0.55)}

  /* Quest modal */
  #quest-modal{
    position:fixed;inset:0;background:rgba(0,0,0,0.7);
    display:none;align-items:center;justify-content:center;z-index:50;
  }
  .quest-box{
    background:#0f1e38;border:2px solid #5be0f5;padding:20px 24px;
    width:380px;max-width:95vw;font-family:monospace;color:#fff;
    border-radius:8px;
  }
  .quest-box h2{text-align:center;color:#5be0f5;font-size:20px;margin-bottom:4px}
  .quest-box .giver-name{text-align:center;color:#fbbf24;font-size:13px;margin-bottom:12px}
  .quest-desc{background:#0a0a2e;padding:10px;border:1px solid #1a1a3e;border-radius:4px;margin-bottom:10px;font-size:13px;line-height:1.5}
  .quest-progress{text-align:center;color:#4ade80;font-size:14px;margin:10px 0}
  .quest-reward{text-align:center;color:#ffd700;font-size:14px;margin-bottom:12px}
  .quest-btn-row{display:flex;gap:6px;justify-content:center}
  .quest-btn{
    padding:8px 20px;border:1px solid;font-family:monospace;font-size:13px;font-weight:700;cursor:pointer;border-radius:4px;
  }
  .quest-accept{border-color:#2a8a4a;background:#22c55e;color:#fff}
  .quest-accept:hover{background:#16a34a}
  .quest-close-btn{border-color:#555;background:#333;color:#fff}
  .quest-turn-in{border-color:#b08020;background:#f5a623;color:#111}

  .hidden{display:none!important}

  /* Streak indicator */
  #streak-display{
    position:fixed;top:34px;left:12px;
    background:rgba(255,150,0,0.15);border:1px solid rgba(255,150,0,0.4);
    padding:3px 10px;border-radius:4px;
    color:#ffa500;font-family:monospace;font-size:12px;font-weight:700;
    display:none;z-index:10;
  }
  #streak-display.hot{background:rgba(255,50,0,0.2);border-color:#ff3300;color:#ff3300}

  /* Weather indicator */
  #weather-display{
    position:fixed;top:34px;right:170px;
    background:rgba(0,0,0,0.5);
    padding:2px 8px;border-radius:4px;
    color:#b0c4de;font-family:monospace;font-size:11px;
    display:none;z-index:10;
  }
</style>
</head>
<body>

<canvas id="c"></canvas>
<button id="mute-btn" onclick="toggleMute()">&#128266;</button>

<!-- HUD -->
<div id="hud">
  <div style="display:flex;gap:16px;align-items:center">
    <span style="color:#5be0f5">Lv.<span id="h-level">1</span></span>
    <span style="color:#7dd3fc;font-size:10px"><span id="h-xp">0</span>/<span id="h-xpmax">50</span>XP</span>
    <span class="hud-coins">$<span id="h-coins">0</span></span>
    <span class="hud-bag">Bag: <span id="h-bag">0</span>/<span id="h-bmax">5</span></span>
    <span id="h-rod" style="color:#c084fc;font-size:11px"></span>
  </div>
  <span class="hud-status" id="h-status"></span>
  <button id="name-btn" onclick="changeName()" style="background:none;border:1px solid #3a5a8a;color:#5be0f5;font-family:monospace;font-size:11px;padding:2px 8px;cursor:pointer;border-radius:3px">Name</button>
</div>
<div id="streak-display"></div>
<div id="weather-display"></div>
<div id="leaderboard"><h4>LEADERBOARD</h4><div id="lb-rows"></div></div>
<button id="admin-btn" onclick="toggleAdmin()" style="position:fixed;bottom:68px;left:12px;width:50px;height:50px;background:rgba(0,0,0,0.8);border:2px solid #ff4444;border-radius:10px;cursor:pointer;display:none;z-index:15;font-size:20px;line-height:50px;text-align:center;color:#ff4444;font-family:monospace;font-weight:700">⚙</button>
<button id="bp-btn" onclick="toggleBackpack()">&#127890;<div class="bp-count" id="bp-count">0</div></button>
<button id="boat-btn" onclick="clickBoatBtn()">&#9973;</button>
<button id="tourney-btn" style="position:fixed;bottom:12px;left:128px;width:50px;height:50px;background:rgba(0,0,0,0.8);border:2px solid #f5a623;border-radius:10px;cursor:pointer;display:none;z-index:15;font-size:20px;line-height:50px;text-align:center;color:#f5a623;font-family:monospace" onclick="startTournament()">&#127942;</button>
<div id="bp-panel">
  <div class="bp-tab-row">
    <div class="bp-tab active" onclick="switchBpTab('fish')">Bag</div>
    <div class="bp-tab" onclick="switchBpTab('index')">Index</div>
    <div class="bp-tab" onclick="switchBpTab('rods')">Rods</div>
    <div class="bp-tab" onclick="switchBpTab('items')">Items</div>
    <div class="bp-tab" onclick="switchBpTab('tank')">Tank</div>
  </div>
  <div id="bp-content"></div>
</div>
<div id="shop-modal"><div class="shop-box" id="shop-content"></div></div>
<div id="travel-modal"><div class="travel-box" id="travel-content"></div></div>
<div id="quest-modal"><div class="quest-box" id="quest-content"></div></div>
<div id="quest-tracker"></div>
<div id="island-name"></div>

<!-- TUTORIAL -->
<div id="tutorial">
  <div class="tut-box" id="tut-content"></div>
</div>

<!-- TITLE SCREEN -->
<div class="screen" id="screen-title">
  <h1>REEL MASTER</h1>
  <p class="sub">pixel fishing</p>
  <p style="color:#5a7a9a;font-size:13px;margin-bottom:14px">Choose your look:</p>
  <div class="avatar-row" id="avatar-row"></div>
  <input id="name-input" type="text" placeholder="Enter username..." maxlength="14">
  <button class="btn btn-green" onclick="startSolo()">PLAY</button>
</div>

<!-- ADMIN PANEL -->
<div id="admin-modal">
  <div class="admin-box">
    <h2>ADMIN PANEL</h2>
    <div id="admin-login">
      <p style="color:#888;font-size:12px;margin-bottom:8px">Enter password:</p>

let muted=false;
window.toggleMute=function(){muted=!muted;$('mute-btn').textContent=muted?'\u{1F507}':'\u{1F50A}'};
const SFX={
  ctx:null,
  init(){if(!this.ctx)this.ctx=new(window.AudioContext||window.webkitAudioContext)()},
  play(type){
    if(muted)return;
    if(!this.ctx)return;
    if(this.ctx.state==='suspended')this.ctx.resume();
    const o=this.ctx.createOscillator();
    const g=this.ctx.createGain();
    o.connect(g);g.connect(this.ctx.destination);
    if(type==='cast'){o.type='sine';o.frequency.setValueAtTime(300,this.ctx.currentTime);o.frequency.linearRampToValueAtTime(600,this.ctx.currentTime+0.15);g.gain.setValueAtTime(0.15,this.ctx.currentTime);g.gain.linearRampToValueAtTime(0,this.ctx.currentTime+0.2);o.start();o.stop(this.ctx.currentTime+0.2)}
    else if(type==='splash'){o.type='sawtooth';o.frequency.setValueAtTime(200,this.ctx.currentTime);o.frequency.linearRampToValueAtTime(80,this.ctx.currentTime+0.3);g.gain.setValueAtTime(0.08,this.ctx.currentTime);g.gain.linearRampToValueAtTime(0,this.ctx.currentTime+0.3);o.start();o.stop(this.ctx.currentTime+0.3)}
    else if(type==='bite'){o.type='square';o.frequency.setValueAtTime(800,this.ctx.currentTime);o.frequency.setValueAtTime(600,this.ctx.currentTime+0.05);o.frequency.setValueAtTime(800,this.ctx.currentTime+0.1);g.gain.setValueAtTime(0.12,this.ctx.currentTime);g.gain.linearRampToValueAtTime(0,this.ctx.currentTime+0.15);o.start();o.stop(this.ctx.currentTime+0.15)}
    else if(type==='catch'){o.type='sine';const now=this.ctx.currentTime;o.frequency.setValueAtTime(400,now);o.frequency.setValueAtTime(500,now+0.1);o.frequency.setValueAtTime(600,now+0.2);o.frequency.setValueAtTime(800,now+0.3);g.gain.setValueAtTime(0.15,now);g.gain.linearRampToValueAtTime(0,now+0.4);o.start();o.stop(now+0.4)}
    else if(type==='escape'){o.type='sawtooth';o.frequency.setValueAtTime(400,this.ctx.currentTime);o.frequency.linearRampToValueAtTime(150,this.ctx.currentTime+0.3);g.gain.setValueAtTime(0.1,this.ctx.currentTime);g.gain.linearRampToValueAtTime(0,this.ctx.currentTime+0.3);o.start();o.stop(this.ctx.currentTime+0.3)}
    else if(type==='buy'){o.type='sine';const now=this.ctx.currentTime;o.frequency.setValueAtTime(500,now);o.frequency.setValueAtTime(700,now+0.1);g.gain.setValueAtTime(0.12,now);g.gain.linearRampToValueAtTime(0,now+0.2);o.start();o.stop(now+0.2)}
    else if(type==='sell'){o.type='triangle';const now=this.ctx.currentTime;o.frequency.setValueAtTime(600,now);o.frequency.setValueAtTime(800,now+0.08);o.frequency.setValueAtTime(1000,now+0.15);g.gain.setValueAtTime(0.1,now);g.gain.linearRampToValueAtTime(0,now+0.2);o.start();o.stop(now+0.2)}
    else if(type==='levelup'){o.type='sine';const now=this.ctx.currentTime;o.frequency.setValueAtTime(400,now);o.frequency.setValueAtTime(500,now+0.1);o.frequency.setValueAtTime(600,now+0.2);o.frequency.setValueAtTime(800,now+0.3);o.frequency.setValueAtTime(1000,now+0.4);g.gain.setValueAtTime(0.15,now);g.gain.linearRampToValueAtTime(0,now+0.5);o.start();o.stop(now+0.5)}
    else if(type==='boss_hit'){o.type='square';o.frequency.setValueAtTime(200,this.ctx.currentTime);o.frequency.linearRampToValueAtTime(100,this.ctx.currentTime+0.1);g.gain.setValueAtTime(0.15,this.ctx.currentTime);g.gain.linearRampToValueAtTime(0,this.ctx.currentTime+0.15);o.start();o.stop(this.ctx.currentTime+0.15)}
    else if(type==='boss_win'){o.type='sine';const now=this.ctx.currentTime;[400,500,600,700,800,1000,1200].forEach((f,i)=>{o.frequency.setValueAtTime(f,now+i*0.08)});g.gain.setValueAtTime(0.15,now);g.gain.linearRampToValueAtTime(0,now+0.6);o.start();o.stop(now+0.6)}
    else if(type==='walk'){o.type='sine';o.frequency.setValueAtTime(100+Math.random()*30,this.ctx.currentTime);g.gain.setValueAtTime(0.02,this.ctx.currentTime);g.gain.linearRampToValueAtTime(0,this.ctx.currentTime+0.05);o.start();o.stop(this.ctx.currentTime+0.05)}
    else if(type==='pet'){o.type='sine';const now=this.ctx.currentTime;o.frequency.setValueAtTime(800,now);o.frequency.setValueAtTime(1000,now+0.05);o.frequency.setValueAtTime(900,now+0.1);g.gain.setValueAtTime(0.08,now);g.gain.linearRampToValueAtTime(0,now+0.15);o.start();o.stop(now+0.15)}
  }
};

    [196,233,262,294,330,294,262,233], // 24 Chaos Rift - chaotic
  ],
  tempo:0.35,
  start(){
    if(this.playing||!SFX.ctx)return;
    this.playing=true;
    this.osc=SFX.ctx.createOscillator();
    this.gain=SFX.ctx.createGain();
    this.osc.type='triangle';
    this.osc.connect(this.gain);
    this.gain.connect(SFX.ctx.destination);
    this.gain.gain.value=0.04;
    this.osc.start();
    this.noteIdx=0;
  },
  stop(){
    if(!this.playing)return;
    this.playing=false;
    if(this.osc){try{this.osc.stop()}catch(e){}}
    this.osc=null;
  },
  update(dt){
    if(!this.playing||!this.osc||muted)return;
    this.noteTimer+=dt;
    if(this.noteTimer>=this.tempo){
      this.noteTimer=0;
      const mel=this.melodies[curIsland]||this.melodies[0];
      this.noteIdx=(this.noteIdx+1)%mel.length;
      this.osc.frequency.setValueAtTime(mel[this.noteIdx],SFX.ctx.currentTime);
      this.gain.gain.setValueAtTime(0.05,SFX.ctx.currentTime);
      this.gain.gain.linearRampToValueAtTime(0.03,SFX.ctx.currentTime+this.tempo*0.8);
    }
  }
};

// Boss fight state
let bossPos={x:0,y:0};
let bossActive=false;
let bossFight=false;
let bossHP=0;
let bossMaxHP=0;
let bossHitZone=50;
let bossHitDir=1;
let bossSwingPos=50;
let bossSwingDir=1;
let bossDmgTimer=0;
let bossPlayerHP=0;
let bossPlayerMaxHP=0;
let bossAttackTimer=0;

function genIslandMap(island){
  map=[];trees=[];
  const seed=island.id*1000;
  const id=island.id;
  function srand(s){return((Math.sin(s)*10000)%1+1)%1}

  // Fill with ocean
  for(let y=0;y<MH;y++){map[y]=[];for(let x=0;x<MW;x++){map[y][x]=6}}

  const cx=MW/2,cy=MH/2;

  // ---- UNIQUE ISLAND SHAPES ----
  function islandDist(x,y){
    const dx=(x-cx),dy=(y-cy);
    const noise=srand(seed+x*7+y*13)*3+srand(seed+x*3+y*19)*2;

    if(id===0){
      // Meadow: big round island
      return Math.sqrt(dx*dx*0.5+dy*dy*0.5)-18+noise;
    }else if(id===1){
      // Tropical: long horizontal island with bump
      return Math.sqrt(dx*dx*0.25+dy*dy*0.8)-16+noise;
    }else if(id===2){
      // Swamp: blobby irregular shape
      const n2=Math.sin(dx*0.3)*3+Math.cos(dy*0.4)*3;
      return Math.sqrt(dx*dx*0.5+dy*dy*0.5)-16+noise+n2;
    }else if(id===3){
      // Arctic: wide diamond
      return (Math.abs(dx)*0.7+Math.abs(dy)*0.7)-18+noise;
    }else if(id===4){
      // Volcano: circular with dent in top (crater)
      let d=Math.sqrt(dx*dx*0.5+dy*dy*0.5)-17+noise;
      if(Math.sqrt(dx*dx+Math.pow(dy+3,2))<6)d=-5; // crater lake area
      return d;
    }else if(id===5){
      // Mushroom: round top, thin stem going south
      const top=Math.sqrt(dx*dx*0.4+Math.pow(dy+6,2)*0.5)-14;
      const stem=Math.abs(dx)-4+Math.max(0,(dy-4))*0.2;
      return Math.min(top,dy>2?stem:top)+noise*0.5;
    }else if(id===6){
      // Desert: L-shaped
      const horiz=Math.max(Math.abs(dx+5)-14,Math.abs(dy+5)-8);
      const vert=Math.max(Math.abs(dx-8)-8,Math.abs(dy-3)-12);
      return Math.min(horiz,vert)+noise*0.5;
    }else if(id===7){
      // Crystal: star/cross shape
      const arm1=Math.max(Math.abs(dx)-16,Math.abs(dy)-6);
      const arm2=Math.max(Math.abs(dx)-6,Math.abs(dy)-16);
      return Math.min(arm1,arm2)+noise*0.4;
    }else if(id===8){
      // Deep Ocean: crescent moon
      const outer=Math.sqrt(dx*dx+dy*dy)-18;
      const inner=Math.sqrt(Math.pow(dx+8,2)+dy*dy)-14;
      return Math.max(outer,-inner)+noise*0.5;
    }else if(id===9){
      // Sky: ring/donut island
      const ring=Math.abs(Math.sqrt(dx*dx*0.5+dy*dy*0.5)-12)-5;
      return ring+noise*0.4;
    }else if(id===10){
      // Storm Peak: jagged lightning bolt shape
      const zigzag=Math.abs(dx+Math.sin(dy*0.5)*6)-8;
      const vert=Math.abs(dy)-18;
      return Math.max(zigzag,vert)+noise*0.3;
    }else if(id===11){
      // Dragon's Lair: large irregular claw
      const claw1=Math.sqrt(Math.pow(dx-5,2)*0.4+Math.pow(dy-6,2)*0.6)-10;
      const claw2=Math.sqrt(Math.pow(dx+5,2)*0.4+Math.pow(dy-6,2)*0.6)-10;
      const palm=Math.sqrt(dx*dx*0.3+Math.pow(dy+4,2)*0.4)-14;
      return Math.min(Math.min(claw1,claw2),palm)+noise*0.4;
    }else if(id===12){
      // Void Wastes: scattered fragments (multiple blobs)
      const b1=Math.sqrt(Math.pow(dx+8,2)+Math.pow(dy+5,2))-8;
      const b2=Math.sqrt(Math.pow(dx-7,2)+Math.pow(dy-6,2))-7;
      const b3=Math.sqrt(Math.pow(dx-2,2)+Math.pow(dy+8,2))-6;
      const b4=Math.sqrt(Math.pow(dx+5,2)+Math.pow(dy-8,2))-5;
      return Math.min(Math.min(b1,b2),Math.min(b3,b4))+noise*0.3;
    }else if(id===13){
      // Cosmic Reef: spiral galaxy shape
      const angle=Math.atan2(dy,dx);
      const dist=Math.sqrt(dx*dx+dy*dy);
      const spiral=Math.sin(angle*2-dist*0.3)*4;
      return dist-16-spiral+noise*0.3;
    }else if(id===14){
      // Final Throne: large imposing square fortress
      const fort=Math.max(Math.abs(dx)-16,Math.abs(dy)-14);
      return fort+noise*0.3;
    }else if(id===15){
      // Riverside: winding river shape (elongated S-curve)
      const river=Math.abs(dy-Math.sin(dx*0.2)*8)-6;
      const bounds=Math.max(Math.abs(dx)-18,Math.abs(dy)-14);
      return Math.max(Math.min(river,bounds*0.5+4),bounds)+noise*0.4;
    }else if(id===16){
      // Coral Bay: horseshoe/bay open to the south
      const outer=Math.sqrt(dx*dx+dy*dy)-17;
      const bay=Math.sqrt(dx*dx*0.5+Math.pow(Math.max(0,dy-2),2)*0.8)-10;
      return Math.max(outer,-bay>3?-99:0)+noise*0.4;
    }else if(id===17){
      // Frozen Lake: circular with cracks
      const circ=Math.sqrt(dx*dx*0.5+dy*dy*0.5)-17;
      const crack1=Math.abs(dx+dy*0.3)-1;
      const crack2=Math.abs(dx*0.5-dy)-1;
      const crackDist=Math.min(crack1,crack2);
      return circ+Math.max(0,(5-Math.abs(circ))*0.1*(crackDist<2?-0.5:0))+noise*0.3;
    }else if(id===18){
      // Ember Fields: scattered volcanic patches
      const p1=Math.sqrt(Math.pow(dx-6,2)*0.5+Math.pow(dy+4,2)*0.5)-9;
      const p2=Math.sqrt(Math.pow(dx+7,2)*0.5+Math.pow(dy-5,2)*0.5)-8;
      const p3=Math.sqrt(Math.pow(dx+2,2)*0.5+Math.pow(dy+6,2)*0.5)-7;
      const p4=Math.sqrt(Math.pow(dx-4,2)*0.5+Math.pow(dy-7,2)*0.5)-6;
      return Math.min(Math.min(p1,p2),Math.min(p3,p4))+noise*0.4;
    }else if(id===19){
      // Sunken Ruins: rectangular outline with gaps
      const outer=Math.max(Math.abs(dx)-16,Math.abs(dy)-12);
      const inner=Math.max(Math.abs(dx)-10,Math.abs(dy)-6);
      const walls=Math.max(outer,-inner);
      return walls+noise*0.3;
    }else if(id===20){
      // Abyssal Trench: narrow deep canyon
      const canyon=Math.abs(dx)-6;
      const bounds=Math.abs(dy)-18;
      return Math.max(canyon,bounds)+noise*0.3;
    }else if(id===21){
      // Wind Temple: floating circular platforms
      const c1=Math.sqrt(Math.pow(dx-8,2)+Math.pow(dy-5,2))-7;
      const c2=Math.sqrt(Math.pow(dx+8,2)+Math.pow(dy-5,2))-7;
      const c3=Math.sqrt(Math.pow(dx,2)+Math.pow(dy+7,2))-8;
      const c4=Math.sqrt(dx*dx+Math.pow(dy-1,2))-5;
      return Math.min(Math.min(c1,c2),Math.min(c3,c4))+noise*0.3;
    }else if(id===22){
      // Thunder Fortress: pentagon
      const a1=dx*0.951+dy*0.309-16;
      const a2=dx*0.588-dy*0.809-16;
      const a3=-dx*0.588-dy*0.809-16;
      const a4=-dx*0.951+dy*0.309-16;
      const a5=dy-16;
      return Math.max(Math.max(Math.max(a1,a2),Math.max(a3,a4)),a5)+noise*0.3;
    }else if(id===23){
      // Dark Nebula: spiral
      const angle=Math.atan2(dy,dx);
      const dist=Math.sqrt(dx*dx+dy*dy);
      const spiral=Math.sin(angle*3-dist*0.4)*3;
      return dist-15-spiral+noise*0.3;
    }else if(id===24){
      // Chaos Rift: chaotic irregular blobs
      const b1=Math.sqrt(Math.pow(dx+10,2)*0.6+Math.pow(dy,2)*0.8)-8;
      const b2=Math.sqrt(Math.pow(dx-6,2)*0.8+Math.pow(dy+8,2)*0.6)-7;
      const b3=Math.sqrt(Math.pow(dx+3,2)*0.7+Math.pow(dy-9,2)*0.7)-6;
      const b4=Math.sqrt(Math.pow(dx-10,2)*0.5+Math.pow(dy-3,2)*0.9)-7;
      const b5=Math.sqrt(Math.pow(dx,2)+Math.pow(dy+4,2))-5;
      return Math.min(Math.min(Math.min(b1,b2),Math.min(b3,b4)),b5)+noise*0.3;
    }
    return Math.sqrt(dx*dx+dy*dy)-16+noise;
  }

  // Apply island shape
  for(let y=0;y<MH;y++)for(let x=0;x<MW;x++){
    const d=islandDist(x,y);
    if(d<-1)map[y][x]=0;
    else if(d<0.5)map[y][x]=2;
  }

  // Lake(s) - position varies per island
  const lakeConfigs=[
    [{x:cx+5,y:cy+2,r:7}],                          // 0 meadow
    [{x:cx,y:cy,r:5},{x:cx-12,y:cy,r:3}],             // 1 tropical
    [{x:cx-3,y:cy,r:6},{x:cx+8,y:cy-4,r:4},{x:cx-6,y:cy+5,r:3}], // 2 swamp - multiple
    [{x:cx,y:cy-2,r:6}],                              // 3 arctic
    [{x:cx,y:cy-3,r:5}],                              // 4 volcano crater
    [{x:cx,y:cy-4,r:5}],                              // 5 mushroom
    [{x:cx-4,y:cy-2,r:4},{x:cx+6,y:cy+5,r:3}],       // 6 desert oasis
    [{x:cx,y:cy,r:5}],                                // 7 crystal
    [{x:cx-5,y:cy,r:5}],                              // 8 crescent
    [{x:cx,y:cy,r:4},{x:cx+8,y:cy-6,r:3}],           // 9 sky
    [{x:cx,y:cy-4,r:5}],                              // 10 storm peak
    [{x:cx+3,y:cy+2,r:6},{x:cx-5,y:cy-3,r:4}],       // 11 dragon's lair
    [{x:cx-6,y:cy-3,r:4},{x:cx+5,y:cy+5,r:3}],       // 12 void wastes
    [{x:cx,y:cy,r:5},{x:cx-6,y:cy+4,r:3}],            // 13 cosmic reef
    [{x:cx,y:cy,r:7}],                                // 14 final throne
    [{x:cx-5,y:cy,r:5},{x:cx+6,y:cy+3,r:4}],         // 15 riverside
    [{x:cx,y:cy+3,r:6}],                              // 16 coral bay
    [{x:cx,y:cy,r:7}],                                // 17 frozen lake
    [{x:cx+4,y:cy-2,r:4},{x:cx-5,y:cy+4,r:3}],       // 18 ember fields
    [{x:cx,y:cy,r:4},{x:cx-6,y:cy-3,r:3}],            // 19 sunken ruins
    [{x:cx,y:cy,r:4}],                                // 20 abyssal trench
    [{x:cx+8,y:cy+5,r:3},{x:cx-8,y:cy+5,r:3},{x:cx,y:cy-7,r:4}], // 21 wind temple
    [{x:cx,y:cy,r:5}],                                // 22 thunder fortress
    [{x:cx,y:cy,r:5},{x:cx+5,y:cy-5,r:3}],            // 23 dark nebula
    [{x:cx-4,y:cy+2,r:4},{x:cx+5,y:cy-3,r:3},{x:cx-2,y:cy-6,r:3}], // 24 chaos rift
  ];
  const lakes=lakeConfigs[id]||[{x:cx,y:cy,r:6}];
  for(const lk of lakes){
    for(let y=0;y<MH;y++)for(let x=0;x<MW;x++){
      const dx2=x-lk.x,dy2=y-lk.y;
      const d2=Math.sqrt(dx2*dx2*0.7+dy2*dy2);
      if(d2<lk.r&&map[y][x]===0)map[y][x]=1;
      else if(d2<lk.r+1&&map[y][x]===0)map[y][x]=2;
    }
  }

  // River between first two lakes if multiple
  if(lakes.length>=2){
    const l1=lakes[0],l2=lakes[1];
    const steps=40;
    for(let i=0;i<=steps;i++){
      const t=i/steps;
      const rx2=Math.floor(l1.x+(l2.x-l1.x)*t);
      const ry2=Math.floor(l1.y+(l2.y-l1.y)*t+Math.sin(t*6)*2);
      for(let d=-1;d<=1;d++){
        if(ry2+d>=0&&ry2+d<MH&&rx2>=0&&rx2<MW&&map[ry2+d][rx2]===0)map[ry2+d][rx2]=1;
      }
    }
  }

  // Fishing dock near first lake
  const lk0=lakes[0];
  for(let i=0;i<4;i++){
    const dy4=Math.floor(lk0.y);
    const dx4=Math.floor(lk0.x-lk0.r-2+i);
    if(dy4>=0&&dy4<MH&&dx4>=0&&dx4<MW&&map[dy4][dx4]===0)map[dy4][dx4]=4;
    if(dy4+1<MH&&dx4>=0&&dx4<MW&&map[dy4+1][dx4]===0)map[dy4+1][dx4]=4;
  }

  // Boat dock - on sand right next to grass (search outward from center-south)
  let boatPlaced=false;
  for(let r=5;r<Math.max(MW,MH)&&!boatPlaced;r++){
    for(let dy8=-r;dy8<=r&&!boatPlaced;dy8++){
      for(let dx8=-r;dx8<=r&&!boatPlaced;dx8++){
        const bx3=Math.floor(cx)+dx8,by3=Math.floor(cy)+Math.abs(dy8); // bias south
        if(bx3<1||by3<1||bx3>=MW-2||by3>=MH-2)continue;
        // Need sand tile with grass neighbor AND ocean neighbor
        if(map[by3][bx3]===2){
          let hasGrass=false,hasOcean=false;
          for(let d=-2;d<=2;d++){
            if(by3+d>=0&&by3+d<MH){
              if(map[by3+d][bx3]===0)hasGrass=true;
              if(map[by3+d][bx3]===6)hasOcean=true;
            }
            if(bx3+d>=0&&bx3+d<MW){
              if(map[by3][bx3+d]===0)hasGrass=true;
              if(map[by3][bx3+d]===6)hasOcean=true;
            }
          }
          if(hasGrass&&hasOcean){
            for(let ddx=-1;ddx<=1;ddx++)for(let ddy=0;ddy<=1;ddy++){
              if(by3+ddy<MH&&bx3+ddx>=0&&bx3+ddx<MW)map[by3+ddy][bx3+ddx]=5;
            }
            boatPlaced=true;
          }
        }
      }
    }
  }

  // Shop - find safe 3x3 grass
  let shopPlaced=false;
  for(let r=3;r<Math.max(MW,MH)&&!shopPlaced;r++){
    for(let dy5=-r;dy5<=r&&!shopPlaced;dy5++)for(let dx5=-r;dx5<=r&&!shopPlaced;dx5++){
      const sx5=Math.floor(cx)+dx5,sy5=Math.floor(cy)+dy5;
      let allGrass=true;
      for(let yy=0;yy<3;yy++)for(let xx=0;xx<3;xx++){
        const ty2=sy5+yy,tx2=sx5+xx;
        if(ty2<0||ty2>=MH||tx2<0||tx2>=MW||map[ty2][tx2]!==0)allGrass=false;
      }
      if(allGrass){
        let nearWat=false;
        for(let yy=-1;yy<4;yy++)for(let xx=-1;xx<4;xx++){
          const ty2=sy5+yy,tx2=sx5+xx;
          if(ty2>=0&&ty2<MH&&tx2>=0&&tx2<MW&&map[ty2][tx2]===1)nearWat=true;
        }
        if(!nearWat){for(let yy=0;yy<3;yy++)for(let xx=0;xx<3;xx++)map[sy5+yy][sx5+xx]=3;shopPlaced=true}
      }
    }
  }

  // Quest giver - find a grass spot away from shop
  questGiverPos={x:0,y:0};
  for(let r=5;r<Math.max(MW,MH);r++){
    let found=false;
    for(let dy=-r;dy<=r&&!found;dy++)for(let dx=-r;dx<=r&&!found;dx++){
      const qx=Math.floor(cx)+dx,qy=Math.floor(cy)+dy;
      if(qx<2||qy<2||qx>=MW-2||qy>=MH-2)continue;
      if(map[qy][qx]!==0)continue;
      // Not too close to shop (search for shop tile)
      let tooClose=false;
      for(let dy2=-3;dy2<=3;dy2++)for(let dx2=-3;dx2<=3;dx2++){
        const yy=qy+dy2,xx=qx+dx2;
        if(yy>=0&&yy<MH&&xx>=0&&xx<MW&&map[yy][xx]===3)tooClose=true;
      }
      if(!tooClose){questGiverPos={x:qx*T+T/2,y:qy*T+T/2};found=true}
    }
    if(found)break;
  }

  // Boss placement
  bossPos={x:0,y:0};
  bossActive=false;
  const isl2=ISLANDS[curIsland];
  if(isl2.isBossIsland){
    const w=WORLDS.find(ww=>ww.bossIsland===curIsland);
    if(w && !me?.bossesDefeated?.includes(w.id)){
      bossActive=true;
      for(let r=8;r<Math.max(MW,MH);r++){
        let found2=false;
        for(let dy=-r;dy<=r&&!found2;dy++)for(let dx=-r;dx<=r&&!found2;dx++){
          const bx2=Math.floor(cx)+dx,by2=Math.floor(cy)+dy;
          if(bx2<3||by2<3||bx2>=MW-3||by2>=MH-3)continue;
          if(map[by2][bx2]!==0)continue;
          const distQ=Math.sqrt(Math.pow(bx2*T-questGiverPos.x,2)+Math.pow(by2*T-questGiverPos.y,2));
          if(distQ<T*8)continue;
          let tooClose2=false;
          for(let d=-2;d<=2;d++){for(let d2=-2;d2<=2;d2++){
            const yy=by2+d,xx=bx2+d2;
            if(yy>=0&&yy<MH&&xx>=0&&xx<MW&&(map[yy][xx]===3||map[yy][xx]===1||map[yy][xx]===5))tooClose2=true;
          }}
          if(!tooClose2){bossPos={x:bx2*T+T/2,y:by2*T+T/2};found2=true}
        }
        if(found2)break;
      }
    }
  }

  // Trees
  for(let i=0;i<120;i++){
    const tx=Math.floor(srand(seed+i*7)*(MW-4))+2;
    const ty=Math.floor(srand(seed+i*13+3)*(MH-4))+2;
    if(map[ty][tx]!==0)continue;
    let ok=true;
    for(let dy6=-2;dy6<=2;dy6++)for(let dx6=-2;dx6<=2;dx6++){
      const yy=ty+dy6,xx=tx+dx6;
      if(yy>=0&&yy<MH&&xx>=0&&xx<MW&&map[yy][xx]>=3)ok=false;
    }
    if(ok)trees.push({x:tx*T+T/2,y:ty*T+T/2});
  }

  // Secret cave - one per island, hidden away
  for(let r=15;r<Math.max(MW,MH);r++){
    let found=false;
    for(let dy=-r;dy<=r&&!found;dy++)for(let dx=-r;dx<=r&&!found;dx++){
      const sx2=Math.floor(cx)+dx,sy2=Math.floor(cy)+dy;
      if(sx2<2||sy2<2||sx2>=MW-2||sy2>=MH-2)continue;
      if(map[sy2][sx2]!==0)continue;
      let tooClose=false;
      for(let dd=-4;dd<=4;dd++)for(let dd2=-4;dd2<=4;dd2++){
        const yy=sy2+dd,xx=sx2+dd2;
        if(yy>=0&&yy<MH&&xx>=0&&xx<MW&&(map[yy][xx]===3||map[yy][xx]===4||map[yy][xx]===5))tooClose=true;
      }
      if(!tooClose){map[sy2][sx2]=7;found=true}
    }
    if(found)break;
  }

  // Gem nodes - sparkly rocks on certain islands
  gemNodes.length=0;
  const gemIslands=[4,7,8,12,13,14,19,20]; // Volcano, Crystal, Deep Ocean, etc
  if(gemIslands.includes(island.id)){
    for(let i=0;i<5;i++){
      const gx=Math.floor(srand(seed+i*17+99)*(MW-6))+3;
      const gy=Math.floor(srand(seed+i*23+77)*(MH-6))+3;
      if(map[gy][gx]===0)gemNodes.push({x:gx*T+T/2,y:gy*T+T/2,mined:false});
    }
  }

  // Perf: cache dock and shop tile positions so render() doesn't scan every frame
  cachedDockTile={x:MW/2,y:MH-3};
  cachedShopTile={x:4,y:4};
  dockScan:for(let yy=0;yy<MH;yy++)for(let xx=0;xx<MW;xx++){
    if(map[yy][xx]===5){cachedDockTile={x:xx+1,y:yy+1};break dockScan}
  }
  shopScan:for(let yy=0;yy<MH;yy++)for(let xx=0;xx<MW;xx++){
    if(map[yy][xx]===3){cachedShopTile={x:xx,y:yy};break shopScan}
  }
}
let cachedDockTile={x:0,y:0};
let cachedShopTile={x:4,y:4};

genIslandMap(ISLANDS[0]);

// ========== FISH ==========

function pickFish(rodLv){
  const ab=getRodAbility();
  // Junk chance - abilities can reduce it
  let junkChance=Math.max(0.05,0.18-rodLv*0.015);
  if(ab==='noJunk')junkChance*=0.5;
  if(ab==='fireBurst'||ab==='divine')junkChance=0;
  if(Math.random()<junkChance){
    const j=JUNK_ITEMS[Math.floor(Math.random()*JUNK_ITEMS.length)];
    const sz=Math.round((j.minSz+Math.random()*(j.maxSz-j.minSz))*10)/10;
    return{...j,size:sz,fight:1};
  }

  // Luck boost
  let luckMult=1;
  if(ab==='luck')luckMult=1.15;
  if(ab==='luck2')luckMult=1.3;
  if(ab==='luck3')luckMult=1.5;
  if(ab==='divine')luckMult=1.5;
  // Lucky spot bonus!
  if(onLuckySpot)luckMult*=2;

  // Weather-dependent fish chance
  const phase=getDayPhase();
  if(Math.random()<0.15){
    for(const wf of WEATHER_FISH){
      if((wf.weather===weather)||(wf.weather===phase)){
        if(Math.random()<0.4){
          const sz=Math.round((wf.minSz+Math.random()*(wf.maxSz-wf.minSz))*10)/10;
          return{...wf,size:sz,fight:RARITY_FIGHT[wf.rarity]};
        }
      }
    }
  }

  // Treasure map chance (rare drop)
  if(Math.random()<0.02&&treasureMaps.length<3){
    const mapIsland=Math.floor(Math.random()*Math.min(ISLANDS.length,curIsland+3));
    const mapReward=Math.floor(rand(200,1000)*(1+curWorld));
    treasureMaps.push({island:mapIsland,x:rand(10,MW-10)*T,y:rand(10,MH-10)*T,reward:mapReward});
    me.toast={fish:null,msg:'FOUND A TREASURE MAP!'};me.toastT=3;
    SFX.play('catch');
  }

  const island=ISLANDS[curIsland];
  const available=island.fish||FISH.map(f=>f.name);
  const pool=[];
  for(const f of FISH){
    if(!available.includes(f.name))continue;
    let w=RARITY_W[f.rarity];
    if(f.rarity!=='common')w*=(1+rodLv*0.2)*luckMult;
    for(let i=0;i<Math.ceil(w);i++)pool.push(f);
  }
  if(pool.length===0)for(const f of FISH){pool.push(f)} // fallback
  const f=pool[Math.floor(Math.random()*pool.length)];
  const sz=Math.round((f.minSz+Math.random()*(f.maxSz-f.minSz))*10)/10;
  return{...f,size:sz,fight:RARITY_FIGHT[f.rarity]};
}
function getRodAbility(){
  if(!me)return'none';
  const u=UPGRADES_BY_ID[me.equippedRod];
  return u?u.ability:'none';
}

function fishVal(f){
  let val=Math.round(f.val*(0.5+(f.size/f.maxSz)*0.7));
  const ab=getRodAbility();
  if(ab==='coinBoost')val=Math.round(val*1.1);
  if(ab==='coinBoost2')val=Math.round(val*1.25);
  if(ab==='coinBoost3')val=Math.round(val*1.5);
  if(ab==='zephyr')val=Math.round(val*1.5);
  if(ab==='divine')val=Math.round(val*2);
  if(ab==='legendaryX2'&&f.rarity==='legendary')val*=2;
  return Math.round(val*getTierMultiplier());
}

function saveGame(){
  if(!me)return;
  const data={
    name:me.name,colorIdx:me.colorIdx,
    x:me.x,y:me.y,
    coins:me.coins,bagMax:me.bagMax,bag:me.bag,
    rodLv:me.rodLv,speedBoost:me.speedBoost,owned:me.owned,
    hasBoat:me.hasBoat,equippedRod:me.equippedRod,ownedRods:me.ownedRods,
    activeQuest:me.activeQuest,questProgress:me.questProgress,questIsland:me.questIsland,
    fishIndex:me.fishIndex,
    xp:me.xp,level:me.level,xpToNext:me.xpToNext,
    totalEarned:me.totalEarned,
    curIsland:curIsland,
    avatar:selAvatar,
    bossesDefeated:me.bossesDefeated,
    bossWeapons:me.bossWeapons,
    curWorld:curWorld,
    curGalaxy:curGalaxy,
    curStarCluster:curStarCluster,
    galaxiesCleared:me.galaxiesCleared,
    starClustersCleared:me.starClustersCleared,
    pet:me.pet,petX:me.petX,petY:me.petY,
    fishTank:me.fishTank,tankPos:me.tankPos,
    tourneyBest:tourneyBest,
    lootedCaves:Array.from(lootedCaves),
    _fixed_v2:true,
    gems:gems,
    completedCombos:completedCombos,
    treasureMaps:treasureMaps,
    activeTreasureMap:activeTreasureMap,
    campfirePos:campfirePos,
    petTimer:petTimer,
    petEvolved:petEvolved,
    fishStreak:fishStreak,
    streakBestSession:streakBestSession,
  };
  try{
    localStorage.setItem('reelmaster-save',JSON.stringify(data));
  }catch(e){
    console.warn('Save failed:',e);
  }
}

function loadGame(){
  const raw=localStorage.getItem('reelmaster-save');
  if(!raw)return null;
  try{return JSON.parse(raw)}catch(e){return null}
}

function applySave(save){
  if(save.name)me.name=save.name;
  if(save.colorIdx!=null){me.colorIdx=save.colorIdx;me.color=COLORS[save.colorIdx]}
  if(save.x!=null)me.x=save.x;
  if(save.y!=null)me.y=save.y;
  me.coins=save.coins||0;me.bagMax=save.bagMax||5;me.bag=save.bag||[];
  me.rodLv=save.rodLv||1;me.speedBoost=save.speedBoost||0;me.owned=save.owned||[];
  me.hasBoat=save.hasBoat||false;
  me.equippedRod=save.equippedRod||'rod_m1';
  me.ownedRods=save.ownedRods||['rod_m1'];
  // Sync rodLv from equipped rod
  const eqU=UPGRADES_BY_ID[me.equippedRod];
  if(eqU)me.rodLv=eqU.val;
  me.activeQuest=save.activeQuest||null;
  me.questProgress=save.questProgress||0;
  me.questIsland=save.questIsland!=null?save.questIsland:-1;
  me.fishIndex=save.fishIndex||{};
  // Retroactively sync any bag fish into index (for old saves)
  for(const f of me.bag){
    if(f.rarity==='junk')continue;
    if(!me.fishIndex[f.name])me.fishIndex[f.name]={count:0,biggest:0};
    if(me.fishIndex[f.name].count===0)me.fishIndex[f.name].count=1;
    if(f.size>me.fishIndex[f.name].biggest)me.fishIndex[f.name].biggest=f.size;
  }
  me.xp=save.xp||0;me.level=save.level||1;me.xpToNext=save.xpToNext||50;
  me.totalEarned=save.totalEarned||0;
  me.bossesDefeated=save.bossesDefeated||[];
  me.bossWeapons=save.bossWeapons||[];
  me.galaxiesCleared=save.galaxiesCleared||[];
  me.starClustersCleared=save.starClustersCleared||[];
  me.pet=save.pet||null;me.petX=save.petX||me.x;me.petY=save.petY||me.y;
  me.fishTank=save.fishTank||[];me.tankPos=save.tankPos||null;
  if(save.tourneyBest)tourneyBest=save.tourneyBest;
  if(save.lootedCaves)lootedCaves=new Set(save.lootedCaves);
  if(save.gems!=null)gems=save.gems;
  if(save.completedCombos)completedCombos=save.completedCombos;
  if(save.treasureMaps)treasureMaps=save.treasureMaps;
  if(save.activeTreasureMap)activeTreasureMap=save.activeTreasureMap;
  if(save.campfirePos)campfirePos=save.campfirePos;
  if(save.petTimer!=null)petTimer=save.petTimer;
  if(save.petEvolved!=null)petEvolved=save.petEvolved;
  if(save.fishStreak!=null)fishStreak=save.fishStreak;
  if(save.streakBestSession!=null)streakBestSession=save.streakBestSession;
  if(save.curWorld!=null)curWorld=save.curWorld;
  if(save.curGalaxy!=null)curGalaxy=save.curGalaxy;
  if(save.curStarCluster!=null)curStarCluster=save.curStarCluster;
  if(save.curIsland!=null){
    curIsland=save.curIsland;
    genIslandMap(ISLANDS[curIsland]);
  }
}

let dayTime=0.3; // 0=midnight, 0.25=sunrise, 0.5=noon, 0.75=sunset
let daySpeed=0.008; // full cycle ~125 seconds
function getDayPhase(){
  if(dayTime<0.2)return'night';
  if(dayTime<0.3)return'dawn';
  if(dayTime<0.7)return'day';
  if(dayTime<0.8)return'dusk';
  return'night';
}
function getDayBrightness(){
  if(dayTime>=0.25&&dayTime<=0.75)return 1;
  if(dayTime<0.2||dayTime>0.8)return 0.35;
  if(dayTime<0.25)return 0.35+(dayTime-0.2)/0.05*0.65;
  return 1-(dayTime-0.75)/0.05*0.65;
}

// ========== HELPERS ==========
function $(id){return document.getElementById(id)}
function show(id){$(id).classList.remove('hidden')}
function hide(id){$(id).classList.add('hidden')}
function rand(a,b){return Math.random()*(b-a)+a}
function clamp(v,a,b){return Math.max(a,Math.min(b,v))}
function tileAt(px,py){const tx=Math.floor(px/T),ty=Math.floor(py/T);if(tx<0||ty<0||tx>=MW||ty>=MH)return-1;return map[ty][tx]}
function walkable(px,py){const t=tileAt(px,py);return t===0||t===2||t===3||t===4||t===5||t===7}
function nearWater(px,py){for(let dy=-1;dy<=1;dy++)for(let dx=-1;dx<=1;dx++)if(tileAt(px+dx*T,py+dy*T)===1)return true;return false}
function onShop(px,py){return tileAt(px,py)===3}

// ========== INPUT ==========
const keysDown={},justKeys={};
addEventListener('keydown',e=>{
  if(document.activeElement&&document.activeElement.tagName==='INPUT')return;
  if(!keysDown[e.code])justKeys[e.code]=true;
  keysDown[e.code]=true;
  if(['Space','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.code))e.preventDefault();
});
addEventListener('keyup',e=>{keysDown[e.code]=false});
function jp(c){if(justKeys[c]){justKeys[c]=false;return true}return false}

// ========== START GAME ==========
function startSolo(){
  SFX.init();
  const name=$('name-input').value.trim()||'Player'+Math.floor(Math.random()*999);
  me=mkPlayer(name,selAvatar);
  const save=loadGame();
  if(save){
    // One-time save fix: if player was level 13 but should be 15 in world 3
    if(!save._fixed_v2&&save.level>=12&&save.level<=14){
      save.level=15;save.xp=0;save.xpToNext=Math.floor(50+15*20);
      save.curWorld=2; // world 3 (0-indexed)
      save.curIsland=save.curIsland; // keep island but let them teleport
      save._fixed_v2=true;
    }
    applySave(save);
    // Only use safe spawn if save had no position or position is invalid
    if(save.x==null||save.y==null||!walkable(me.x,me.y)){
      const sp=findSafeSpawn();me.x=sp.x;me.y=sp.y;
    }
  }else{
    const sp=findSafeSpawn();me.x=sp.x;me.y=sp.y;
  }
  me.name=name;me.colorIdx=selAvatar;me.color=COLORS[selAvatar];
  gameStarted=true;
  hide('screen-title');
  showGameUI();
  // Always save immediately on start to lock in correct data
  saveGame();
}

$('name-input').addEventListener('keydown',e=>{if(e.key==='Enter'){e.stopPropagation();startSolo()}});

// ========== GAME UPDATE ==========
function update(dt){
  if(!gameStarted||!me)return;
  // Auto sailing animation on ocean map
  if(sailing){
    time+=dt;
    sailTimer+=dt;
    const tgt=ISLAND_POS[sailTargetIsland];
    const src=ISLAND_POS[sailFrom];
    const totalDist=Math.sqrt(Math.pow(tgt.x-src.x,2)+Math.pow(tgt.y-src.y,2));
    const sailSpeed=50;
    const totalTime=totalDist/sailSpeed;
    const t=Math.min(1,sailTimer/totalTime);
    // Smooth easing
    const ease=t<0.5?2*t*t:(1-Math.pow(-2*t+2,2)/2);
    sailX=src.x+(tgt.x-src.x)*ease;
    sailY=src.y+(tgt.y-src.y)*ease;
    if(t>=1){finishSailing();updateIslandName()}
    return;
  }
  time+=dt;
  const p=me;
  const spd=(60+p.speedBoost*20)*dt;

  // Tournament timer
  if(tourneyActive){
    tourneyTimer-=dt;
    if(tourneyTimer<=0){
      tourneyActive=false;
      if(tourneyScore>tourneyBest)tourneyBest=tourneyScore;
      me.toast={fish:null,msg:'TIME UP! Score: $'+tourneyScore+(tourneyScore>=tourneyBest?' NEW BEST!':'')};me.toastT=4;
      const reward=Math.floor(tourneyScore*0.5);
      me.coins+=reward;me.totalEarned+=reward;
      SFX.play('boss_win');
    }
  }

  // Boss fight update
  if(bossFight){
    const bossSpeed=30+curWorld*15;
    bossHitZone+=bossHitDir*bossSpeed*dt;
    if(bossHitZone>85){bossHitZone=85;bossHitDir=-1}
    if(bossHitZone<15){bossHitZone=15;bossHitDir=1}
    if(Math.random()<dt*2)bossHitDir*=-1;
    const swingSpeed=60+me.rodLv*10;
    bossSwingPos+=bossSwingDir*swingSpeed*dt;
    if(bossSwingPos>95){bossSwingPos=95;bossSwingDir=-1}
    if(bossSwingPos<5){bossSwingPos=5;bossSwingDir=1}
    bossAttackTimer-=dt;
    if(bossAttackTimer<=0){
      bossAttackTimer=2.5-curWorld*0.3;
      bossPlayerHP-=10+curWorld*5;
      if(bossPlayerHP<=0){
        bossFight=false;me.state='idle';
        me.toast={fish:null,msg:'BOSS WINS! Try again!',lost:true};me.toastT=3;
      }
    }
    if(jp('Space')){
      const hitW=12-curWorld*1.5;
      if(Math.abs(bossSwingPos-bossHitZone)<hitW){
        const weaponBonus=me.bossWeapons.includes('boss_w'+curWorld)?3:1;
        const dmg=(10+me.rodLv*2)*weaponBonus;
        bossHP-=dmg;
        bossDmgTimer=0.3;
        SFX.play('boss_hit');
        if(bossHP<=0){
          SFX.play('boss_win');
          bossFight=false;bossActive=false;
          me.bossesDefeated.push(curWorld);
          const reward=5000*(curWorld+1);
          me.coins+=reward;me.totalEarned+=reward;
          me.state='idle';
          if(curWorld<4){
            me.toast={fish:null,msg:'BOSS DEFEATED! WORLD '+(curWorld+2)+' UNLOCKED! +$'+reward};me.toastT=5;
          }else{
            me.toast={fish:null,msg:'YOU BEAT THE GAME!!! +$'+reward};me.toastT=6;
          }
          saveGame();
        }
      }else{
        bossPlayerHP-=5;
        if(bossPlayerHP<=0){
          bossFight=false;me.state='idle';
          me.toast={fish:null,msg:'BOSS WINS! Try again!',lost:true};me.toastT=3;
        }
      }
    }
    bossDmgTimer-=dt;
    camX=clamp(p.x-RW/2,0,MW*T-RW);
    camY=clamp(p.y-RH/2,0,MH*T-RH);
    updateHUD();
    if(p.toastT>0){p.toastT-=dt;if(p.toastT<=0)p.toast=null}
    return;
  }

  if(p.state==='idle'){
    let dx=0,dy=0;
    if(keysDown['KeyW']||keysDown['ArrowUp']){dy=-1;p.dir='up'}
    if(keysDown['KeyS']||keysDown['ArrowDown']){dy=1;p.dir='down'}
    if(keysDown['KeyA']||keysDown['ArrowLeft']){dx=-1;p.dir='left'}
    if(keysDown['KeyD']||keysDown['ArrowRight']){dx=1;p.dir='right'}
    if(dx||dy){
      const len=Math.sqrt(dx*dx+dy*dy);
      const nx=p.x+(dx/len)*spd,ny=p.y+(dy/len)*spd;
      if(walkable(nx,p.y))p.x=nx;
      if(walkable(p.x,ny))p.y=ny;
      p.x=clamp(p.x,6,MW*T-6);p.y=clamp(p.y,6,MH*T-6);
      p.moveT+=dt;p.frame=Math.floor(p.moveT*5)%4;
    }else{p.frame=0}
    if(jp('Space')||jp('Enter')){
      // Check boss proximity first
      let startedBoss=false;
      if(bossActive && bossPos.x>0){
        const bdist=Math.sqrt(Math.pow(me.x-bossPos.x,2)+Math.pow(me.y-bossPos.y,2));
        if(bdist<T*3){
          bossFight=true;
          bossHP=100+curWorld*50;
          bossMaxHP=bossHP;
          bossPlayerHP=100;
          bossPlayerMaxHP=100;
          bossHitZone=50;
          bossSwingPos=20;
          bossSwingDir=1;
          bossHitDir=1;
          bossAttackTimer=3;
          me.state='bossfight';
          startedBoss=true;
        }
      }
      if(!startedBoss){
        // Secret cave check
        const pt=tileAt(me.x,me.y);
        if(pt===7){
          const caveKey=curIsland+'-'+Math.floor(me.x/T)+'-'+Math.floor(me.y/T);
          if(!lootedCaves.has(caveKey)){
            lootedCaves.add(caveKey);
            const roll=Math.random();
            if(roll<0.3){
              const amt=Math.floor(50+Math.random()*200)*(1+curWorld);
              me.coins+=amt;me.totalEarned+=amt;
              me.toast={fish:null,msg:'SECRET! +$'+amt};me.toastT=2.5;
            }else if(roll<0.7){
              const rareFish=FISH.filter(f=>f.rarity==='rare'||f.rarity==='epic');
              if(rareFish.length>0&&me.bag.length<me.bagMax){
                const rf=rareFish[Math.floor(Math.random()*rareFish.length)];
                const caught={...rf,size:Math.round((rf.minSz+Math.random()*(rf.maxSz-rf.minSz))*10)/10};
                me.bag.push(caught);
                me.toast={fish:caught,msg:'SECRET FISH!'};me.toastT=3;
                me.holdFish=caught;me.holdTimer=9999;
              }else{
                const amt=100*(1+curWorld);me.coins+=amt;me.totalEarned+=amt;
                me.toast={fish:null,msg:'SECRET! +$'+amt};me.toastT=2.5;
              }
            }else{
              const xpAmt=50+curWorld*20;
              me.xp+=xpAmt;
              while(me.xp>=me.xpToNext){me.xp-=me.xpToNext;me.level++;me.xpToNext=Math.floor(50+me.level*20)}
              me.toast={fish:null,msg:'SECRET! +'+xpAmt+'XP'};me.toastT=2.5;
            }
            SFX.play('catch');
            saveGame();
          }else{
            me.toast={fish:null,msg:'Already explored!'};me.toastT=1.5;
          }
        }
        else{
          // Check gem mining first
          let handled=false;
          if(gemCooldown<=0){
            for(const gn of gemNodes){
              if(gn.mined)continue;
              const gd=Math.sqrt(Math.pow(me.x-gn.x,2)+Math.pow(me.y-gn.y,2));
              if(gd<T*2){
                gn.mined=true;gems++;gemCooldown=2;
                me.toast={fish:null,msg:'MINED A GEM! ('+gems+' total)'};me.toastT=2;
                SFX.play('catch');saveGame();handled=true;break;
              }
            }
          }
          // Treasure map dig
          if(!handled&&activeTreasureMap&&activeTreasureMap.island===curIsland){
            const tmDist=Math.sqrt(Math.pow(me.x-activeTreasureMap.x,2)+Math.pow(me.y-activeTreasureMap.y,2));
            if(tmDist<T*2){
              me.coins+=activeTreasureMap.reward;me.totalEarned+=activeTreasureMap.reward;
              me.toast={fish:null,msg:'DUG UP TREASURE! +$'+activeTreasureMap.reward};me.toastT=3;
              SFX.play('boss_win');
              activeTreasureMap=null;saveGame();handled=true;
            }
          }
          // Normal interactions
          if(!handled){
            if(onShop(p.x,p.y))openShop();
            else if(nearQuestGiver(p.x,p.y))openQuest();
            else if(nearWater(p.x,p.y)){p.state='casting';p.castPow=0;p.castDir=1;SFX.play('cast')}
          }
        }
      }
    }
  }
  if(p.state==='casting'){
    p.castPow+=p.castDir*130*dt;
    if(p.castPow>=100){p.castPow=100;p.castDir=-1}
    if(p.castPow<=0){p.castPow=0;p.castDir=1}
    if(jp('Space')||jp('Enter')){
      const pow=p.castPow/100;
      const dirs={down:[0,1],up:[0,-1],left:[-1,0],right:[1,0]};
      const d=dirs[p.dir];
      let bxx=p.x+d[0]*(20+pow*80),byy=p.y+d[1]*(20+pow*80);
      if(tileAt(bxx,byy)!==1){for(let r=1;r<8;r++)for(let a=0;a<12;a++){
        const ang=a*Math.PI/6,tx=p.x+Math.cos(ang)*r*T,ty=p.y+Math.sin(ang)*r*T;
        if(tileAt(tx,ty)===1){bxx=tx;byy=ty;r=99;break}
      }}
      const ab2=p===me?getRodAbility():'none';
      let wait=rand(1.5,4.5);
      if(ab2==='quickBite')wait*=0.5;
      p.bobX=bxx;p.bobY=byy;p.state='waiting';p.waitT=wait;SFX.play('splash');
    }
  }
  if(p.state==='waiting'){p.waitT-=dt;if(p.waitT<=0){
    p.state='bite';SFX.play('bite');
    const ab3=p===me?getRodAbility():'none';
    let bt=2;
    if(ab3==='longBite')bt=3;
    if(ab3==='longBite2')bt=5;
    p.biteT=bt;
  }}
  if(p.state==='bite'){
    p.biteT-=dt;
    if(jp('Space')||jp('Enter')){
      p.curFish=pickFish(p.rodLv);
      p.reelProg=0;
      p.state='reeling';
      // Fisch-style minigame state
      p.barPos=50; // player indicator 0-100
      p.barVel=0;
      p.fishPos=50; // fish target 0-100
      p.fishVel=0;
      p.fishBehavior=0; // timer for next fish movement
    }
    if(p.biteT<=0)p.state='idle';
  }
  if(p.state==='reeling'){
    const f=p.curFish;if(!f){p.state='idle'}else{
      // Player bar - speed scales with rod power
      const ab=getRodAbility();
      const holding=keysDown['Space']||keysDown['Enter'];
      let rodSpeed=80+p.rodLv*40;
      if(ab==='superFast')rodSpeed*=1.8;
      const accel=holding?rodSpeed*2:-rodSpeed*1.6;
      p.barVel+=accel*dt;
      p.barVel*=0.88;
      p.barVel=clamp(p.barVel,-rodSpeed,rodSpeed);
      p.barPos+=p.barVel*dt;
      // Bounce off walls
      if(p.barPos<5){p.barPos=5;p.barVel=Math.abs(p.barVel)*0.3}
      if(p.barPos>95){p.barPos=95;p.barVel=-Math.abs(p.barVel)*0.3}

      // Fish AI - moves around randomly based on fight stat
      const slowMult=(ab==='slowFish')?0.5:1;
      p.fishBehavior-=dt;
      if(p.fishBehavior<=0){
        p.fishVel=(Math.random()-0.5)*f.fight*60*slowMult;
        p.fishBehavior=rand(0.3,1.2)/Math.max(1,f.fight*0.5);
      }
      p.fishPos+=p.fishVel*dt;
      if(p.fishPos<10){p.fishPos=10;p.fishVel=Math.abs(p.fishVel)}
      if(p.fishPos>90){p.fishPos=90;p.fishVel=-Math.abs(p.fishVel)}

      // Bar width based on rod power (wider = easier)
      let barW=4+p.rodLv*1.2;
      if(ab==='wideCursor')barW*=1.6;
      // Reel speed with abilities
      let reelSpd=35+p.rodLv*7;
      if(ab==='fastReel')reelSpd*=1.4;
      if(ab==='fireBurst')reelSpd*=1.3;
      // Check overlap
      const overlap=Math.abs(p.barPos-p.fishPos)<barW;
      if(overlap){
        p.reelProg+=reelSpd*dt;
      }else{
        let drainMult=1;
        if(ab==='unbreakable')drainMult=0.2; // 80% less drain
        p.reelProg-=(f.fight*8)*dt*drainMult;
      }
      p.reelProg=clamp(p.reelProg,-5,100);
      if(p.reelProg>=100){
        SFX.play('catch');
        // Fishing streak!
        if(p===me&&f.rarity!=='junk'){
          fishStreak++;streakTimer=8;
          if(fishStreak>streakBestSession)streakBestSession=fishStreak;
          if(fishStreak>=3){
            const streakBonus=Math.floor(fishVal(f)*0.1*fishStreak);
            me.coins+=streakBonus;me.totalEarned+=streakBonus;
          }
        }
        // Check fish combos
        if(p===me&&f.rarity!=='junk'){
          for(const combo of FISH_COMBOS){
            if(completedCombos.includes(combo.name))continue;
            const hasFish=combo.fish.every(fn=>me.fishIndex[fn]&&me.fishIndex[fn].count>0);
            if(hasFish){
              completedCombos.push(combo.name);
              me.coins+=combo.reward;me.totalEarned+=combo.reward;
              me.xp+=combo.xp;
              while(me.xp>=me.xpToNext){me.xp-=me.xpToNext;me.level++;me.xpToNext=Math.floor(50+me.level*20)}
              me.toast={fish:null,msg:'COMBO! '+combo.name+' +$'+combo.reward};me.toastT=3.5;
              SFX.play('boss_win');
            }
          }
        }
        if(p.bag.length<p.bagMax){p.bag.push(f);if(tourneyActive&&p===me){tourneyScore+=fishVal(f)}p.toast={fish:f,msg:'CAUGHT!'+(fishStreak>=3?' STREAK x'+fishStreak+'!':'')};p.toastT=2.5;p.holdFish=f;p.holdTimer=9999;
          // Double catch ability + XP gain
          if(p===me){
            const ab4=ab;
            if((ab4==='doubleCatch'&&Math.random()<0.15)&&p.bag.length<p.bagMax){
              const bonus={...f};p.bag.push(bonus);
              p.toast={fish:f,msg:'DOUBLE CATCH!'};p.toastT=2.8;
            }
          }
          let xpGain={junk:1,common:5,uncommon:10,rare:20,epic:40,legendary:80,boss:200}[f.rarity]||5;
          if(p===me){
            if(ab==='xpBoost')xpGain=Math.round(xpGain*1.25);
            if(ab==='xpBoost2')xpGain*=2;
            if(ab==='zephyr')xpGain=Math.round(xpGain*1.5);
          }
          p.xp+=xpGain;
          const prevLv=p.level;
          while(p.xp>=p.xpToNext){p.xp-=p.xpToNext;p.level++;p.xpToNext=Math.floor(50+p.level*20)}
          if(p.level>prevLv){SFX.play('levelup');saveGame()}
          // Quest progress
          if(p===me&&me.activeQuest){
            const q=me.activeQuest;
            if(q.type==='catch_name'&&f.name===q.fish)me.questProgress++;
            else if(q.type==='catch_count'&&f.rarity!=='junk')me.questProgress++;
            else if(q.type==='catch_size'&&f.name===q.fish&&f.size>=q.size)me.questProgress=1;
          }
          // Fish index tracking
          if(p===me&&f.rarity!=='junk'){
            if(!me.fishIndex[f.name])me.fishIndex[f.name]={count:0,biggest:0};
            me.fishIndex[f.name].count++;
            if(f.size>me.fishIndex[f.name].biggest)me.fishIndex[f.name].biggest=f.size;
          }
        }
        else{p.toast={fish:f,msg:'BAG FULL!',full:true};p.toastT=2.5}
        p.state='idle';p.curFish=null;
      }
      if(p.reelProg<-4){SFX.play('escape');p.toast={fish:f,msg:'ESCAPED!',lost:true};p.toastT=1.5;p.state='idle';p.curFish=null;if(p===me){fishStreak=0;streakTimer=0}}
    }
  }
  if(p.toastT>0){p.toastT-=dt;if(p.toastT<=0)p.toast=null}
  if(p.holdTimer>0){p.holdTimer-=dt;if(p.holdTimer<=0)p.holdFish=null}

  // ---- DAY/NIGHT CYCLE UPDATE ----
  dayTime+=daySpeed*dt;
  if(dayTime>=1)dayTime-=1;

  // ---- WEATHER UPDATE ----
  weatherTimer-=dt;
  if(weatherTimer<=0)changeWeather();
  if(lightningFlash>0)lightningFlash-=dt*3;
  if(weather==='storm'&&Math.random()<dt*0.3)lightningFlash=1;

  // ---- FIREFLIES UPDATE (only at night) ----
  if(getDayPhase()==='night'||getDayPhase()==='dusk'){
    for(const ff of fireflies){
      ff.x+=ff.vx*dt;ff.y+=ff.vy*dt;
      ff.phase+=dt*2;
      if(Math.random()<dt*0.5){ff.vx=rand(-8,8);ff.vy=rand(-8,8)}
      if(ff.x<0)ff.x=MW*T;if(ff.x>MW*T)ff.x=0;
      if(ff.y<0)ff.y=MH*T;if(ff.y>MH*T)ff.y=0;
    }
  }

  // ---- SHOOTING STARS ----
  nextShootingStar-=dt;
  if(nextShootingStar<=0&&(getDayPhase()==='night')){
    shootingStars.push({x:Math.random()*RW,y:rand(5,RH*0.3),vx:rand(100,200),vy:rand(30,80),life:1.5});
    nextShootingStar=rand(4,12);
  }
  for(let i=shootingStars.length-1;i>=0;i--){
    const s=shootingStars[i];
    s.x+=s.vx*dt;s.y+=s.vy*dt;s.life-=dt;
    if(s.life<=0)shootingStars.splice(i,1);
  }

  // ---- FOOTPRINTS ----
  if(p.state==='idle'&&(keysDown['KeyW']||keysDown['KeyS']||keysDown['KeyA']||keysDown['KeyD'])){
    lastFootprintT+=dt;
    if(lastFootprintT>0.3){
      const tile=tileAt(p.x,p.y);
      if(tile===2){// only on sand
        footprints.push({x:p.x,y:p.y,age:0});
        if(footprints.length>30)footprints.shift();
      }
      lastFootprintT=0;
    }
  }
  for(let i=footprints.length-1;i>=0;i--){
    footprints[i].age+=dt;
    if(footprints[i].age>8)footprints.splice(i,1);
  }

  // ---- FISHING STREAK ----
  if(streakTimer>0){streakTimer-=dt;if(streakTimer<=0){fishStreak=0}}

  // ---- TREASURE BOTTLES ----
  nextBottle-=dt;
  if(nextBottle<=0){
    // Spawn a bottle on a random water tile near player
    const bx2=p.x+rand(-80,80),by2=p.y+rand(-80,80);
    if(tileAt(bx2,by2)===1){
      const reward=Math.random()<0.3?{type:'xp',amt:Math.floor(rand(10,50))}:{type:'coins',amt:Math.floor(rand(20,150)*(1+curWorld*0.5))};
      bottles.push({x:bx2,y:by2,vx:rand(-3,3),age:0,reward});
    }
    nextBottle=rand(12,30);
  }
  for(let i=bottles.length-1;i>=0;i--){
    const b=bottles[i];b.x+=b.vx*dt;b.age+=dt;
    if(b.age>20){bottles.splice(i,1);continue}
    // Check if player walks near it
    const dist=Math.sqrt(Math.pow(p.x-b.x,2)+Math.pow(p.y-b.y,2));
    if(dist<T*1.5){
      if(b.reward.type==='coins'){me.coins+=b.reward.amt;me.totalEarned+=b.reward.amt;me.toast={fish:null,msg:'BOTTLE! +$'+b.reward.amt};me.toastT=2}
      else{me.xp+=b.reward.amt;while(me.xp>=me.xpToNext){me.xp-=me.xpToNext;me.level++;me.xpToNext=Math.floor(50+me.level*20)};me.toast={fish:null,msg:'BOTTLE! +'+b.reward.amt+'XP'};me.toastT=2}
      SFX.play('buy');bottles.splice(i,1);
    }
  }

  // ---- LUCKY FISHING SPOTS ----
  nextLuckySpot-=dt;
  if(nextLuckySpot<=0){
    // Find a random water tile
    for(let tries=0;tries<20;tries++){
      const lx=rand(4,MW-4)*T,ly=rand(4,MH-4)*T;
      if(tileAt(lx,ly)===1){luckySpots.push({x:lx,y:ly,timer:rand(15,25)});break}
    }
    nextLuckySpot=rand(18,35);
  }
  onLuckySpot=false;
  for(let i=luckySpots.length-1;i>=0;i--){
    luckySpots[i].timer-=dt;
    if(luckySpots[i].timer<=0){luckySpots.splice(i,1);continue}
    const dist=Math.sqrt(Math.pow(p.x-luckySpots[i].x,2)+Math.pow(p.y-luckySpots[i].y,2));
    if(dist<T*2)onLuckySpot=true;
  }

  // ---- GEM COOLDOWN ----
  if(gemCooldown>0)gemCooldown-=dt;

  // ---- PET EVOLUTION TIMER ----
  if(me.pet&&!petEvolved){
    petTimer+=dt;
    if(petTimer>=180){// 3 minutes = evolve!
      petEvolved=true;
      me.pet.evolved=true;
      me.pet.nickname=(me.pet.nickname||me.pet.name)+' +';
      me.toast={fish:null,msg:'PET EVOLVED! '+me.pet.nickname};me.toastT=3;
      SFX.play('levelup');
    }
  }

  // ---- CAMPFIRE PARTICLES ----
  if(campfirePos&&campfirePos.island===curIsland){
    if(Math.random()<dt*15){
      campfireParticles.push({x:campfirePos.x+rand(-3,3),y:campfirePos.y,vy:rand(-20,-40),life:rand(0.5,1.5),col:Math.random()<0.5?'#ff6020':'#ffcc00'});
    }
    for(let i=campfireParticles.length-1;i>=0;i--){
      const cp=campfireParticles[i];
      cp.y+=cp.vy*dt;cp.life-=dt;cp.x+=rand(-5,5)*dt;
      if(cp.life<=0)campfireParticles.splice(i,1);
    }
  }

  camX=clamp(p.x-RW/2,0,MW*T-RW);
  camY=clamp(p.y-RH/2,0,MH*T-RH);

  updateHUD();
  // Pet follows player with lag
  if(me.pet){
    const pdx=me.x-me.petX,pdy=me.y-me.petY;
    const pdist=Math.sqrt(pdx*pdx+pdy*pdy);
    if(pdist>20){
      me.petX+=pdx*0.05;
      me.petY+=pdy*0.05;
    }
  }

  updateBP();
  updateLB();
  updateQuestTracker();
  MUSIC.update(dt);
}

function updateHUD(){
  $('h-coins').textContent=me.coins;
  $('h-bag').textContent=me.bag.length;
  $('h-bmax').textContent=me.bagMax;
  $('h-level').textContent=me.level;
  $('h-xp').textContent=me.xp;
  $('h-xpmax').textContent=me.xpToNext;
  let st='';
  if(me.state==='casting')st='Release SPACE to cast!';
  else if(me.state==='waiting'&&me.waitT>0)st='Waiting for a bite...';
  else if(me.state==='bite')st='!! BITE !! Press SPACE!';
  else if(me.state==='reeling')st='Hold SPACE to reel in!';
  else if(onShop(me.x,me.y))st='Press SPACE for Shop';
  else if(nearQuestGiver(me.x,me.y))st='Press SPACE to talk';
  else if(nearWater(me.x,me.y))st='Press SPACE to cast';
  else if(tileAt(me.x,me.y)===7)st='Press SPACE to explore cave!';
  else st='Walk to water to fish | Visit shop or quest giver';
  if(bossActive && bossPos.x>0 && me.state==='idle'){
    const bdist=Math.sqrt(Math.pow(me.x-bossPos.x,2)+Math.pow(me.y-bossPos.y,2));
    if(bdist<T*3)st='Press SPACE to fight the BOSS!';
  }
  if(bossFight)st='BOSS FIGHT! Press SPACE to attack!';
  // Add weather/time indicators
  const timeIcon=getDayPhase()==='night'?'\u{1F319}':getDayPhase()==='dawn'?'\u{1F305}':getDayPhase()==='dusk'?'\u{1F307}':'\u{2600}';
  const weatherIcon=weather==='rain'?'\u{1F327}':weather==='storm'?'\u{26C8}':weather==='fog'?'\u{1F32B}':'';
  $('h-status').textContent=timeIcon+weatherIcon+' '+st;
  // Streak display
  const sd=$('streak-display');
  if(fishStreak>=3){
    sd.style.display='block';
    sd.textContent='\u{1F525} STREAK x'+fishStreak+(fishStreak>=5?' BONUS +'+Math.floor(fishStreak*10)+'%':'');
    sd.className=fishStreak>=7?'hot':'';
  }else{sd.style.display='none'}
  // Weather display
  const wd=$('weather-display');
  if(weather!=='clear'||getDayPhase()==='night'){
    wd.style.display='block';
    const wText=weather==='storm'?'STORM - rare fish!':weather==='rain'?'Rain':weather==='fog'?'Fog - rare fish!':getDayPhase()==='night'?'Night - Moonfish!':'';
    wd.textContent=wText;
  }else{wd.style.display='none'}
}

let bpOpen=false;
let bpTab='fish';

function toggleBackpack(){
  bpOpen=!bpOpen;
  $('bp-panel').style.display=bpOpen?'block':'none';
  if(bpOpen)renderBpTab();
}

window.switchBpTab=function(tab){
  bpTab=tab;
  const tabNames={fish:'bag',index:'index',rods:'rods',items:'items',tank:'tank'};
  const matchText=tabNames[tab]||tab;
  document.querySelectorAll('.bp-tab').forEach(t=>t.classList.toggle('active',t.textContent.toLowerCase()===matchText));
  renderBpTab();
};

function renderBpTab(){
  const el=$('bp-content');
  if(bpTab==='fish')renderFishTab(el);
  else if(bpTab==='index')renderIndexTab(el);
  else if(bpTab==='rods')renderRodsTab(el);
  else if(bpTab==='tank')renderTankTab(el);
  else renderItemsTab(el);
}

function renderTankTab(el){
  let html='<h4 style="color:#5be0f5">Fish Tank ('+me.fishTank.length+'/8)</h4>';
  // Place tank button
  html+='<div style="text-align:center;margin-bottom:8px"><button class="bp-item-btn bp-equip-btn" onclick="placeTank()" style="padding:5px 14px">PLACE TANK HERE</button>';
  if(me.tankPos)html+=' <span style="color:#4ade80;font-size:10px">Tank placed!</span>';
  html+='</div>';
  if(me.fishTank.length===0){
    html+='<div style="color:#3a3a5e;text-align:center;padding:14px">Your tank is empty!<br>Add fish from the Fish tab.</div>';
  }else{
    for(let i=0;i<me.fishTank.length;i++){
      const f=me.fishTank[i];
      html+='<div class="bp-item"><div class="bp-item-info"><div class="bp-item-icon" style="background:'+RARITY_COL[f.rarity]+'">&#9641;</div><div><div class="bp-item-name" style="color:'+RARITY_COL[f.rarity]+'">'+f.name+'</div><div class="bp-item-detail">'+f.size+'cm</div></div></div>';
      html+='<button class="bp-item-btn bp-sell-btn" onclick="removeTank('+i+')">REMOVE</button></div>';
    }
  }
  const addable=me.bag.filter(f=>f.rarity!=='junk');
  if(addable.length>0&&me.fishTank.length<8){
    html+='<div style="color:#5a7a9a;font-size:11px;margin-top:8px;text-align:center">Add from bag:</div>';
    for(let i=0;i<me.bag.length;i++){
      const f=me.bag[i];
      if(f.rarity==='junk')continue;
      html+='<div class="bp-item"><div class="bp-item-info"><div class="bp-item-icon" style="background:'+RARITY_COL[f.rarity]+'">&#9641;</div><div><div class="bp-item-name" style="color:'+RARITY_COL[f.rarity]+'">'+f.name+'</div><div class="bp-item-detail">'+f.size+'cm</div></div></div>';
      html+='<button class="bp-item-btn bp-equip-btn" onclick="addToTank('+i+')">DISPLAY</button></div>';
    }
  }
  el.innerHTML=html;
}

window.addToTank=function(i){
  if(me.fishTank.length>=8)return;
  const f=me.bag[i];
  if(!f||f.rarity==='junk')return;
  me.fishTank.push({...f});
  me.bag.splice(i,1);
  SFX.play('pet');
  updateBP();saveGame();
};
window.removeTank=function(i){
  const f=me.fishTank[i];
  if(!f)return;
  if(me.bag.length<me.bagMax){
    me.bag.push(f);
    me.fishTank.splice(i,1);
  }else{
    me.fishTank.splice(i,1);
  }
  updateBP();saveGame();
};
window.placeTank=function(){
  if(!me)return;
  me.tankPos={x:me.x,y:me.y,island:curIsland};
  SFX.play('buy');
  me.toast={fish:null,msg:'Tank placed!'};me.toastT=1.5;
  updateBP();saveGame();
};

function renderIndexTab(el){
  // Group fish by rarity
  const allFish=FISH.filter(f=>f.rarity!=='junk');
  const total=allFish.length;
  const caught=allFish.filter(f=>me.fishIndex[f.name]).length;
  let html=`<h4 style="color:#5be0f5">Fish Index (${caught}/${total})</h4>`;
  const rarityOrder=['common','uncommon','rare','epic','legendary','boss'];
  for(const rar of rarityOrder){
    const rarFish=allFish.filter(f=>f.rarity===rar);
    if(rarFish.length===0)continue;
    html+=`<div style="color:${RARITY_COL[rar]};font-size:11px;text-transform:uppercase;margin:6px 0 3px;font-weight:700">${rar}</div>`;
    for(const f of rarFish){
      const data=me.fishIndex[f.name];
      if(data){
        html+=`<div class="bp-item">
          <div class="bp-item-info">
            <div class="bp-item-icon" style="background:${RARITY_COL[f.rarity]}">&#9641;</div>
            <div>
              <div class="bp-item-name" style="color:${RARITY_COL[f.rarity]}">${f.name}</div>
              <div class="bp-item-detail">x${data.count} | Best: ${data.biggest}cm</div>
            </div>
          </div>
        </div>`;
      }else{
        html+=`<div class="bp-item" style="opacity:0.4">
          <div class="bp-item-info">
            <div class="bp-item-icon" style="background:#1a1a2e">?</div>
            <div>
              <div class="bp-item-name" style="color:#5a5a6e">??? ???</div>
              <div class="bp-item-detail">Not caught</div>
            </div>
          </div>
        </div>`;
      }
    }
  }
  el.innerHTML=html;
}

function renderFishTab(el){
  if(me.bag.length===0){el.innerHTML='<div style="color:#3a3a5e;text-align:center;padding:14px">No fish - go catch some!</div>';return}
  const fishCols={common:['#6a9a6a','#8ac88a'],uncommon:['#3a8aaa','#5ac8e0'],rare:['#4a5ac8','#7a8af8'],epic:['#8a4ab8','#ba7ae8'],legendary:['#c8a030','#f8d060'],boss:['#a01010','#ff3030']};
  const sellableTotal=me.bag.filter(f=>!f.fav).reduce((s,f)=>s+fishVal(f),0);
  el.innerHTML=`<h4 style="color:#7dd3fc">Fish (${me.bag.length}/${me.bagMax})</h4>`+
    me.bag.map((f,i)=>{
    const isHeld=me.holdFish&&me.holdFish.name===f.name&&me.holdFish.size===f.size;
    const fav=f.fav;
    const borderC=fav?'border-color:#f5a623':isHeld?'border-color:#ffd700':'';
    return`<div class="bp-item" style="${borderC}">
      <div class="bp-item-info">
        <div class="bp-item-icon" style="background:${fishCols[f.rarity]?fishCols[f.rarity][0]:'#666'}">&#9641;</div>
        <div>
          <div class="bp-item-name" style="color:${RARITY_COL[f.rarity]}">${fav?'&#11088; ':''}${f.name}</div>
          <div class="bp-item-detail">${f.size}cm | $${fishVal(f)}</div>
        </div>
      </div>
      <div style="display:flex;gap:3px">
        <button class="bp-item-btn" style="border-color:#b08020;background:${fav?'#f5a623':'#1a1a3e'};color:${fav?'#111':'#f5a623'};font-size:11px;padding:3px 6px" onclick="favFish(${i})" title="Favorite">&#9733;</button>
        <button class="bp-item-btn ${isHeld?'bp-equipped':'bp-equip-btn'}" onclick="holdFishSlot(${i})">${isHeld?'PUT DOWN':'HOLD'}</button>
        <button class="bp-item-btn bp-equip-btn" onclick="setPet(${i})">${me.pet&&me.pet.name===f.name?'UNPET':'PET'}</button>
        ${fav?'<span class="bp-equipped" style="color:#f5a623">LOCKED</span>':`<button class="bp-item-btn bp-sell-btn" onclick="sellFish(${i})">SELL</button>`}
      </div>
    </div>`;
  }).join('')+`<button class="fp-sell-all" onclick="sellAll()">SELL ALL ($${sellableTotal})</button>`;
}

window.favFish=function(i){
  const f=me.bag[i];if(!f)return;
  f.fav=!f.fav;
  saveGame();
  renderBpTab();
};

window.setPet=function(i){
  const f=me.bag[i];
  if(!f)return;
  if(me.pet&&me.pet.name===f.name){me.pet=null;SFX.play('pet');updateBP();saveGame();return}
  const nickname=prompt('Name your pet '+f.name+':');
  me.pet={name:f.name,rarity:f.rarity,nickname:nickname||f.name};
  me.petX=me.x-20;me.petY=me.y;
  SFX.play('pet');
  updateBP();saveGame();
};

function renderRodsTab(el){
  const allRods=UPGRADES.filter(u=>u.type==='rod');
  const owned=me.ownedRods.length;
  const total=allRods.length;
  let html=`<h4 style="color:#f5a623">Rod Index (${owned}/${total})</h4>`;
  for(let isl=0;isl<ISLANDS.length;isl++){
    const islandRods=allRods.filter(u=>u.island===isl);
    if(islandRods.length===0)continue;
    html+=`<div style="color:#5be0f5;font-size:11px;margin:6px 0 3px;font-weight:700">${ISLANDS[isl].name}</div>`;
    for(const u of islandRods){
      const isOwned=me.ownedRods.includes(u.id);
      const equipped=me.equippedRod===u.id;
      const borderC=equipped?'border-color:#4ade80':isOwned?'border-color:#3a3a5e':'border-color:#1a1a3e';
      const opac=isOwned?'1':'0.45';
      const abColor=u.ability&&u.ability!=='none'?'#c084fc':'#5a7a9a';
      html+=`<div class="bp-item" style="${borderC};opacity:${opac};display:block">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:3px">
          <div class="bp-item-info">
            <div class="bp-item-icon" style="background:#3a2a1a">&#127907;</div>
            <div>
              <div class="bp-item-name" style="color:${equipped?'#4ade80':isOwned?'#ccc':'#5a5a6e'}">${u.name}</div>
              <div class="bp-item-detail">Pwr ${u.val} | Spd ${80+u.val*40} | $${u.price}</div>
            </div>
          </div>
          ${equipped?'<span class="bp-equipped">EQUIPPED</span>':
