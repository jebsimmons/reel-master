      bx.fillStyle='rgba(100,120,180,0.2)';
      bx.beginPath();bx.ellipse(mePx,mtY+6+bob,12,3,0,0,Math.PI*2);bx.fill();
      // Main crystal body - large center facet (darker base)
      bx.fillStyle='#6070b0';
      bx.beginPath();bx.moveTo(mePx,mtY-6+bob);bx.lineTo(mePx+10,mtY+2+bob);
      bx.lineTo(mePx,mtY+6+bob);bx.lineTo(mePx-10,mtY+2+bob);bx.closePath();bx.fill();
      // Right facet (lighter)
      bx.fillStyle='#8090d0';
      bx.beginPath();bx.moveTo(mePx,mtY-6+bob);bx.lineTo(mePx+10,mtY+2+bob);
      bx.lineTo(mePx+2,mtY+1+bob);bx.closePath();bx.fill();
      // Left facet (mid tone)
      bx.fillStyle='#7080c0';
      bx.beginPath();bx.moveTo(mePx,mtY-6+bob);bx.lineTo(mePx-10,mtY+2+bob);
      bx.lineTo(mePx-2,mtY+1+bob);bx.closePath();bx.fill();
      // Top highlight facet
      bx.fillStyle='#a0b0e0';
      bx.beginPath();bx.moveTo(mePx,mtY-6+bob);bx.lineTo(mePx+3,mtY-3+bob);
      bx.lineTo(mePx-3,mtY-3+bob);bx.closePath();bx.fill();
      // Side crystal spires
      bx.fillStyle='#7888c8';
      bx.beginPath();bx.moveTo(mePx-8,mtY+1+bob);bx.lineTo(mePx-12,mtY-3+bob);
      bx.lineTo(mePx-7,mtY+3+bob);bx.closePath();bx.fill();
      bx.fillStyle='#8898d0';
      bx.beginPath();bx.moveTo(mePx+8,mtY+1+bob);bx.lineTo(mePx+12,mtY-3+bob);
      bx.lineTo(mePx+7,mtY+3+bob);bx.closePath();bx.fill();
      // Edge highlight lines
      bx.strokeStyle='rgba(200,210,255,0.5)';bx.lineWidth=1;
      bx.beginPath();bx.moveTo(mePx,mtY-6+bob);bx.lineTo(mePx+10,mtY+2+bob);bx.stroke();
      bx.beginPath();bx.moveTo(mePx,mtY-6+bob);bx.lineTo(mePx-10,mtY+2+bob);bx.stroke();
      // Sparkle highlights that flash
      const sparkles=[[2,-4],[6,0],[-5,1],[0,3],[-8,0],[9,1]];
      for(let i=0;i<sparkles.length;i++){
        if(Math.sin(sparkTime+i*1.5)>0.6){
          bx.fillStyle='#ffffff';
          bx.fillRect(mePx+sparkles[i][0],mtY+sparkles[i][1]+bob,1,1);
        }
      }
      bx.lineWidth=1;
    }

    // ---- Emperor Rod (rod_ft1) - Golden throne with jeweled crown ----
    else if(eqRodId==='rod_ft1'){
      const bob=Math.sin(time*1.0)*0.5;
      // Throne base/seat - dark gold shadow
      bx.fillStyle='#907020';bx.fillRect(mePx-7,mtY-1+bob,14,7);
      // Seat cushion
      bx.fillStyle='#c04040';bx.fillRect(mePx-5,mtY+bob,10,4);
      bx.fillStyle='#d05050';bx.fillRect(mePx-4,mtY+1+bob,8,2);
      // Throne sides / armrests
      bx.fillStyle='#b08020';
      bx.fillRect(mePx-7,mtY-3+bob,3,9);bx.fillRect(mePx+4,mtY-3+bob,3,9);
      // Armrest tops (brighter gold)
      bx.fillStyle='#d0a030';
      bx.fillRect(mePx-7,mtY-3+bob,3,2);bx.fillRect(mePx+4,mtY-3+bob,3,2);
      // Throne backrest
      bx.fillStyle='#a07820';bx.fillRect(mePx-5,mtY-10+bob,10,8);
      bx.fillStyle='#c09030';bx.fillRect(mePx-4,mtY-9+bob,8,6);
      // Backrest detail lines
      bx.fillStyle='#a07820';bx.fillRect(mePx-1,mtY-9+bob,2,6);
      // Crown on top of throne
      bx.fillStyle='#ffd700';bx.fillRect(mePx-5,mtY-12+bob,10,3);
      // Crown points
      bx.fillRect(mePx-6,mtY-15+bob,2,3);
      bx.fillRect(mePx-2,mtY-16+bob,2,4);
      bx.fillRect(mePx+2,mtY-15+bob,2,3);
      bx.fillRect(mePx+5,mtY-14+bob,2,2);
      // Crown highlight
      bx.fillStyle='#ffe850';bx.fillRect(mePx-4,mtY-11+bob,8,1);
      // Jewels on crown
      bx.fillStyle='#ff2020';bx.fillRect(mePx-5,mtY-13+bob,2,2); // ruby
      bx.fillStyle='#20ff40';bx.fillRect(mePx-1,mtY-14+bob,2,2); // emerald
      bx.fillStyle='#4488ff';bx.fillRect(mePx+3,mtY-13+bob,2,2); // sapphire
      bx.fillStyle='#ff40ff';bx.fillRect(mePx+5,mtY-13+bob,1,1); // amethyst
      // Jewel sparkle
      if(Math.sin(time*5)>0.5){bx.fillStyle='#fff';bx.fillRect(mePx-5,mtY-13+bob,1,1)}
      if(Math.sin(time*5+2)>0.5){bx.fillStyle='#fff';bx.fillRect(mePx+3,mtY-13+bob,1,1)}
      // Gold feet
      bx.fillStyle='#b08020';
      bx.fillRect(mePx-7,mtY+5+bob,2,2);bx.fillRect(mePx+5,mtY+5+bob,2,2);
    }

    // ---- Infinity Rod (rod_ft2) - Rainbow bridge arc ----
    else if(eqRodId==='rod_ft2'){
      const bob=Math.sin(time*1.2)*0.5;
      const cols2=['#ff3030','#ff7700','#ffdd00','#30dd30','#3080ff','#7030dd','#cc30dd'];
      // Main rainbow arcs (thicker, more visible)
      for(let c=0;c<7;c++){
        bx.strokeStyle=cols2[c];bx.lineWidth=1.5;
        bx.beginPath();
        bx.ellipse(mePx,mtY+12+c*1.2+bob,16,10+c,0,Math.PI+0.3,Math.PI*2-0.3);
        bx.stroke();
      }
      // Shimmer particles along the arc
      for(let p=0;p<5;p++){
        const a=Math.PI+0.5+p*0.4;
        const r=14+Math.sin(time*3+p)*1;
        const px=mePx+Math.cos(a)*r;
        const py=mtY+12+bob+Math.sin(a)*r*0.65;
        const ci=Math.floor((time*2+p)%7);
        bx.fillStyle=cols2[ci];
        bx.fillRect(px,py,1,1);
      }
      // Bright glow at apex
      bx.fillStyle='rgba(255,255,255,0.3)';
      bx.beginPath();bx.ellipse(mePx,mtY+2+bob,4,2,0,0,Math.PI*2);bx.fill();
      bx.lineWidth=1;
    }

    // ---- Nebula Rod (rod_cr1) - Nebula cloud (pink/purple/blue swirling gas) ----
    else if(eqRodId==='rod_cr1'){
      const spin=time*0.8;
      const bob=Math.sin(time*1.2)*1;
      // Outer nebula glow
      bx.fillStyle='rgba(100,40,160,0.2)';
      bx.beginPath();bx.ellipse(mePx,mtY+2+bob,15,6,0,0,Math.PI*2);bx.fill();
      // Blue gas cloud (left)
      bx.fillStyle='rgba(60,80,200,0.35)';
      bx.beginPath();bx.ellipse(mePx-5+Math.sin(spin)*1,mtY+1+bob,7,4,0,0,Math.PI*2);bx.fill();
      // Pink gas cloud (right)
      bx.fillStyle='rgba(200,60,160,0.35)';
      bx.beginPath();bx.ellipse(mePx+5+Math.cos(spin)*1,mtY+1+bob,7,4,0,0,Math.PI*2);bx.fill();
      // Purple center
      bx.fillStyle='rgba(140,60,200,0.4)';
      bx.beginPath();bx.ellipse(mePx,mtY+bob,8,4,0,0,Math.PI*2);bx.fill();
      // Bright center core
      bx.fillStyle='rgba(200,150,255,0.3)';
      bx.beginPath();bx.ellipse(mePx,mtY+bob,4,2,0,0,Math.PI*2);bx.fill();
      // Swirling gas tendrils
      for(let i=0;i<5;i++){
        const a=spin*1.5+i*1.26;
        const r=6+i*1.5;
        const colors=['rgba(180,80,220,0.3)','rgba(80,60,200,0.25)','rgba(220,80,180,0.25)','rgba(100,100,220,0.2)','rgba(180,60,160,0.2)'];
        bx.fillStyle=colors[i];
        bx.fillRect(mePx+Math.cos(a)*r,mtY+bob+Math.sin(a)*r*0.4,2,1);
      }
      // Embedded stars
      for(let s=0;s<4;s++){
        const twinkle=Math.sin(time*3+s*1.5)>0.3?1:0;
        if(twinkle){
          bx.fillStyle='rgba(255,255,255,0.7)';
          bx.fillRect(mePx-6+s*4+Math.sin(s)*2,mtY-1+bob+Math.cos(s)*2,1,1);
        }
      }
    }

    // ---- Cosmic Rod (rod_cr2) - Comet with glowing tail ----
    else if(eqRodId==='rod_cr2'){
      const bob=Math.sin(time*1.5)*1;
      // Comet tail (long, trailing left, gradient from bright to dim)
      for(let t=0;t<8;t++){
        const tailAlpha=0.5-t*0.06;
        const tailWidth=4-t*0.4;
        bx.fillStyle=`rgba(120,160,255,${tailAlpha})`;
        bx.beginPath();bx.ellipse(mePx-4-t*2.5,mtY+2+bob+Math.sin(time*2+t*0.3)*0.5,tailWidth,tailWidth*0.5,0,0,Math.PI*2);bx.fill();
      }
      // Secondary tail (warm color)
      for(let t=0;t<5;t++){
        bx.fillStyle=`rgba(255,200,100,${0.3-t*0.05})`;
        bx.beginPath();bx.ellipse(mePx-3-t*2,mtY+1+bob,2-t*0.2,1,0,0,Math.PI*2);bx.fill();
      }
      // Comet head - outer glow
      bx.fillStyle='rgba(140,180,255,0.4)';
      bx.beginPath();bx.ellipse(mePx+4,mtY+2+bob,7,4,0,0,Math.PI*2);bx.fill();
      // Comet head - bright core
      bx.fillStyle='#aaccff';
      bx.beginPath();bx.ellipse(mePx+4,mtY+1+bob,5,3,0,0,Math.PI*2);bx.fill();
      // Comet nucleus - white hot center
      bx.fillStyle='#ddeeff';
      bx.beginPath();bx.ellipse(mePx+4,mtY+1+bob,3,2,0,0,Math.PI*2);bx.fill();
      bx.fillStyle='#ffffff';
      bx.beginPath();bx.ellipse(mePx+4,mtY+bob,2,1,0,0,Math.PI*2);bx.fill();
      // Sparkle on comet head
      if(Math.sin(time*6)>0.3){
        bx.fillStyle='#ffffff';bx.fillRect(mePx+6,mtY-1+bob,1,1);
      }
    }

    // ---- Default mount for any other strong rod ----
    else {
      const pulse=0.4+Math.sin(time*2)*0.15;
      // Glowing platform base
      bx.fillStyle=`rgba(80,80,120,${pulse*0.5})`;
      bx.beginPath();bx.ellipse(mePx,mtY+3,12,4,0,0,Math.PI*2);bx.fill();
      // Brighter inner disc
      bx.fillStyle=`rgba(120,120,180,${pulse*0.6})`;
      bx.beginPath();bx.ellipse(mePx,mtY+2,9,3,0,0,Math.PI*2);bx.fill();
      // Core glow
      bx.fillStyle=`rgba(160,160,220,${pulse*0.4})`;
      bx.beginPath();bx.ellipse(mePx,mtY+2,5,2,0,0,Math.PI*2);bx.fill();
      // Edge particles
      for(let i=0;i<3;i++){
        const a=time*2+i*2.1;
        bx.fillStyle=`rgba(180,180,255,${pulse*0.5})`;
        bx.fillRect(mePx+Math.cos(a)*10,mtY+2+Math.sin(a)*3,1,1);
      }
    }
  }

  // All players sorted by Y (drawn AFTER mounts so player is in front)
  const drawList=[{data:me,isMe:true,y:me.y}];

  for(const item of drawList){
    const p=item.data;
    const px=Math.floor((p.x||0)-camX),py=Math.floor((p.y||0)-camY);
    if(px<-30||py<-30||px>RW+30||py>RH+30)continue;
    drawPlayerSprite(bx,p,px,py,item.isMe);
  }

  // ========== FISH TANK ON MAP ==========
  if(me.tankPos&&me.tankPos.island===curIsland&&me.fishTank.length>0){
    const tkx=Math.floor(me.tankPos.x-camX),tky=Math.floor(me.tankPos.y-camY);
    if(tkx>-40&&tky>-40&&tkx<RW+40&&tky<RH+40){
      // Glass tank body
      bx.fillStyle='rgba(30,80,120,0.4)';
      bx.fillRect(tkx-16,tky-10,32,20);
      // Water inside
      bx.fillStyle='rgba(40,120,180,0.35)';
      bx.fillRect(tkx-14,tky-6,28,14);
      // Glass edges (shiny)
      bx.strokeStyle='rgba(150,220,255,0.5)';bx.lineWidth=1;
      bx.strokeRect(tkx-16,tky-10,32,20);bx.lineWidth=1;
      // Glass shine
      bx.fillStyle='rgba(200,240,255,0.3)';
      bx.fillRect(tkx-14,tky-9,2,16);
      // Sand at bottom
      bx.fillStyle='#c8a860';
      bx.fillRect(tkx-14,tky+5,28,3);
      // Small plant
      bx.fillStyle='#3a8a3a';
      bx.fillRect(tkx-10,tky+1,1,4);bx.fillRect(tkx-11,tky+1,1,2);
      bx.fillRect(tkx+8,tky+2,1,3);bx.fillRect(tkx+9,tky+3,1,2);
      // Draw fish inside tank (mini sprites swimming around)
      for(let fi=0;fi<me.fishTank.length;fi++){
        const tf=me.fishTank[fi];
        const swimX=tkx-10+((time*15+fi*37)%24);
        const swimY=tky-4+((fi*7)%10)+Math.sin(time*2+fi)*2;
        drawFishSprite(bx,tf.name,tf.rarity,swimX,swimY,0.35);
      }
      // Bubbles rising
      for(let bi=0;bi<3;bi++){
        const bby=tky-4-((time*12+bi*8)%12);
        const bbx=tkx-6+bi*7+Math.sin(time+bi)*2;
        bx.fillStyle='rgba(180,230,255,0.4)';
        bx.beginPath();bx.arc(bbx,bby,1,0,Math.PI*2);bx.fill();
      }
      // Label
      textOverlays.push({type:'label',text:'FISH TANK',x:tkx,y:tky-14,color:'#5be0f5'});
    }
  }

  // ========== PET RENDERING ==========
  if(me.pet){
    const petPx=Math.floor(me.petX-camX),petPy=Math.floor(me.petY-camY);
    if(petPx>-20&&petPy>-20&&petPx<RW+20&&petPy<RH+20){
      const bob=Math.sin(time*3)*1;
      // Shadow
      bx.fillStyle='rgba(0,0,0,0.15)';
      bx.beginPath();bx.ellipse(petPx,petPy+4,3,1.5,0,0,Math.PI*2);bx.fill();
      // Draw the actual fish sprite at small scale
      drawFishSprite(bx,me.pet.name,me.pet.rarity,petPx,petPy+bob,0.6);
      // Sparkle for rare+ pets
      if(me.pet.rarity==='rare'||me.pet.rarity==='epic'||me.pet.rarity==='legendary'){
        if(Math.sin(time*5)>0.7){bx.fillStyle='#fff';bx.fillRect(petPx+Math.cos(time*4)*4,petPy-3+bob,1,1)}
      }
      // Name label
      const pc=_PET_COLS[me.pet.rarity]||'#6a9a6a';
      textOverlays.push({type:'label',text:me.pet.nickname||me.pet.name,x:petPx,y:petPy-8+bob,color:pc});
    }
  }

  // ========== ROD AMBIENT PARTICLES (on top of mounts) ==========
  // Leviathan Rod - 3 big scary necks rising FAR from player
  if(eqRodId==='rod_do3'){
    for(let i=0;i<3;i++){
      // Very far from player: left(-40), right(+40), behind(0, y+20)
      const offsets=[{x:-40,y:6,lean:-2},{x:40,y:6,lean:2},{x:0,y:22,lean:0}];
      const baseX=mePx+offsets[i].x;
      const baseY=mePy+offsets[i].y;
      const sway=Math.sin(time*0.8+i*2.1)*4;
      const lean=offsets[i].lean;

      // Neck - 12 segments, TALL and thick
      let nx=baseX,ny=baseY;
      for(let s=0;s<12;s++){
        const t=s/12;
        const segX=baseX+lean*s*1.2+sway*t*t;
        const segY=baseY-s*5;
        const thick=5-s*0.2;
        // Dark outer
        bx.fillStyle='#0a3535';
        bx.beginPath();bx.ellipse(segX,segY,thick,thick*0.8,0,0,Math.PI*2);bx.fill();
        // Inner
        bx.fillStyle='#1a5555';
        bx.beginPath();bx.ellipse(segX,segY,thick-1,thick*0.5,0,0,Math.PI*2);bx.fill();
        // Belly highlight
        bx.fillStyle='#2a7a6a';
        bx.fillRect(segX-1,segY+1,2,1);
        // Scales
        if(s%2===0){bx.fillStyle='#0a3030';bx.fillRect(segX-thick+1,segY,1,1);bx.fillRect(segX+thick-2,segY,1,1)}
        nx=segX;ny=segY;
      }

      // Big scary head
      const hx=nx+lean+sway*0.2;
      const hy=ny-6;
      // Skull
      bx.fillStyle='#0a3535';
      bx.beginPath();bx.ellipse(hx,hy,6,4,0,0,Math.PI*2);bx.fill();
      bx.fillStyle='#1a5050';
      bx.beginPath();bx.ellipse(hx,hy,5,3,0,0,Math.PI*2);bx.fill();
      // Heavy brow
      bx.fillStyle='#0a2a2a';
      bx.fillRect(hx-5,hy-4,10,2);
      // Red glowing eyes
      bx.fillStyle='#ff0000';
      bx.fillRect(hx-3,hy-2,2,2);
      bx.fillRect(hx+1,hy-2,2,2);
      bx.fillStyle='#000';
      bx.fillRect(hx-2,hy-1,1,1);
      bx.fillRect(hx+2,hy-1,1,1);
      // Jaw
      bx.fillStyle='#0a2a2a';
      bx.fillRect(hx-4,hy+2,8,2);
      // Fangs
      bx.fillStyle='#ddd';
      bx.fillRect(hx-3,hy+2,1,2);
      bx.fillRect(hx+2,hy+2,1,2);
      // Horns
      bx.fillStyle='#0a3030';
      bx.fillRect(hx-4,hy-7,2,4);
      bx.fillRect(hx+2,hy-7,2,4);
    }
  }
  // Celestial Rod - orbiting stars + sparkles
  if(eqRodId==='rod_sk3'){
    for(let i=0;i<5;i++){
      const a=time*1.2+i*1.26;const r=15+Math.sin(time*1.5+i)*3;
      const sx=mePx+Math.cos(a)*r,sy=mePy+Math.sin(a)*r*0.6-4;
      bx.fillStyle='#ffd700';bx.fillRect(sx,sy,2,1);bx.fillRect(sx,sy-1,1,2);
      bx.fillStyle='#fff';bx.fillRect(sx,sy,1,1);
    }
  }
  // Magma Rod - fire particles orbit
  if(eqRodId==='rod_v3'){
    for(let i=0;i<5;i++){
      const a=time*2+i*1.26;const r=12+Math.sin(time*3+i)*3;
      bx.fillStyle=i%3===0?'#ff2000':i%3===1?'#ff8020':'#ffc040';
      bx.fillRect(mePx+Math.cos(a)*r,mePy+Math.sin(a)*r*0.6-3,2,2);
    }
  }
  // Diamond Rod - sparkles everywhere
  if(eqRodId==='rod_c3'){
    for(let i=0;i<7;i++){
      if(Math.sin(time*4+i*1.7)>0.2){const a=time*1.8+i*0.9;const r=6+i*1;
      bx.fillStyle='#fff';bx.fillRect(mePx+Math.cos(a)*r,mePy+Math.sin(a)*r*0.6-3,1,1);
      bx.fillStyle='#80c0ff';bx.fillRect(mePx+Math.cos(a)*r,mePy+Math.sin(a)*r*0.6-2,1,1);}
    }
  }
  // Glacier Rod - snowflakes + icy sparkles
  if(eqRodId==='rod_a3'){
    for(let i=0;i<5;i++){
      const sx=mePx-10+((time*6+i*8)%20);const sy=mePy-10+((time*10+i*10)%24);
      bx.fillStyle='rgba(200,230,255,0.6)';bx.fillRect(sx,sy,1,1);
    }
  }
  // Spore Rod - spore cloud
  if(eqRodId==='rod_mu3'){
    for(let i=0;i<7;i++){
      const a=time*1.5+i*0.9;const r=9+Math.sin(time*2+i)*3;
      bx.fillStyle=`rgba(200,120,255,${0.3+Math.sin(time*3+i)*0.2})`;
      bx.fillRect(mePx+Math.cos(a)*r,mePy+Math.sin(a)*r*0.5-2,2,2);
    }
  }
  // Gator Rod - splashing water
  if(eqRodId==='rod_s3'){
    for(let i=0;i<2;i++){
      bx.fillStyle='rgba(100,180,120,0.3)';
      bx.fillRect(mePx-6+i*10+Math.sin(time*3+i)*2,mtY+6+i,1,1);
    }
  }
  // Wyrm Rod - fire particles
  if(eqRodId==='rod_dl2'){
    for(let i=0;i<4;i++){
      const fy=mePy-((time*15+i*8)%15);const fx=mePx+Math.sin(time*2+i)*7;
      bx.fillStyle=i%2?'#ff4020':'#ffa040';bx.fillRect(fx,fy,1,1);
    }
  }
  // Infinity Rod - rainbow sparkle trail
  if(eqRodId==='rod_ft2'){
    const cols3=['#ff4444','#ff8800','#ffff00','#44ff44','#4488ff','#aa44ff'];
    for(let i=0;i<7;i++){
      const a=time*2+i*0.9;const r=12+Math.sin(time+i)*4;
      bx.fillStyle=cols3[i%6];bx.globalAlpha=0.5;
      bx.fillRect(mePx+Math.cos(a)*r,mePy+Math.sin(a)*r*0.5-2,2,2);
    }
    bx.globalAlpha=1;
  }
  // Tempest Rod - debris flying
  if(eqRodId==='rod_sp3'){
    for(let i=0;i<3;i++){const a=time*3+i*2.1;bx.fillStyle='#8a7a4a';bx.fillRect(mePx+Math.cos(a)*8,mePy+Math.sin(a)*7-3,1,1)}
  }
  // Thor's Rod - lightning flash
  if(eqRodId==='rod_tf3'){
    if(Math.sin(time*7)>0.8){bx.fillStyle='rgba(255,255,200,0.1)';bx.fillRect(mePx-15,mePy-15,30,30)}
  }
  // Void Rod - void particles spiral in
  if(eqRodId==='rod_vw2'){
    for(let i=0;i<5;i++){const a=time*2.5+i*1.26;const r=13-((time*8+i*4)%13);bx.fillStyle=`rgba(180,100,255,${r/13*0.5})`;bx.fillRect(mePx+Math.cos(a)*r,mePy+Math.sin(a)*r*0.6-2,1,1)}
  }
  // Dark Star Rod - light being sucked in
  if(eqRodId==='rod_dn2'){
    for(let i=0;i<5;i++){const a=time*2+i*1.26;const r=14-((time*6+i*5)%14);bx.fillStyle=`rgba(200,150,255,${r/14*0.4})`;bx.fillRect(mePx+Math.cos(a)*r,mePy+Math.sin(a)*r*0.5-2,1,1)}
  }
  // Entropy Rod - glitch effects
  if(eqRodId==='rod_ch2'){
    for(let i=0;i<4;i++){const a=time*4+i;bx.fillStyle=i%2?'#ff2020':'#400';bx.fillRect(mePx+Math.cos(a)*Math.sin(time*2+i)*11,mePy+Math.sin(a)*6-3,2,1)}
  }
  // Emperor Rod - golden orbiting gems
  if(eqRodId==='rod_ft1'){
    for(let i=0;i<3;i++){const a=time*1.5+i*2.1;bx.fillStyle='rgba(255,215,0,0.5)';bx.fillRect(mePx+Math.cos(a)*11,mePy+Math.sin(a)*8-3,2,2)}
  }
  // Coral Rod - bubbles rising
  if(eqRodId==='rod_t2'){
    for(let i=0;i<3;i++){const by2=mePy-3-((time*12+i*8)%18);bx.fillStyle='rgba(180,230,255,0.3)';bx.beginPath();bx.arc(mePx-3+i*3+Math.sin(time+i)*2,by2,1,0,Math.PI*2);bx.fill()}
  }
  // Tiki Rod - smoke wisps
  if(eqRodId==='rod_t3'){
    for(let i=0;i<2;i++){const sy=mePy-8-((time*8+i*6)%10);bx.fillStyle=`rgba(80,80,80,${0.3-((time*8+i*6)%10)/25})`;bx.fillRect(mePx-2+i*4+Math.sin(time+i)*1,sy,1,1)}
  }
  // Pharaoh Rod - golden ankhs
  if(eqRodId==='rod_d3'){
    for(let i=0;i<2;i++){const a=time*1.2+i*3.14;const r=12;const ax=mePx+Math.cos(a)*r,ay=mePy+Math.sin(a)*r*0.5-4;bx.fillStyle='#ffd700';bx.fillRect(ax,ay-1,1,3);bx.fillRect(ax-1,ay,3,1);bx.beginPath();bx.arc(ax+0.5,ay-2,1,0,Math.PI*2);bx.fill()}
  }
  // Cloud Rod - little cloud puffs drift off
  if(eqRodId==='rod_sk2'){
    for(let i=0;i<2;i++){const cx2=mePx+Math.sin(time*0.8+i*3.14)*8;const cy2=mePy+6+i*3;bx.fillStyle='rgba(240,248,255,0.2)';bx.beginPath();bx.ellipse(cx2,cy2,2,1,0,0,Math.PI*2);bx.fill()}
  }

  // FULL SCREEN ability effects while reeling
  // Perf: cache rod ability once for both effect blocks
  const _cachedAbility=(me.state==='reeling'&&me.curFish)?getRodAbility():null;
  if(_cachedAbility){
    const ab=_cachedAbility;
    if(ab==='slowFish'){
      // Falling snow across the whole screen
      for(let i=0;i<60;i++){
        const sx=((i*37+time*8)%RW);
        const sy=((i*29+time*30)%RH);
        bx.fillStyle='rgba(180,230,255,0.6)';
        bx.fillRect(sx,sy,2,2);
        bx.fillStyle='#fff';
        bx.fillRect(sx,sy,1,1);
      }
      bx.fillStyle='rgba(120,200,255,0.06)';
      bx.fillRect(0,0,RW,RH);
    }
    if(ab==='fireBurst'||ab==='fastReel'){
      // Embers rising
      for(let i=0;i<50;i++){
        const sx=((i*43+time*5)%RW);
        const life=((i*13+time*40)%80);
        const sy=RH-life*1.5;
        if(sy<0)continue;
        const fade=1-life/80;
        const col=life<20?`rgba(255,255,${100+life*5},${fade*0.8})`:`rgba(255,${140-life},20,${fade*0.7})`;
        bx.fillStyle=col;
        bx.fillRect(sx+Math.sin(life*0.2)*3,sy,2,2);
      }
      bx.fillStyle='rgba(255,80,20,0.04)';
      bx.fillRect(0,0,RW,RH);
    }
    if(ab==='superFast'){
      // Lightning bolts flashing
      for(let i=0;i<30;i++){
        const sx=((i*53+time*100)%RW);
        const sy=((i*31+time*60)%RH);
        bx.fillStyle=Math.sin(time*8+i)>0?'rgba(255,255,100,0.9)':'rgba(150,200,255,0.6)';
        bx.fillRect(sx,sy,1,3);
      }
      if(Math.sin(time*15)>0.85){
        bx.fillStyle='rgba(255,255,100,0.08)';
        bx.fillRect(0,0,RW,RH);
      }
    }
    if(ab==='divine'){
      // Rainbow particles all over
      const colors=['#ff5050','#ffaa30','#ffff50','#50ff50','#50aaff','#aa50ff'];
      for(let i=0;i<80;i++){
        const sx=((i*23+time*12)%RW);
        const sy=((i*41+time*15)%RH);
        bx.fillStyle=colors[i%colors.length];
        bx.globalAlpha=0.6+Math.sin(time*3+i)*0.3;
        bx.fillRect(sx,sy,2,2);
      }
      bx.globalAlpha=1;
      bx.fillStyle='rgba(255,220,100,0.05)';
      bx.fillRect(0,0,RW,RH);
    }
    if(ab==='luck'||ab==='luck2'||ab==='luck3'){
      const n=ab==='luck'?20:ab==='luck2'?40:60;
      for(let i=0;i<n;i++){
        const sx=((i*43+time*6)%RW);
        const sy=((i*31+time*8)%RH);
        const a=time*3+i;
        bx.fillStyle=`rgba(255,220,80,${0.7+Math.sin(a*2)*0.3})`;
        bx.fillRect(sx,sy,2,2);
        bx.fillStyle='#fff';
        bx.fillRect(sx,sy,1,1);
      }
    }
    if(ab==='xpBoost'||ab==='xpBoost2'||ab==='zephyr'){
      for(let i=0;i<40;i++){
        const sx=((i*37+time*15)%RW);
        const sy=((i*29+time*10)%RH);
        bx.fillStyle='rgba(80,255,150,0.7)';
        bx.fillRect(sx,sy,2,2);
      }
    }
    if(ab==='coinBoost'||ab==='coinBoost2'||ab==='coinBoost3'||ab==='legendaryX2'){
      for(let i=0;i<35;i++){
        const sx=((i*41+time*10)%RW);
        const sy=((i*23+time*12)%RH);
        bx.fillStyle='rgba(255,215,0,0.8)';
        bx.fillRect(sx,sy,2,2);
        bx.fillStyle='rgba(255,180,0,0.7)';
        bx.fillRect(sx+1,sy,1,1);
      }
    }
    if(ab==='unbreakable'){
      // Golden shield particles
      for(let i=0;i<35;i++){
        const sx=((i*47+time*8)%RW);
        const sy=((i*19+time*9)%RH);
        bx.fillStyle=`rgba(255,215,0,${0.6+Math.sin(time*3+i)*0.3})`;
        bx.fillRect(sx,sy,2,2);
      }
      bx.fillStyle='rgba(255,215,0,0.05)';
      bx.fillRect(0,0,RW,RH);
    }
    if(ab==='wideCursor'){
      // Light blue mist
      for(let i=0;i<40;i++){
        const sx=((i*37+time*6)%RW);
        const sy=((i*29+time*7)%RH);
        bx.fillStyle='rgba(100,200,255,0.5)';
        bx.fillRect(sx,sy,2,2);
      }
    }
  }

  // Reeling minigame UI (Fisch style with ability effects)
  if(_cachedAbility){
    const f=me.curFish;
    const mgW=120,mgH=14;
    const mgX=(RW-mgW)/2;
    const mgY=RH-30;
    const abR=_cachedAbility;

    // Background FIRST so effects show on top
    bx.fillStyle='rgba(0,0,0,0.75)';
    bx.fillRect(mgX-3,mgY-3,mgW+6,mgH+22);

    // Helper: draw particles OUTSIDE the bar (above and below)
    function emitParticle(px2,py2,col,sz){
      bx.fillStyle=col;
      bx.fillRect(px2,py2,sz,sz);
    }

    // ICE AURA (slowFish) - snowflakes above and below bar only
    if(abR==='slowFish'){
      for(let i=0;i<12;i++){
        const sx=mgX+((i*23+time*15)%mgW);
        // Above bar
        const syAbove=mgY-12+((i*17+time*15)%10);
        emitParticle(sx,syAbove,'rgba(180,230,255,0.9)',2);
        emitParticle(sx,syAbove,'#fff',1);
        // Below bar
        const syBelow=mgY+mgH+10+((i*19+time*18)%10);
        emitParticle(sx,syBelow,'rgba(180,230,255,0.9)',2);
        emitParticle(sx,syBelow,'#fff',1);
      }
    }
    // FIRE (fireBurst, fastReel, magma) - flames below bar rising up
    if(abR==='fireBurst'||abR==='fastReel'){
      for(let i=0;i<14;i++){
        const sx=mgX+((i*11+time*10)%mgW);
        // Flames below rising
        const life=((i*7+time*30)%20);
        const sy=mgY+mgH+10-life;
        const fade=1-life/20;
        if(life<20){
          const col=life<8?`rgba(255,255,${80+life*10},${fade})`:`rgba(255,${120-life*4},20,${fade})`;
          emitParticle(sx,sy,col,2);
        }
      }
    }
    // LIGHTNING (superFast) - bolts above and below
    if(abR==='superFast'){
      for(let i=0;i<8;i++){
        const sx=mgX+((i*17+time*40)%mgW);
        emitParticle(sx,mgY-6-(i%3),'rgba(255,255,100,1)',1);
        emitParticle(sx,mgY-4-(i%3),'rgba(255,255,200,0.8)',1);
        emitParticle(sx,mgY+mgH+4+(i%3),'rgba(255,255,100,1)',1);
      }
      // Electric flash border
      if(Math.sin(time*10)>0.5){
        bx.strokeStyle='rgba(255,255,100,0.6)';bx.lineWidth=1;
        bx.strokeRect(mgX-2,mgY-2,mgW+4,mgH+4);
      }
    }
    // DIVINE RAINBOW - rainbow particles orbiting above and below
    if(abR==='divine'){
      const colors=['#ff5050','#ffaa30','#ffff50','#50ff50','#50aaff','#aa50ff'];
      for(let i=0;i<18;i++){
        const sx=mgX+((i*13+time*18)%mgW);
        // Above
        const syA=mgY-8+Math.sin(time*3+i)*4;
        emitParticle(sx,syA,colors[i%colors.length],2);
        // Below
        const syB=mgY+mgH+4+Math.sin(time*3+i+1)*4;
        emitParticle(sx,syB,colors[(i+3)%colors.length],2);
      }
      // Golden glow border
      bx.strokeStyle='rgba(255,220,100,0.5)';bx.lineWidth=1;
      bx.strokeRect(mgX-2,mgY-2,mgW+4,mgH+4);
    }
    // LUCK SPARKLES - twinkles above bar
    if(abR==='luck'||abR==='luck2'||abR==='luck3'){
      const n=abR==='luck'?5:abR==='luck2'?9:14;
      for(let i=0;i<n;i++){
        const a=time*3+i*0.8;
        const sx=mgX+((i*19+time*8)%mgW);
        const sy=mgY-8+Math.sin(a)*3;
        emitParticle(sx,sy,`rgba(255,220,80,${0.8+Math.sin(a*2)*0.2})`,2);
        emitParticle(sx,sy,'#fff',1);
      }
    }
    // XP BOOST - green trails below bar
    if(abR==='xpBoost'||abR==='xpBoost2'||abR==='zephyr'){
      for(let i=0;i<10;i++){
        const sx=mgX+((i*17+time*15)%mgW);
        const sy=mgY+mgH+6+Math.sin(time*3+i)*3;
        emitParticle(sx,sy,`rgba(80,255,150,0.9)`,2);
      }
    }
    // COIN BOOST - golden coins below
    if(abR==='coinBoost'||abR==='coinBoost2'||abR==='coinBoost3'||abR==='legendaryX2'){
      for(let i=0;i<8;i++){
        const sx=mgX+((i*21+time*12)%mgW);
        const sy=mgY+mgH+6+Math.sin(time*2+i)*3;
        emitParticle(sx,sy,'rgba(255,215,0,0.9)',2);
        emitParticle(sx+1,sy,'rgba(255,180,0,0.9)',1);
      }
    }
    // WIDE CURSOR / UNBREAKABLE are drawn as cursor glow later

    // Bar track - tinted by ability
    let trackCol='#1a1a2e';
    if(abR==='slowFish')trackCol='#1a2a4a';
    if(abR==='fireBurst'||abR==='fastReel')trackCol='#2a1a1a';
    if(abR==='divine')trackCol='#2a1a3a';
    bx.fillStyle=trackCol;
    bx.fillRect(mgX,mgY,mgW,mgH);
    bx.strokeStyle='#3a3a5e';bx.lineWidth=1;
    bx.strokeRect(mgX+0.5,mgY+0.5,mgW-1,mgH-1);

    // Fish target (red zone)
    const fishX=mgX+(me.fishPos/100)*mgW;
    // Ice effect on fish
    if(abR==='slowFish'){
      bx.fillStyle='rgba(150,220,255,0.4)';
      bx.fillRect(fishX-5,mgY-2,10,mgH+4);
    }
    bx.fillStyle='#e03030';
    bx.fillRect(fishX-3,mgY+1,6,mgH-2);
    bx.fillStyle='#ff6060';
    bx.fillRect(fishX-2,mgY+1,4,2);
    bx.fillStyle='#fff';
    bx.fillRect(fishX-1,mgY+5,2,2);

    // Player bar (green zone - wider with better rods)
    let barW=4+me.rodLv*1.2;
    if(abR==='wideCursor')barW*=1.6;
    const playerX=mgX+(me.barPos/100)*mgW;
    const overlap=Math.abs(me.barPos-me.fishPos)<barW;

    // UNBREAKABLE golden shield aura
    if(abR==='unbreakable'){
      bx.fillStyle=`rgba(255,215,0,${0.3+Math.sin(time*4)*0.2})`;
      bx.fillRect(playerX-barW/2-3,mgY-3,barW+6,mgH+6);
      bx.strokeStyle='#ffd700';bx.lineWidth=1;
      bx.strokeRect(playerX-barW/2-2.5,mgY-2.5,barW+5,mgH+5);
    }
    // WIDE CURSOR glow
    if(abR==='wideCursor'){
      bx.fillStyle='rgba(100,200,255,0.2)';
      bx.fillRect(playerX-barW/2-2,mgY-2,barW+4,mgH+4);
    }
    // SUPER FAST motion trail
    if(abR==='superFast'){
      bx.fillStyle='rgba(255,255,100,0.3)';
      bx.fillRect(playerX-barW/2-me.barVel*0.08,mgY,barW,mgH);
    }

    // Player cursor
    bx.fillStyle=overlap?'rgba(74,222,128,0.55)':'rgba(74,158,255,0.45)';
    bx.fillRect(playerX-barW/2,mgY-1,barW,mgH+2);
    bx.strokeStyle=overlap?'#4ade80':'#4a9eff';bx.lineWidth=1;
    bx.strokeRect(playerX-barW/2+0.5,mgY-0.5,barW-1,mgH+1);

    // Fish name label above
    bx.fillStyle='rgba(0,0,0,0.6)';
    bx.fillRect(mgX,mgY-10,mgW,8);

    // Progress bar below
    bx.fillStyle='#1a1a2e';
    bx.fillRect(mgX,mgY+mgH+2,mgW,4);
    bx.fillStyle=me.reelProg>70?'#4ade80':me.reelProg>30?'#eab308':'#e03030';
    bx.fillRect(mgX,mgY+mgH+2,mgW*(Math.max(0,me.reelProg)/100),4);
    // Progress shine with double catch anim
    if(abR==='doubleCatch'){
      const sh=(time*30)%mgW;
      bx.fillStyle='rgba(255,150,50,0.5)';
      bx.fillRect(mgX+sh,mgY+mgH+2,4,4);
    }

    // Label text (drawn on full-res)
    reelLabel='HOLD SPACE TO REEL';
  }

  // Boss fight HUD
  if(bossFight){
    // Dark overlay
    bx.fillStyle='rgba(0,0,0,0.3)';bx.fillRect(0,0,RW,RH);

    // Boss HP bar (top)
    const bhpW=180,bhpH=12,bhpX=(RW-bhpW)/2,bhpY=20;
    bx.fillStyle='rgba(0,0,0,0.7)';bx.fillRect(bhpX-2,bhpY-2,bhpW+4,bhpH+4);
    bx.fillStyle='#333';bx.fillRect(bhpX,bhpY,bhpW,bhpH);
    bx.fillStyle=bossDmgTimer>0?'#fff':'#e03030';
    bx.fillRect(bhpX,bhpY,Math.max(0,bhpW*(bossHP/bossMaxHP)),bhpH);

    // Player HP bar
    const phpY=bhpY+bhpH+8;
    bx.fillStyle='rgba(0,0,0,0.7)';bx.fillRect(bhpX-2,phpY-2,bhpW+4,bhpH+4);
    bx.fillStyle='#333';bx.fillRect(bhpX,phpY,bhpW,bhpH);
    bx.fillStyle='#22c55e';
    bx.fillRect(bhpX,phpY,Math.max(0,bhpW*(bossPlayerHP/bossPlayerMaxHP)),bhpH);

    // Fight bar (timing attacks)
    const fbY=phpY+bhpH+20;
    const fbW=180,fbH=16,fbX=(RW-fbW)/2;
    bx.fillStyle='rgba(0,0,0,0.7)';bx.fillRect(fbX-2,fbY-2,fbW+4,fbH+4);
    bx.fillStyle='#1a1a3a';bx.fillRect(fbX,fbY,fbW,fbH);

    // Hit zone (where boss is)
    const hzW=20-curWorld*2;
    const hzX=fbX+(bossHitZone/100)*fbW-hzW/2;
    bx.fillStyle='rgba(255,50,50,0.5)';bx.fillRect(hzX,fbY,hzW,fbH);

    // Player swing cursor
    const scX=fbX+(bossSwingPos/100)*fbW;
    bx.fillStyle='#ffd700';bx.fillRect(scX-2,fbY-2,4,fbH+4);

    // Labels
    textOverlays.push({type:'label',text:'BOSS',x:bhpX+bhpW/2,y:bhpY+bhpH/2+1,color:'#ff4444'});
    textOverlays.push({type:'label',text:'YOU',x:bhpX+bhpW/2,y:phpY+bhpH/2+1,color:'#44ff44'});
    textOverlays.push({type:'label',text:'PRESS SPACE TO ATTACK!',x:fbX+fbW/2,y:fbY+fbH+12,color:'#ffd700'});
  }

  // Toast - draw box on pixel buffer, text on full-res
  if(me.toast&&me.toastT>0){
    bx.globalAlpha=Math.min(1,me.toastT);
    const tw=60,th=22,tx2=RW/2-tw/2,ty2=RH/2-40;
    bx.fillStyle='rgba(0,0,0,0.85)';bx.fillRect(tx2,ty2,tw,th);
    bx.globalAlpha=1;
    const tCol=me.toast.lost?'#f56565':me.toast.full?'#f5a623':me.toast.fish?RARITY_COL[me.toast.fish.rarity]:'#5be0f5';
    toastOverlay={msg:me.toast.msg,color:tCol,alpha:Math.min(1,me.toastT),
      fish:me.toast.fish,lost:me.toast.lost,y:ty2};
  }

  // Manual sailing - ocean map view
  if(sailing){
    // Ocean background
    bx.fillStyle='#0a2040';bx.fillRect(0,0,RW,RH);
    // Animated waves
    for(let row=0;row<RH;row+=4){
      const w=Math.sin(time*1.5+row*0.08)*5;
      bx.fillStyle=`rgba(20,${60+w},${130+w},0.4)`;
      bx.fillRect(0,row,RW,3);
    }
    // Foam dots
    for(let i=0;i<15;i++){
      const fx=((time*8+i*23)%(RW+10))-5;
      const fy2=((time*3+i*37)%(RH+10))-5;
      bx.fillStyle='rgba(255,255,255,0.08)';
      bx.fillRect(fx,fy2,3,1);
    }

    // Camera centered on boat
    const ocCamX=sailX-RW/2;
    const ocCamY=sailY-RH/2;

    // Draw islands for the target world only
    const sailWorld=ISLANDS[sailTargetIsland].world||0;
    const sailWorldIslands=ISLANDS.filter(isl3=>isl3.world===sailWorld);
    for(const isl3 of sailWorldIslands){
      const i=isl3.id;
      const ip=ISLAND_POS[i];
      const ix=ip.x-ocCamX,iy=ip.y-ocCamY;
      if(ix<-30||iy<-30||ix>RW+30||iy>RH+30)continue;
      const unlocked=islandUnlocked(isl3);
      const isTarget=i===sailTargetIsland;

      // Island blob
      if(unlocked){
        bx.fillStyle=isl3.sand;
        bx.beginPath();bx.ellipse(ix,iy,10,8,0,0,Math.PI*2);bx.fill();
        bx.fillStyle=isl3.grass[0];
        bx.beginPath();bx.ellipse(ix,iy-1,8,6,0,0,Math.PI*2);bx.fill();
        const wc2=isl3.water[0];
        bx.fillStyle=wc2;
        bx.beginPath();bx.ellipse(ix+1,iy,3,2,0,0,Math.PI*2);bx.fill();
        // Boss crown icon
        if(isl3.isBossIsland){
          bx.fillStyle='#ffd700';
          bx.fillRect(ix-3,iy-11,6,3);
          bx.fillRect(ix-4,iy-13,2,2);
          bx.fillRect(ix-1,iy-14,2,3);
          bx.fillRect(ix+2,iy-13,2,2);
        }
      }else{
        bx.fillStyle='rgba(100,100,100,0.3)';
        bx.beginPath();bx.ellipse(ix,iy,10,8,0,0,Math.PI*2);bx.fill();
        bx.fillStyle='rgba(60,60,60,0.4)';
        bx.fillRect(ix-1,iy-1,3,3);
      }

      if(isTarget){
        const pulse=Math.sin(time*4)*0.3+0.7;
        bx.strokeStyle=`rgba(91,224,245,${pulse})`;
        bx.lineWidth=1;
        bx.beginPath();bx.ellipse(ix,iy,13,11,0,0,Math.PI*2);bx.stroke();
      }

      textOverlays.push({type:'label',text:isl3.name+(unlocked?'':` (Lv.${isl3.level})`),x:ix,y:iy+14,color:isTarget?'#5be0f5':unlocked?'#fff':'#666'});
    }

    // Boat (player)
    const bx2=sailX-ocCamX,by2=sailY-ocCamY;
    const boatRock=Math.sin(time*2)*0.1;
    bx.save();bx.translate(bx2,by2);bx.rotate(boatRock);
    // Hull
    bx.fillStyle='#6a4a2a';
    bx.beginPath();bx.moveTo(-6,-2);bx.lineTo(8,-2);bx.lineTo(6,3);bx.lineTo(-4,3);bx.fill();
    bx.fillStyle='#8a6a3a';bx.fillRect(-4,-3,10,2);
    // Mast + sail
    bx.fillStyle='#5a3a1a';bx.fillRect(1,-10,1,8);
    bx.fillStyle='#e8e0d0';
    bx.beginPath();bx.moveTo(2,-9);bx.lineTo(7+Math.sin(time*3),-6);bx.lineTo(2,-3);bx.fill();
    // Player
    const col=me.color||COLORS[me.colorIdx||0];
    bx.fillStyle=col.body;bx.fillRect(-2,-5,3,3);
    bx.fillStyle='#f5c06a';bx.fillRect(-1,-7,2,2);
    bx.restore();
    // Wake
    bx.fillStyle='rgba(255,255,255,0.15)';
    for(let w2=0;w2<3;w2++)bx.fillRect(bx2-6-w2*4,by2+2+Math.sin(time*3+w2),3,1);

    // Compass arrow pointing to target
    const tgt=ISLAND_POS[sailTargetIsland];
    const angle=Math.atan2(tgt.y-sailY,tgt.x-sailX);
    const dist2=Math.sqrt(Math.pow(tgt.x-sailX,2)+Math.pow(tgt.y-sailY,2));
    // Draw compass in corner of pixel buffer
    const compX=RW-18,compY=18;
    // Circle
    bx.strokeStyle='rgba(255,255,255,0.3)';bx.lineWidth=1;
    bx.beginPath();bx.arc(compX,compY,12,0,Math.PI*2);bx.stroke();
    bx.fillStyle='rgba(0,0,0,0.5)';
    bx.beginPath();bx.arc(compX,compY,11,0,Math.PI*2);bx.fill();
    // Arrow
    bx.save();bx.translate(compX,compY);bx.rotate(angle);
    bx.fillStyle='#e03030';
    bx.beginPath();bx.moveTo(9,0);bx.lineTo(-3,-4);bx.lineTo(-1,0);bx.lineTo(-3,4);bx.fill();
    bx.fillStyle='#fff';
    bx.beginPath();bx.moveTo(-9,0);bx.lineTo(-1,-3);bx.lineTo(-1,3);bx.fill();
    bx.restore();

    // Distance + target name on full-res canvas
    sailingText=`${ISLANDS[sailTargetIsland].name} - ${Math.round(dist2)}m`;
  }

  // ========== GEM NODES ==========
  for(const gn of gemNodes){
    if(gn.mined)continue;
    const gnx=Math.floor(gn.x-camX),gny=Math.floor(gn.y-camY);
    if(gnx<-10||gny<-10||gnx>RW+10||gny>RH+10)continue;
    // Rock
    bx.fillStyle='#4a4a5a';
    bx.fillRect(gnx-3,gny-2,6,4);bx.fillRect(gnx-2,gny-3,4,6);
    // Gem sparkle
    const sparkle=Math.sin(time*4+gn.x)*0.5+0.5;
    bx.fillStyle=`rgba(180,100,255,${0.4+sparkle*0.4})`;
    bx.fillRect(gnx-1,gny-1,2,2);
    bx.fillStyle=`rgba(255,200,255,${sparkle*0.6})`;
    bx.fillRect(gnx,gny-1,1,1);
  }

  // ========== FOOTPRINTS ON SAND ==========
  for(const fp of footprints){
    const fpx=Math.floor(fp.x-camX),fpy=Math.floor(fp.y-camY);
    if(fpx>-5&&fpy>-5&&fpx<RW+5&&fpy<RH+5){
      const alpha=Math.max(0,1-fp.age/8)*0.3;
      bx.fillStyle=`rgba(80,60,30,${alpha})`;
      bx.fillRect(fpx-1,fpy+3,2,2);bx.fillRect(fpx+1,fpy+4,2,2);
    }
  }

  // ========== TREASURE BOTTLES ON WATER ==========
  for(const b of bottles){
    const btx=Math.floor(b.x-camX),bty=Math.floor(b.y-camY);
    if(btx>-5&&bty>-5&&btx<RW+5&&bty<RH+5){
      const bob2=Math.sin(time*3+b.x)*1.5;
      // Bottle body
      bx.fillStyle='#4a8a3a';bx.fillRect(btx-1,bty+bob2-2,3,4);
      // Cork
      bx.fillStyle='#c8a040';bx.fillRect(btx,bty+bob2-3,1,2);
      // Sparkle
      if(Math.sin(time*5+b.x)>0.8){bx.fillStyle='#ffd700';bx.fillRect(btx+1,bty+bob2-3,1,1)}
    }
  }

  // ========== LUCKY FISHING SPOTS ==========
  for(const ls of luckySpots){
    const lsx=Math.floor(ls.x-camX),lsy=Math.floor(ls.y-camY);
    if(lsx>-10&&lsy>-10&&lsx<RW+10&&lsy<RH+10){
      // Glowing ring on water
      const pulse=0.4+Math.sin(time*4)*0.3;
      bx.strokeStyle=`rgba(255,215,0,${pulse})`;bx.lineWidth=1;
      bx.beginPath();bx.arc(lsx,lsy,5+Math.sin(time*2)*2,0,Math.PI*2);bx.stroke();
      // Sparkles
      for(let i=0;i<4;i++){
        const sx2=lsx+Math.cos(time*2+i*1.57)*6;
        const sy2=lsy+Math.sin(time*2+i*1.57)*4;
        bx.fillStyle=`rgba(255,255,100,${pulse})`;
        bx.fillRect(sx2,sy2,1,1);
      }
    }
  }

  // ========== CAMPFIRE ==========
  if(campfirePos&&campfirePos.island===curIsland){
    const cfx=Math.floor(campfirePos.x-camX),cfy=Math.floor(campfirePos.y-camY);
    if(cfx>-20&&cfy>-20&&cfx<RW+20&&cfy<RH+20){
      // Logs
      bx.fillStyle='#5a3a1a';bx.fillRect(cfx-4,cfy+1,8,3);
      bx.fillStyle='#4a2a0a';bx.fillRect(cfx-3,cfy+2,3,2);bx.fillRect(cfx+1,cfy+2,3,2);
      // Fire glow
      const flicker=0.5+Math.sin(time*8)*0.2+Math.sin(time*12)*0.1;
      bx.fillStyle=`rgba(255,120,20,${flicker*0.3})`;
      bx.beginPath();bx.arc(cfx,cfy-2,8,0,Math.PI*2);bx.fill();
      // Flames
      for(let i=0;i<4;i++){
        const fx2=cfx-2+i*1.5+Math.sin(time*10+i)*1;
        const fy2=cfy-1-Math.abs(Math.sin(time*8+i*2))*5;
        const h=3+Math.sin(time*6+i)*2;
        bx.fillStyle=i%2===0?'#ff6020':'#ffcc00';
        bx.fillRect(fx2,fy2,1,h);
      }
      // Particles
      for(const cp of campfireParticles){
        const cpx=Math.floor(cp.x-camX),cpy=Math.floor(cp.y-camY);
        bx.fillStyle=cp.col;bx.globalAlpha=cp.life;
        bx.fillRect(cpx,cpy,1,1);
      }
      bx.globalAlpha=1;
      // Light radius at night
      if(getDayPhase()==='night'){
        bx.fillStyle='rgba(255,150,50,0.06)';
        bx.beginPath();bx.arc(cfx,cfy,30,0,Math.PI*2);bx.fill();
      }
    }
  }

  // ========== TREASURE MAP DIG SPOT ==========
  if(activeTreasureMap&&activeTreasureMap.island===curIsland){
    const tdx=Math.floor(activeTreasureMap.x-camX),tdy=Math.floor(activeTreasureMap.y-camY);
    if(tdx>-10&&tdy>-10&&tdx<RW+10&&tdy<RH+10){
      // X marks the spot!
      bx.fillStyle=`rgba(255,50,50,${0.5+Math.sin(time*3)*0.3})`;
      bx.fillRect(tdx-3,tdy-3,2,2);bx.fillRect(tdx+2,tdy-3,2,2);
      bx.fillRect(tdx-1,tdy-1,2,2);
      bx.fillRect(tdx-3,tdy+2,2,2);bx.fillRect(tdx+2,tdy+2,2,2);
    }
  }

  // ========== FIREFLIES (night only) ==========
  if(getDayPhase()==='night'||getDayPhase()==='dusk'){
    for(const ff of fireflies){
      const ffx=Math.floor(ff.x-camX),ffy=Math.floor(ff.y-camY);
      if(ffx<-5||ffy<-5||ffx>RW+5||ffy>RH+5)continue;
      const glow=0.3+Math.sin(ff.phase)*0.7;
      if(glow>0.2){
        bx.fillStyle=`rgba(200,255,100,${glow*0.8})`;
        bx.fillRect(ffx,ffy,2,2);
        bx.fillStyle=`rgba(200,255,100,${glow*0.3})`;
        bx.fillRect(ffx-1,ffy-1,4,4);
      }
    }
  }

  // ========== WEATHER EFFECTS ==========
  if(weather==='rain'||weather==='storm'){
    for(const rd of raindrops){
      const rx=((rd.x+time*20)%RW);
      const ry=((rd.y+time*rd.spd)%RH);
      bx.fillStyle=weather==='storm'?'rgba(180,200,255,0.5)':'rgba(150,180,220,0.35)';
      bx.fillRect(rx,ry,1,3);
    }
    // Puddle ripples on ground
    if(weather==='storm'){
      for(let i=0;i<8;i++){
        const rx=((i*47+time*10)%RW);
        const ry=((i*31+time*5)%RH);
        const rr=1+Math.sin(time*4+i)*1;
        bx.strokeStyle='rgba(150,200,255,0.2)';bx.lineWidth=0.5;
        bx.beginPath();bx.arc(rx,ry,rr,0,Math.PI*2);bx.stroke();
      }
    }
  }
  if(weather==='fog'){
    // Fog patches
    for(let i=0;i<12;i++){
      const fx3=((i*43+time*3)%RW)-10;
      const fy3=((i*67)%RH);
      bx.fillStyle='rgba(200,210,220,0.12)';
      bx.beginPath();bx.ellipse(fx3,fy3,20+Math.sin(time+i)*5,8,0,0,Math.PI*2);bx.fill();
    }
  }

  // ========== WATER REFLECTIONS (moonlight/sunlight shimmer) ==========
  if(getDayPhase()==='night'){
    // Moonlight reflections on water
    for(let i=0;i<15;i++){
      const mx=((i*29+time*4)%RW);
      const my=((i*41+time*2)%RH);
      const tile=tileAt(mx+camX,my+camY);
      if(tile===1){
        bx.fillStyle=`rgba(200,220,255,${0.1+Math.sin(time*3+i)*0.08})`;
        bx.fillRect(mx,my,2,1);
      }
    }
  }else if(getDayPhase()==='day'){
    // Sun sparkles on water
    for(let i=0;i<10;i++){
      const mx=((i*37+time*6)%RW);
      const my=((i*53+time*3)%RH);
      const tile=tileAt(mx+camX,my+camY);
      if(tile===1&&Math.sin(time*5+i*2)>0.85){
        bx.fillStyle='rgba(255,255,200,0.4)';
        bx.fillRect(mx,my,1,1);
      }
    }
  }

  // ========== NORTHERN LIGHTS (arctic islands only) ==========
  if(curIsland===3||curIsland===17){// Arctic + Frozen Lake
    if(getDayPhase()==='night'||getDayPhase()==='dusk'){
      const aColors=['rgba(100,255,150,0.06)','rgba(100,200,255,0.05)','rgba(200,100,255,0.04)'];
      for(let i=0;i<5;i++){
        const ax=((i*60+time*8)%RW);
        const ay=5+i*8+Math.sin(time*0.5+i)*5;
        const aw=40+Math.sin(time*0.3+i*2)*15;
        bx.fillStyle=aColors[i%3];
        bx.beginPath();bx.ellipse(ax,ay,aw,3+Math.sin(time+i)*2,Math.sin(time*0.2+i)*0.3,0,Math.PI*2);bx.fill();
      }
    }
  }

  // ========== SEASONAL LEAVES/PETALS ==========
  if(curIsland===0||curIsland===15){// Meadow + Riverside - flower petals
    for(let i=0;i<8;i++){
      const lx=((i*43+time*12)%RW);
      const ly=((i*29+time*8+Math.sin(time+i*2)*15)%RH);
      bx.fillStyle=i%2===0?'rgba(255,180,200,0.5)':'rgba(255,220,180,0.4)';
      bx.fillRect(lx,ly,2,1);
    }
  }
  if(curIsland===5){// Mushroom - spores
    for(let i=0;i<10;i++){
      const lx=((i*37+time*5)%RW);
      const ly=((i*41-time*10+300)%RH);
      bx.fillStyle=`rgba(180,255,180,${0.3+Math.sin(time*2+i)*0.2})`;
      bx.fillRect(lx,ly,1,1);
    }
  }

  // ========== DAY/NIGHT OVERLAY ==========
  const brightness=getDayBrightness();
  if(brightness<1){
    const darkness=1-brightness;
    bx.fillStyle=`rgba(10,10,40,${darkness*0.6})`;
    bx.fillRect(0,0,RW,RH);
    // Stars at night
    if(getDayPhase()==='night'){
      for(let i=0;i<30;i++){
        const sx2=(i*97+i*i*13)%RW;
        const sy2=(i*61+i*i*7)%Math.floor(RH*0.5);
        const twinkle=0.3+Math.sin(time*2+i*1.7)*0.4;
        bx.fillStyle=`rgba(255,255,255,${twinkle})`;
        bx.fillRect(sx2,sy2,1,1);
      }
      // Moon
      bx.fillStyle='rgba(240,240,200,0.8)';
      bx.beginPath();bx.arc(RW*0.8,RH*0.12,6,0,Math.PI*2);bx.fill();
      bx.fillStyle='rgba(220,220,180,0.5)';
      bx.beginPath();bx.arc(RW*0.8-1,RH*0.12-1,4,0,Math.PI*2);bx.fill();
    }
    // Dawn/dusk colors
    if(getDayPhase()==='dawn'){
      bx.fillStyle='rgba(255,150,80,0.08)';bx.fillRect(0,0,RW,RH);
    }
    if(getDayPhase()==='dusk'){
      bx.fillStyle='rgba(255,100,50,0.1)';bx.fillRect(0,0,RW,RH);
    }
  }

  // ========== SHOOTING STARS ==========
  for(const ss of shootingStars){
    const trail=Math.min(ss.life*10,8);
    bx.strokeStyle=`rgba(255,255,200,${ss.life})`;bx.lineWidth=1;
    bx.beginPath();bx.moveTo(ss.x,ss.y);bx.lineTo(ss.x-ss.vx*0.03*trail,ss.y-ss.vy*0.03*trail);bx.stroke();
    bx.fillStyle='#fff';bx.fillRect(ss.x,ss.y,2,1);
  }

  // ========== LIGHTNING FLASH ==========
  if(lightningFlash>0){
    bx.fillStyle=`rgba(255,255,255,${lightningFlash*0.3})`;
    bx.fillRect(0,0,RW,RH);
  }

  // ========== FISH SPLASH PARTICLES ON CAST ==========
  if(me.state==='waiting'&&me.waitT>3.5){
    // Just cast - show splash
    for(let i=0;i<6;i++){
      const splX=me.bobX-camX+rand(-6,6);
      const splY=me.bobY-camY-rand(2,8);
      bx.fillStyle='rgba(150,200,255,0.6)';
      bx.fillRect(splX,splY,1,1);
    }
  }

  ctx.clearRect(0,0,W,H);
  ctx.imageSmoothingEnabled=false;
  ctx.drawImage(buf,0,0,RW,RH,0,0,W,H);

  // ---- FULL-RES TEXT OVERLAY ----
  ctx.imageSmoothingEnabled=true;
  ctx.textAlign='center';

  // Player names, chat, labels
  for(const t of textOverlays){
    const sx2=t.x*SC,sy2=t.y*SC;
    if(t.type==='name'){
      ctx.font=t.isBoss?'bold 14px monospace':'bold 13px monospace';
      ctx.fillStyle='rgba(0,0,0,0.5)';
      ctx.fillText(t.text,sx2+1,sy2+1);
      ctx.fillStyle=t.isBoss?'#ff4444':t.isMe?'#5be0f5':'#fff';
      ctx.fillText(t.text,sx2,sy2);
    }
    if(t.type==='chat'){
      ctx.font='12px monospace';
      const tw2=ctx.measureText(t.text).width+10;
      ctx.fillStyle='rgba(255,255,255,0.9)';
      ctx.fillRect(sx2-tw2/2,sy2-10,tw2,16);
      ctx.fillStyle='#111';
      ctx.fillText(t.text,sx2,sy2+2);
    }
    if(t.type==='label'){
      ctx.font='bold 14px monospace';
      ctx.fillStyle='rgba(0,0,0,0.5)';
      ctx.fillText(t.text,sx2+1,sy2+1);
      ctx.fillStyle=t.color||'#ffd700';
      ctx.fillText(t.text,sx2,sy2);
    }
  }

  // Bite indicators
  for(const t of textOverlays){
    if(t.type==='bite'){
      ctx.font='bold 20px monospace';
      ctx.fillStyle='#ffd700';
      ctx.fillText('!',t.x*SC,t.y*SC);
    }
  }

  // Tournament HUD
  if(tourneyActive){
    const tBarW=120*SC/3;
    const tBarX=W/2-tBarW/2;
    ctx.fillStyle='rgba(0,0,0,0.7)';ctx.fillRect(tBarX,4,tBarW,16);
    ctx.fillStyle='#f5a623';ctx.fillRect(tBarX+2,6,Math.max(0,(tBarW-4)*(tourneyTimer/60)),12);
    ctx.font='bold 13px monospace';
    ctx.fillStyle='#ffd700';
    ctx.fillText(Math.ceil(tourneyTimer)+'s  $'+tourneyScore,W/2,34);
  }

  // Toast overlay text
  if(toastOverlay){
    const t=toastOverlay;
    ctx.globalAlpha=t.alpha;
    ctx.font='bold 16px monospace';
    ctx.fillStyle=t.color;
    ctx.fillText(t.msg,W/2,t.y*SC+22);
    if(t.fish){
      ctx.font='14px monospace';
      ctx.fillStyle='#ddd';
      ctx.fillText(`${t.fish.name} ${t.fish.size}cm`,W/2,t.y*SC+42);
      if(!t.lost){ctx.fillStyle='#ffd700';ctx.fillText(`$${fishVal(t.fish)}`,W/2,t.y*SC+60)}
    }
    ctx.globalAlpha=1;
  }

  // Sailing text
  if(sailingText){
    ctx.font='bold 22px monospace';
    ctx.fillStyle='rgba(0,0,0,0.5)';
    ctx.fillText(sailingText,W/2+1,H-55);
    ctx.fillStyle='#fff';
    ctx.fillText(sailingText,W/2,H-56);
  }

  // Reel minigame label
  if(reelLabel){
    ctx.font='bold 18px monospace';
    ctx.fillStyle='rgba(0,0,0,0.6)';
    ctx.fillText(reelLabel,W/2+1,H-115);
    ctx.fillStyle='#5be0f5';
    ctx.fillText(reelLabel,W/2,H-116);
  }


  ctx.imageSmoothingEnabled=false;
}

// ========== LOOP ==========
let lastT=0;
function loop(t){
  const dt=Math.min((t-lastT)/1000,0.05);
  lastT=t;
  update(dt);
  render();
  for(const k in justKeys)justKeys[k]=false;
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
</body>
</html>
