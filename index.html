<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reel Master - Online</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:#0a1628;overflow:hidden;font-family:monospace;user-select:none;color:#fff}
  canvas{display:block;image-rendering:pixelated;image-rendering:crisp-edges}

  /* Screens */
  .screen{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:100;background:#0a1628}
  .screen h1{font-size:48px;color:#5be0f5;text-shadow:3px 3px 0 #1a5a6e;margin-bottom:4px}
  .screen .sub{font-size:15px;color:#4a6a8a;margin-bottom:20px}

  .avatar-row{display:flex;gap:10px;margin-bottom:16px;flex-wrap:wrap;justify-content:center}
  .avatar-pick{
    width:44px;height:44px;border-radius:6px;cursor:pointer;
    border:3px solid transparent;display:flex;align-items:center;justify-content:center;
    font-size:22px;transition:border-color 0.15s;
  }
  .avatar-pick:hover{border-color:#5a8af5}
  .avatar-pick.sel{border-color:#5be0f5}

  input[type=text]{
    width:240px;padding:10px 16px;font-size:16px;font-family:monospace;
    background:#1a2a4a;border:2px solid #2a3a5a;color:#fff;
    text-align:center;margin-bottom:12px;border-radius:4px;outline:none;
  }
  input:focus{border-color:#5be0f5}

  .btn{
    padding:12px 36px;font-size:17px;font-weight:700;font-family:monospace;
    border:none;border-bottom:4px solid;cursor:pointer;color:#fff;
    text-transform:uppercase;letter-spacing:2px;margin:4px;
  }
  .btn:hover{filter:brightness(1.15)}
  .btn:active{border-bottom-width:2px;margin-top:6px}
  .btn-green{background:#22c55e;border-color:#1a8a3a}
  .btn-blue{background:#3b82f6;border-color:#1e40af}
  .btn-orange{background:#f59e0b;border-color:#b45309}
  .btn-sm{padding:8px 20px;font-size:14px}

  .row{display:flex;gap:8px;margin-bottom:12px}

  .room-code{
    font-size:36px;color:#ffd700;letter-spacing:6px;
    background:#1a2a4a;padding:12px 28px;border-radius:6px;
    border:2px solid #3a4a6a;margin:12px 0;
  }
  .waiting{color:#5a7a9a;font-size:14px;margin-top:8px}
  .dot-anim::after{content:'';animation:dots 1.5s infinite}
  @keyframes dots{0%{content:''}33%{content:'.'}66%{content:'..'}100%{content:'...'}}

  .status-msg{color:#4ade80;font-size:14px;margin:8px 0}
  .error-msg{color:#f56565;font-size:14px;margin:8px 0}

  /* HUD */
  #hud{
    position:fixed;top:0;left:0;right:0;height:30px;
    display:none;align-items:center;justify-content:space-between;
    padding:0 12px;background:rgba(0,0,0,0.75);
    font-size:13px;z-index:10;
  }
  .hud-coins{color:#ffd700}
  .hud-bag{color:#7dd3fc}
  .hud-status{color:#5a7a9a;font-size:11px}

  /* Leaderboard */
  #leaderboard{
    position:fixed;right:8px;top:38px;width:155px;
    background:rgba(0,0,0,0.75);border:1px solid #2a2a4e;
    padding:8px;font-size:11px;display:none;z-index:10;
  }
  #leaderboard h4{text-align:center;color:#ffd700;margin-bottom:6px;font-size:12px}
  .lb-row{display:flex;justify-content:space-between;padding:2px 4px;border-bottom:1px solid #1a1a3e}
  .lb-row.me{color:#5be0f5}

  /* Hotbar */
  /* Backpack button */
  #bp-btn{
    position:fixed;bottom:12px;left:12px;
    width:50px;height:50px;
    background:rgba(0,0,0,0.8);border:2px solid #2a3a5a;
    border-radius:10px;cursor:pointer;
    display:none;z-index:15;
    font-size:24px;line-height:50px;text-align:center;
    transition:border-color 0.15s;
  }
  #bp-btn:hover{border-color:#5be0f5}

  /* Boat button */
  #boat-btn{
    position:fixed;bottom:12px;left:70px;
    width:50px;height:50px;
    background:rgba(0,0,0,0.8);border:2px solid #1a4a6a;
    border-radius:10px;cursor:pointer;
    display:none;z-index:15;
    font-size:22px;line-height:50px;text-align:center;
    transition:border-color 0.15s;
  }
  #boat-btn:hover{border-color:#5be0f5}
  #boat-btn.at-dock{border-color:#5be0f5;box-shadow:0 0 8px rgba(91,224,245,0.4)}
  #bp-btn .bp-count{
    position:absolute;top:-4px;right:-4px;
    background:#e03030;color:#fff;font-size:10px;font-family:monospace;font-weight:700;
    padding:1px 5px;border-radius:8px;min-width:16px;text-align:center;
  }

  /* Backpack panel */
  #bp-panel{
    position:fixed;bottom:70px;left:12px;
    width:320px;max-width:85vw;max-height:70vh;overflow-y:auto;
    background:rgba(0,0,0,0.9);border:2px solid #2a3a5a;
    border-radius:10px;padding:14px;
    font-family:monospace;font-size:12px;color:#fff;
    display:none;z-index:14;
  }
  #bp-panel h4{text-align:center;margin-bottom:8px;font-size:14px}
  .bp-tab-row{display:flex;gap:4px;margin-bottom:10px;justify-content:center}
  .bp-tab{
    padding:5px 14px;border:1px solid #2a3a5a;background:#0a0a2e;
    color:#5a7a9a;font-family:monospace;font-size:12px;cursor:pointer;border-radius:4px;
  }
  .bp-tab:hover{border-color:#5a8af5;color:#fff}
  .bp-tab.active{border-color:#5be0f5;color:#5be0f5;background:#0a1a3e}
  .bp-item{
    display:flex;justify-content:space-between;align-items:center;
    padding:6px 8px;background:#0a0a2e;border:1px solid #1a1a3e;
    margin-bottom:3px;border-radius:4px;
  }
  .bp-item-info{display:flex;align-items:center;gap:8px}
  .bp-item-icon{
    width:28px;height:22px;border-radius:3px;display:flex;
    align-items:center;justify-content:center;font-size:14px;
  }
  .bp-item-name{font-size:12px}
  .bp-item-detail{font-size:10px;color:#5a7a9a}
  .bp-item-btn{
    padding:3px 8px;border:1px solid;font-family:monospace;font-size:11px;
    font-weight:700;cursor:pointer;border-radius:3px;
  }
  .bp-sell-btn{border-color:#b08020;background:#f5a623;color:#111}
  .bp-sell-btn:hover{background:#ffc040}
  .bp-equip-btn{border-color:#2a8a4a;background:#22c55e;color:#fff}
  .bp-equip-btn:hover{background:#16a34a}
  .bp-equipped{color:#4ade80;font-size:11px;font-weight:700}
  .bp-sail-btn{border-color:#1a6a9a;background:#0ea5e9;color:#fff}
  .bp-sail-btn:hover{background:#0284c7}
  .fp-sell-all{
    width:100%;padding:7px;margin-top:6px;
    border:1px solid #b08020;background:#f5a623;
    color:#111;font-family:monospace;font-size:12px;font-weight:700;
    cursor:pointer;border-radius:4px;
  }
  .fp-sell-all:hover{background:#ffc040}
  .fp-empty{color:#3a3a5e;text-align:center;padding:14px 0}

  /* Shop */
  #shop-modal{
    position:fixed;inset:0;background:rgba(0,0,0,0.7);
    display:none;align-items:center;justify-content:center;z-index:50;
  }
  .shop-box{
    background:#111;border:2px solid #444;padding:16px 20px;
    width:340px;max-width:95vw;
  }
  .shop-box h2{text-align:center;color:#f5a623;font-size:18px;margin-bottom:2px}
  .shop-coins-d{text-align:center;color:#ffd700;margin-bottom:10px;font-size:13px}
  .shop-item{
    display:flex;justify-content:space-between;align-items:center;
    padding:6px 8px;background:#0a0a1e;border:1px solid #1a1a3e;margin-bottom:3px;
  }
  .shop-item h4{font-size:12px;color:#ccc}
  .shop-item p{font-size:10px;color:#666}
  .shop-buy{
    padding:3px 10px;border:1px solid #2a8a4a;background:#22c55e;
    color:#fff;font-family:monospace;font-size:11px;font-weight:700;cursor:pointer;
  }
  .shop-buy:disabled{opacity:0.3;cursor:not-allowed}
  .shop-owned{color:#4ade80;font-size:11px}
  .shop-close{
    display:block;margin:10px auto 0;padding:6px 20px;
    border:1px solid #555;background:#333;color:#fff;font-family:monospace;font-size:13px;cursor:pointer;
  }

  /* Admin Panel */
  #admin-modal{
    position:fixed;inset:0;background:rgba(0,0,0,0.85);
    display:none;align-items:center;justify-content:center;z-index:200;
  }
  .admin-box{
    background:#0a0a1a;border:2px solid #ff4444;padding:16px 20px;
    width:380px;max-width:95vw;max-height:85vh;overflow-y:auto;
    font-family:monospace;color:#fff;border-radius:8px;
  }
  .admin-box h2{text-align:center;color:#ff4444;font-size:18px;margin-bottom:10px}
  .admin-section{margin-bottom:12px}
  .admin-section h4{color:#ff8888;font-size:12px;text-transform:uppercase;margin-bottom:6px;border-bottom:1px solid #2a1a1a;padding-bottom:3px}
  .admin-row{
    display:flex;justify-content:space-between;align-items:center;
    padding:4px 6px;margin-bottom:3px;background:#111;border:1px solid #1a1a2a;border-radius:3px;
  }
  .admin-row label{font-size:12px;color:#ccc}
  .admin-btn{
    padding:3px 10px;border:1px solid #ff4444;background:#cc0000;
    color:#fff;font-family:monospace;font-size:11px;font-weight:700;cursor:pointer;border-radius:3px;
  }
  .admin-btn:hover{background:#ff2222}
  .admin-btn-green{border-color:#2a8a4a;background:#22c55e}
  .admin-btn-green:hover{background:#16a34a}
  .admin-btn-gold{border-color:#b08020;background:#f5a623;color:#111}
  .admin-btn-gold:hover{background:#ffc040}
  .admin-input{
    width:70px;padding:3px 6px;font-family:monospace;font-size:12px;
    background:#1a1a2a;border:1px solid #333;color:#fff;text-align:center;border-radius:3px;
  }
  .admin-close{
    display:block;margin:10px auto 0;padding:6px 20px;
    border:1px solid #555;background:#333;color:#fff;font-family:monospace;font-size:13px;cursor:pointer;
  }
  #admin-login{text-align:center}
  #admin-login input{
    width:120px;padding:8px;font-size:18px;font-family:monospace;
    background:#1a1a2a;border:2px solid #333;color:#fff;text-align:center;
    letter-spacing:6px;border-radius:4px;margin-bottom:10px;
  }
  #admin-login input:focus{border-color:#ff4444;outline:none}
  .admin-wrong{color:#ff4444;font-size:12px;margin-top:6px}

  /* Tutorial */
  #tutorial{
    position:fixed;inset:0;display:none;align-items:center;justify-content:center;
    z-index:60;background:rgba(0,0,0,0.65);
  }
  .tut-box{
    background:#0f1e38;border:2px solid #2a4a7a;border-radius:12px;
    padding:24px 32px;color:#fff;text-align:center;
    max-width:380px;font-family:monospace;animation:popIn 0.3s ease;
  }
  .tut-box h2{font-size:20px;color:#5be0f5;margin-bottom:8px}
  .tut-box p{font-size:14px;color:#b0c4de;line-height:1.7;margin-bottom:16px}
  .tut-box .tut-keys{
    display:inline-block;background:#1a2a4a;border:1px solid #3a5a8a;
    padding:3px 10px;border-radius:4px;font-size:13px;color:#ffd700;
    margin:2px;
  }
  .tut-box .tut-step{color:#5a7a9a;font-size:12px;margin-bottom:10px}
  .tut-box img{image-rendering:pixelated}
  .btn-tut{
    padding:10px 32px;font-size:16px;font-weight:700;font-family:monospace;
    border:none;border-bottom:3px solid #1a8a3a;
    background:#22c55e;color:#fff;cursor:pointer;text-transform:uppercase;
  }
  .btn-tut:hover{background:#16a34a}
  .btn-skip{
    display:block;margin:10px auto 0;background:none;border:none;
    color:#5a7a9a;font-family:monospace;font-size:12px;cursor:pointer;
  }
  .btn-skip:hover{color:#fff}

  /* Travel modal */
  #travel-modal{
    position:fixed;inset:0;background:rgba(0,0,0,0.75);
    display:none;align-items:center;justify-content:center;z-index:50;
  }
  .travel-box{
    background:#0f1e38;border:2px solid #2a4a7a;padding:16px 20px;
    width:380px;max-width:95vw;max-height:80vh;overflow-y:auto;font-family:monospace;color:#fff;
  }
  .travel-box h2{text-align:center;color:#5be0f5;font-size:18px;margin-bottom:12px}
  .island-card{
    padding:8px 10px;background:#0a0a2e;border:1px solid #1a1a3e;
    margin-bottom:4px;display:flex;justify-content:space-between;align-items:center;
    cursor:pointer;border-radius:4px;
  }
  .island-card:hover{border-color:#3a5a8a}
  .island-card.current{border-color:#5be0f5;background:#0a1a3e}
  .island-card.locked{opacity:0.4;cursor:default}
  .island-card h4{font-size:13px;color:#ccc}
  .island-card p{font-size:10px;color:#5a7a9a}
  .island-card .island-price{color:#ffd700;font-size:12px;font-weight:700}
  .island-card .island-current{color:#5be0f5;font-size:11px}
  .island-card .island-unlocked{color:#4ade80;font-size:11px}
  .travel-close{
    display:block;margin:10px auto 0;padding:6px 20px;
    border:1px solid #555;background:#333;color:#fff;font-family:monospace;font-size:13px;cursor:pointer;
  }
  /* Island name display */
  #island-name{
    position:fixed;top:34px;left:50%;transform:translateX(-50%);
    background:rgba(0,0,0,0.6);padding:3px 14px;border-radius:0 0 8px 8px;
    color:#5be0f5;font-family:monospace;font-size:12px;font-weight:700;
    z-index:10;display:none;
  }

  /* Active quest tracker */
  #quest-tracker{
    position:fixed;right:8px;top:38px;width:180px;
    background:rgba(10,15,30,0.55);backdrop-filter:blur(4px);
    border:1px solid rgba(91,224,245,0.4);border-radius:6px;
    padding:8px 10px;font-family:monospace;color:#fff;font-size:11px;
    display:none;z-index:10;
  }
  #quest-tracker .qt-label{
    color:#5be0f5;font-size:10px;text-transform:uppercase;letter-spacing:1px;margin-bottom:3px;
  }
  #quest-tracker .qt-title{color:#fff;font-size:12px;font-weight:700;margin-bottom:4px}
  #quest-tracker .qt-desc{color:#b0c4de;font-size:10px;line-height:1.4;margin-bottom:6px}
  #quest-tracker .qt-progress-bar{
    background:rgba(0,0,0,0.4);height:4px;border-radius:2px;overflow:hidden;margin-bottom:4px;
  }
  #quest-tracker .qt-progress-fill{
    background:linear-gradient(90deg,#4ade80,#5be0f5);height:100%;
  }
  #quest-tracker .qt-progress-text{color:#4ade80;font-size:11px;text-align:right}
  #quest-tracker .qt-reward{color:#ffd700;font-size:10px;margin-top:4px;text-align:center}
  #quest-tracker.complete{border-color:#4ade80;background:rgba(20,40,20,0.55)}

  /* Quest modal */
  #quest-modal{
    position:fixed;inset:0;background:rgba(0,0,0,0.7);
    display:none;align-items:center;justify-content:center;z-index:50;
  }
  .quest-box{
    background:#0f1e38;border:2px solid #5be0f5;padding:20px 24px;
    width:380px;max-width:95vw;font-family:monospace;color:#fff;
    border-radius:8px;
  }
  .quest-box h2{text-align:center;color:#5be0f5;font-size:20px;margin-bottom:4px}
  .quest-box .giver-name{text-align:center;color:#fbbf24;font-size:13px;margin-bottom:12px}
  .quest-desc{background:#0a0a2e;padding:10px;border:1px solid #1a1a3e;border-radius:4px;margin-bottom:10px;font-size:13px;line-height:1.5}
  .quest-progress{text-align:center;color:#4ade80;font-size:14px;margin:10px 0}
  .quest-reward{text-align:center;color:#ffd700;font-size:14px;margin-bottom:12px}
  .quest-btn-row{display:flex;gap:6px;justify-content:center}
  .quest-btn{
    padding:8px 20px;border:1px solid;font-family:monospace;font-size:13px;font-weight:700;cursor:pointer;border-radius:4px;
  }
  .quest-accept{border-color:#2a8a4a;background:#22c55e;color:#fff}
  .quest-accept:hover{background:#16a34a}
  .quest-close-btn{border-color:#555;background:#333;color:#fff}
  .quest-turn-in{border-color:#b08020;background:#f5a623;color:#111}

  .hidden{display:none!important}
</style>
</head>
<body>

<canvas id="c"></canvas>

<!-- HUD -->
<div id="hud">
  <div style="display:flex;gap:16px;align-items:center">
    <span style="color:#5be0f5">Lv.<span id="h-level">1</span></span>
    <span style="color:#7dd3fc;font-size:10px"><span id="h-xp">0</span>/<span id="h-xpmax">50</span>XP</span>
    <span class="hud-coins">$<span id="h-coins">0</span></span>
    <span class="hud-bag">Bag: <span id="h-bag">0</span>/<span id="h-bmax">5</span></span>
    <span id="h-rod" style="color:#c084fc;font-size:11px"></span>
  </div>
  <span class="hud-status" id="h-status"></span>
  <button id="name-btn" onclick="changeName()" style="background:none;border:1px solid #3a5a8a;color:#5be0f5;font-family:monospace;font-size:11px;padding:2px 8px;cursor:pointer;border-radius:3px">Name</button>
</div>
<div id="leaderboard"><h4>LEADERBOARD</h4><div id="lb-rows"></div></div>
<button id="admin-btn" onclick="toggleAdmin()" style="position:fixed;bottom:68px;left:12px;width:50px;height:50px;background:rgba(0,0,0,0.8);border:2px solid #ff4444;border-radius:10px;cursor:pointer;display:none;z-index:15;font-size:20px;line-height:50px;text-align:center;color:#ff4444;font-family:monospace;font-weight:700">⚙</button>
<button id="bp-btn" onclick="toggleBackpack()">&#127890;<div class="bp-count" id="bp-count">0</div></button>
<button id="boat-btn" onclick="clickBoatBtn()">&#9973;</button>
<div id="bp-panel">
  <div class="bp-tab-row">
    <div class="bp-tab active" onclick="switchBpTab('fish')">Bag</div>
    <div class="bp-tab" onclick="switchBpTab('index')">Index</div>
    <div class="bp-tab" onclick="switchBpTab('rods')">Rods</div>
    <div class="bp-tab" onclick="switchBpTab('items')">Items</div>
  </div>
  <div id="bp-content"></div>
</div>
<div id="shop-modal"><div class="shop-box" id="shop-content"></div></div>
<div id="travel-modal"><div class="travel-box" id="travel-content"></div></div>
<div id="quest-modal"><div class="quest-box" id="quest-content"></div></div>
<div id="quest-tracker"></div>
<div id="island-name"></div>

<!-- TUTORIAL -->
<div id="tutorial">
  <div class="tut-box" id="tut-content"></div>
</div>

<!-- TITLE SCREEN -->
<div class="screen" id="screen-title">
  <h1>REEL MASTER</h1>
  <p class="sub">pixel fishing</p>
  <p style="color:#5a7a9a;font-size:13px;margin-bottom:14px">Choose your look:</p>
  <div class="avatar-row" id="avatar-row"></div>
  <input id="name-input" type="text" placeholder="Enter username..." maxlength="14">
  <button class="btn btn-green" onclick="startSolo()">PLAY</button>
</div>

<!-- ADMIN PANEL -->
<div id="admin-modal">
  <div class="admin-box">
    <h2>ADMIN PANEL</h2>
    <div id="admin-login">
      <p style="color:#888;font-size:12px;margin-bottom:8px">Enter password:</p>
      <input type="password" id="admin-pass" maxlength="4" placeholder="****">
      <br>
      <button class="admin-btn" onclick="checkAdminPass()">UNLOCK</button>
      <div id="admin-wrong"></div>
    </div>
    <div id="admin-content" style="display:none"></div>
  </div>
</div>

<script>
// ========== CANVAS ==========
const canvas=document.getElementById('c');
const ctx=canvas.getContext('2d');
ctx.imageSmoothingEnabled=false;
const SC=3;
let W,H,RW,RH;
const buf=document.createElement('canvas');
const bx=buf.getContext('2d');

function resize(){
  W=innerWidth;H=innerHeight;
  canvas.width=W;canvas.height=H;
  RW=Math.floor(W/SC);RH=Math.floor(H/SC);
  buf.width=RW;buf.height=RH;
  bx.imageSmoothingEnabled=false;
  ctx.imageSmoothingEnabled=false;
}
addEventListener('resize',resize);resize();

// ========== AVATAR COLORS ==========
const COLORS=[
  {name:'Blue',body:'#3b82f6',dark:'#1e40af',light:'#60a5fa'},
  {name:'Red',body:'#ef4444',dark:'#991b1b',light:'#f87171'},
  {name:'Green',body:'#22c55e',dark:'#166534',light:'#4ade80'},
  {name:'Purple',body:'#a855f7',dark:'#6b21a8',light:'#c084fc'},
  {name:'Orange',body:'#f97316',dark:'#9a3412',light:'#fb923c'},
  {name:'Pink',body:'#ec4899',dark:'#9d174d',light:'#f472b6'},
  {name:'Cyan',body:'#06b6d4',dark:'#155e75',light:'#22d3ee'},
  {name:'Yellow',body:'#eab308',dark:'#854d0e',light:'#facc15'},
];

let selAvatar=0;
const avatarRow=document.getElementById('avatar-row');

function genIslandMap(island){
  map=[];trees=[];
  const seed=island.id*1000;
  const id=island.id;
  function srand(s){return((Math.sin(s)*10000)%1+1)%1}

  // Fill with ocean
  for(let y=0;y<MH;y++){map[y]=[];for(let x=0;x<MW;x++){map[y][x]=6}}

  const cx=MW/2,cy=MH/2;

  // ---- UNIQUE ISLAND SHAPES ----
  function islandDist(x,y){
    const dx=(x-cx),dy=(y-cy);
    const noise=srand(seed+x*7+y*13)*3+srand(seed+x*3+y*19)*2;

    if(id===0){
      // Meadow: big round island
      return Math.sqrt(dx*dx*0.5+dy*dy*0.5)-18+noise;
    }else if(id===1){
      // Tropical: long horizontal island with bump
      return Math.sqrt(dx*dx*0.25+dy*dy*0.8)-16+noise;
    }else if(id===2){
      // Swamp: blobby irregular shape
      const n2=Math.sin(dx*0.3)*3+Math.cos(dy*0.4)*3;
      return Math.sqrt(dx*dx*0.5+dy*dy*0.5)-16+noise+n2;
    }else if(id===3){
      // Arctic: wide diamond
      return (Math.abs(dx)*0.7+Math.abs(dy)*0.7)-18+noise;
    }else if(id===4){
      // Volcano: circular with dent in top (crater)
      let d=Math.sqrt(dx*dx*0.5+dy*dy*0.5)-17+noise;
      if(Math.sqrt(dx*dx+Math.pow(dy+3,2))<6)d=-5; // crater lake area
      return d;
    }else if(id===5){
      // Mushroom: round top, thin stem going south
      const top=Math.sqrt(dx*dx*0.4+Math.pow(dy+6,2)*0.5)-14;
      const stem=Math.abs(dx)-4+Math.max(0,(dy-4))*0.2;
      return Math.min(top,dy>2?stem:top)+noise*0.5;
    }else if(id===6){
      // Desert: L-shaped
      const horiz=Math.max(Math.abs(dx+5)-14,Math.abs(dy+5)-8);
      const vert=Math.max(Math.abs(dx-8)-8,Math.abs(dy-3)-12);
      return Math.min(horiz,vert)+noise*0.5;
    }else if(id===7){
      // Crystal: star/cross shape
      const arm1=Math.max(Math.abs(dx)-16,Math.abs(dy)-6);
      const arm2=Math.max(Math.abs(dx)-6,Math.abs(dy)-16);
      return Math.min(arm1,arm2)+noise*0.4;
    }else if(id===8){
      // Deep Ocean: crescent moon
      const outer=Math.sqrt(dx*dx+dy*dy)-18;
      const inner=Math.sqrt(Math.pow(dx+8,2)+dy*dy)-14;
      return Math.max(outer,-inner)+noise*0.5;
    }else if(id===9){
      // Sky: ring/donut island
      const ring=Math.abs(Math.sqrt(dx*dx*0.5+dy*dy*0.5)-12)-5;
      return ring+noise*0.4;
    }else if(id===10){
      // Storm Peak: jagged lightning bolt shape
      const zigzag=Math.abs(dx+Math.sin(dy*0.5)*6)-8;
      const vert=Math.abs(dy)-18;
      return Math.max(zigzag,vert)+noise*0.3;
    }else if(id===11){
      // Dragon's Lair: large irregular claw
      const claw1=Math.sqrt(Math.pow(dx-5,2)*0.4+Math.pow(dy-6,2)*0.6)-10;
      const claw2=Math.sqrt(Math.pow(dx+5,2)*0.4+Math.pow(dy-6,2)*0.6)-10;
      const palm=Math.sqrt(dx*dx*0.3+Math.pow(dy+4,2)*0.4)-14;
      return Math.min(Math.min(claw1,claw2),palm)+noise*0.4;
    }else if(id===12){
      // Void Wastes: scattered fragments (multiple blobs)
      const b1=Math.sqrt(Math.pow(dx+8,2)+Math.pow(dy+5,2))-8;
      const b2=Math.sqrt(Math.pow(dx-7,2)+Math.pow(dy-6,2))-7;
      const b3=Math.sqrt(Math.pow(dx-2,2)+Math.pow(dy+8,2))-6;
      const b4=Math.sqrt(Math.pow(dx+5,2)+Math.pow(dy-8,2))-5;
      return Math.min(Math.min(b1,b2),Math.min(b3,b4))+noise*0.3;
    }else if(id===13){
      // Cosmic Reef: spiral galaxy shape
      const angle=Math.atan2(dy,dx);
      const dist=Math.sqrt(dx*dx+dy*dy);
      const spiral=Math.sin(angle*2-dist*0.3)*4;
      return dist-16-spiral+noise*0.3;
    }else if(id===14){
      // Final Throne: large imposing square fortress
      const fort=Math.max(Math.abs(dx)-16,Math.abs(dy)-14);
      return fort+noise*0.3;
    }
    return Math.sqrt(dx*dx+dy*dy)-16+noise;
  }

  // Apply island shape
  for(let y=0;y<MH;y++)for(let x=0;x<MW;x++){
    const d=islandDist(x,y);
    if(d<-1)map[y][x]=0;
    else if(d<0.5)map[y][x]=2;
  }

  // Lake(s) - position varies per island
  const lakeConfigs=[
    [{x:cx+5,y:cy+2,r:7}],                          // 0 meadow
    [{x:cx,y:cy,r:5},{x:cx-12,y:cy,r:3}],             // 1 tropical
    [{x:cx-3,y:cy,r:6},{x:cx+8,y:cy-4,r:4},{x:cx-6,y:cy+5,r:3}], // 2 swamp - multiple
    [{x:cx,y:cy-2,r:6}],                              // 3 arctic
    [{x:cx,y:cy-3,r:5}],                              // 4 volcano crater
    [{x:cx,y:cy-4,r:5}],                              // 5 mushroom
    [{x:cx-4,y:cy-2,r:4},{x:cx+6,y:cy+5,r:3}],       // 6 desert oasis
    [{x:cx,y:cy,r:5}],                                // 7 crystal
    [{x:cx-5,y:cy,r:5}],                              // 8 crescent
    [{x:cx,y:cy,r:4},{x:cx+8,y:cy-6,r:3}],           // 9 sky
    [{x:cx,y:cy-4,r:5}],                              // 10 storm peak
    [{x:cx+3,y:cy+2,r:6},{x:cx-5,y:cy-3,r:4}],       // 11 dragon's lair
    [{x:cx-6,y:cy-3,r:4},{x:cx+5,y:cy+5,r:3}],       // 12 void wastes
    [{x:cx,y:cy,r:5},{x:cx-6,y:cy+4,r:3}],            // 13 cosmic reef
    [{x:cx,y:cy,r:7}],                                // 14 final throne
  ];
  const lakes=lakeConfigs[id]||[{x:cx,y:cy,r:6}];
  for(const lk of lakes){
    for(let y=0;y<MH;y++)for(let x=0;x<MW;x++){
      const dx2=x-lk.x,dy2=y-lk.y;
      const d2=Math.sqrt(dx2*dx2*0.7+dy2*dy2);
      if(d2<lk.r&&map[y][x]===0)map[y][x]=1;
      else if(d2<lk.r+1&&map[y][x]===0)map[y][x]=2;
    }
  }

  // River between first two lakes if multiple
  if(lakes.length>=2){
    const l1=lakes[0],l2=lakes[1];
    const steps=40;
    for(let i=0;i<=steps;i++){
      const t=i/steps;
      const rx2=Math.floor(l1.x+(l2.x-l1.x)*t);
      const ry2=Math.floor(l1.y+(l2.y-l1.y)*t+Math.sin(t*6)*2);
      for(let d=-1;d<=1;d++){
        if(ry2+d>=0&&ry2+d<MH&&rx2>=0&&rx2<MW&&map[ry2+d][rx2]===0)map[ry2+d][rx2]=1;
      }
    }
  }

  // Fishing dock near first lake
  const lk0=lakes[0];
  for(let i=0;i<4;i++){
    const dy4=Math.floor(lk0.y);
    const dx4=Math.floor(lk0.x-lk0.r-2+i);
    if(dy4>=0&&dy4<MH&&dx4>=0&&dx4<MW&&map[dy4][dx4]===0)map[dy4][dx4]=4;
    if(dy4+1<MH&&dx4>=0&&dx4<MW&&map[dy4+1][dx4]===0)map[dy4+1][dx4]=4;
  }

  // Boat dock - on sand right next to grass (search outward from center-south)
  let boatPlaced=false;
  for(let r=5;r<Math.max(MW,MH)&&!boatPlaced;r++){
    for(let dy8=-r;dy8<=r&&!boatPlaced;dy8++){
      for(let dx8=-r;dx8<=r&&!boatPlaced;dx8++){
        const bx3=Math.floor(cx)+dx8,by3=Math.floor(cy)+Math.abs(dy8); // bias south
        if(bx3<1||by3<1||bx3>=MW-2||by3>=MH-2)continue;
        // Need sand tile with grass neighbor AND ocean neighbor
        if(map[by3][bx3]===2){
          let hasGrass=false,hasOcean=false;
          for(let d=-2;d<=2;d++){
            if(by3+d>=0&&by3+d<MH){
              if(map[by3+d][bx3]===0)hasGrass=true;
              if(map[by3+d][bx3]===6)hasOcean=true;
            }
            if(bx3+d>=0&&bx3+d<MW){
              if(map[by3][bx3+d]===0)hasGrass=true;
              if(map[by3][bx3+d]===6)hasOcean=true;
            }
          }
          if(hasGrass&&hasOcean){
            for(let ddx=-1;ddx<=1;ddx++)for(let ddy=0;ddy<=1;ddy++){
              if(by3+ddy<MH&&bx3+ddx>=0&&bx3+ddx<MW)map[by3+ddy][bx3+ddx]=5;
            }
            boatPlaced=true;
          }
        }
      }
    }
  }

  // Shop - find safe 3x3 grass
  let shopPlaced=false;
  for(let r=3;r<Math.max(MW,MH)&&!shopPlaced;r++){
    for(let dy5=-r;dy5<=r&&!shopPlaced;dy5++)for(let dx5=-r;dx5<=r&&!shopPlaced;dx5++){
      const sx5=Math.floor(cx)+dx5,sy5=Math.floor(cy)+dy5;
      let allGrass=true;
      for(let yy=0;yy<3;yy++)for(let xx=0;xx<3;xx++){
        const ty2=sy5+yy,tx2=sx5+xx;
        if(ty2<0||ty2>=MH||tx2<0||tx2>=MW||map[ty2][tx2]!==0)allGrass=false;
      }
      if(allGrass){
        let nearWat=false;
        for(let yy=-1;yy<4;yy++)for(let xx=-1;xx<4;xx++){
          const ty2=sy5+yy,tx2=sx5+xx;
          if(ty2>=0&&ty2<MH&&tx2>=0&&tx2<MW&&map[ty2][tx2]===1)nearWat=true;
        }
        if(!nearWat){for(let yy=0;yy<3;yy++)for(let xx=0;xx<3;xx++)map[sy5+yy][sx5+xx]=3;shopPlaced=true}
      }
    }
  }

  // Quest giver - find a grass spot away from shop
  questGiverPos={x:0,y:0};
  for(let r=5;r<Math.max(MW,MH);r++){
    let found=false;
    for(let dy=-r;dy<=r&&!found;dy++)for(let dx=-r;dx<=r&&!found;dx++){
      const qx=Math.floor(cx)+dx,qy=Math.floor(cy)+dy;
      if(qx<2||qy<2||qx>=MW-2||qy>=MH-2)continue;
      if(map[qy][qx]!==0)continue;
      // Not too close to shop (search for shop tile)
      let tooClose=false;
      for(let dy2=-3;dy2<=3;dy2++)for(let dx2=-3;dx2<=3;dx2++){
        const yy=qy+dy2,xx=qx+dx2;
        if(yy>=0&&yy<MH&&xx>=0&&xx<MW&&map[yy][xx]===3)tooClose=true;
      }
      if(!tooClose){questGiverPos={x:qx*T+T/2,y:qy*T+T/2};found=true}
    }
    if(found)break;
  }

  // Boss placement
  bossPos={x:0,y:0};
  bossActive=false;
  const isl2=ISLANDS[curIsland];
  if(isl2.isBossIsland){
    const w=WORLDS.find(ww=>ww.bossIsland===curIsland);
    if(w && !me?.bossesDefeated?.includes(w.id)){
      bossActive=true;
      for(let r=8;r<Math.max(MW,MH);r++){
        let found2=false;
        for(let dy=-r;dy<=r&&!found2;dy++)for(let dx=-r;dx<=r&&!found2;dx++){
          const bx2=Math.floor(cx)+dx,by2=Math.floor(cy)+dy;
          if(bx2<3||by2<3||bx2>=MW-3||by2>=MH-3)continue;
          if(map[by2][bx2]!==0)continue;
          const distQ=Math.sqrt(Math.pow(bx2*T-questGiverPos.x,2)+Math.pow(by2*T-questGiverPos.y,2));
          if(distQ<T*8)continue;
          let tooClose2=false;
          for(let d=-2;d<=2;d++){for(let d2=-2;d2<=2;d2++){
            const yy=by2+d,xx=bx2+d2;
            if(yy>=0&&yy<MH&&xx>=0&&xx<MW&&(map[yy][xx]===3||map[yy][xx]===1||map[yy][xx]===5))tooClose2=true;
          }}
          if(!tooClose2){bossPos={x:bx2*T+T/2,y:by2*T+T/2};found2=true}
        }
        if(found2)break;
      }
    }
  }

  // Trees
  for(let i=0;i<120;i++){
    const tx=Math.floor(srand(seed+i*7)*(MW-4))+2;
    const ty=Math.floor(srand(seed+i*13+3)*(MH-4))+2;
    if(map[ty][tx]!==0)continue;
    let ok=true;
    for(let dy6=-2;dy6<=2;dy6++)for(let dx6=-2;dx6<=2;dx6++){
      const yy=ty+dy6,xx=tx+dx6;
      if(yy>=0&&yy<MH&&xx>=0&&xx<MW&&map[yy][xx]>=3)ok=false;
    }
    if(ok)trees.push({x:tx*T+T/2,y:ty*T+T/2});
  }

  // Perf: cache dock and shop tile positions so render() doesn't scan every frame
  cachedDockTile={x:MW/2,y:MH-3};
  cachedShopTile={x:4,y:4};
  dockScan:for(let yy=0;yy<MH;yy++)for(let xx=0;xx<MW;xx++){
    if(map[yy][xx]===5){cachedDockTile={x:xx+1,y:yy+1};break dockScan}
  }
  shopScan:for(let yy=0;yy<MH;yy++)for(let xx=0;xx<MW;xx++){
    if(map[yy][xx]===3){cachedShopTile={x:xx,y:yy};break shopScan}
  }
}

function pickFish(rodLv){
  const ab=getRodAbility();
  // Junk chance - abilities can reduce it
  let junkChance=Math.max(0.05,0.18-rodLv*0.015);
  if(ab==='noJunk')junkChance*=0.5;
  if(ab==='fireBurst'||ab==='divine')junkChance=0;
  if(Math.random()<junkChance){
    const j=JUNK_ITEMS[Math.floor(Math.random()*JUNK_ITEMS.length)];
    const sz=Math.round((j.minSz+Math.random()*(j.maxSz-j.minSz))*10)/10;
    return{...j,size:sz,fight:1};
  }

  // Luck boost
  let luckMult=1;
  if(ab==='luck')luckMult=1.15;
  if(ab==='luck2')luckMult=1.3;
  if(ab==='luck3')luckMult=1.5;
  if(ab==='divine')luckMult=1.5;

  const island=ISLANDS[curIsland];
  const available=island.fish||FISH.map(f=>f.name);
  const pool=[];
  for(const f of FISH){
    if(!available.includes(f.name))continue;
    let w=RARITY_W[f.rarity];
    if(f.rarity!=='common')w*=(1+rodLv*0.2)*luckMult;
    for(let i=0;i<Math.ceil(w);i++)pool.push(f);
  }
  if(pool.length===0)for(const f of FISH){pool.push(f)} // fallback
  const f=pool[Math.floor(Math.random()*pool.length)];
  const sz=Math.round((f.minSz+Math.random()*(f.maxSz-f.minSz))*10)/10;
  return{...f,size:sz,fight:RARITY_FIGHT[f.rarity]};
}
function getRodAbility(){
  if(!me)return'none';
  const u=UPGRADES_BY_ID[me.equippedRod];
  return u?u.ability:'none';
}

function fishVal(f){
  let val=Math.round(f.val*(0.5+(f.size/f.maxSz)*0.7));
  const ab=getRodAbility();
  if(ab==='coinBoost')val=Math.round(val*1.1);
  if(ab==='coinBoost2')val=Math.round(val*1.25);
  if(ab==='coinBoost3')val=Math.round(val*1.5);
  if(ab==='zephyr')val=Math.round(val*1.5);
  if(ab==='divine')val=Math.round(val*2);
  if(ab==='legendaryX2'&&f.rarity==='legendary')val*=2;
  return val;
}

function applySave(save){
  if(save.name)me.name=save.name;
  if(save.colorIdx!=null){me.colorIdx=save.colorIdx;me.color=COLORS[save.colorIdx]}
  me.coins=save.coins||0;me.bagMax=save.bagMax||5;me.bag=save.bag||[];
  me.rodLv=save.rodLv||1;me.speedBoost=save.speedBoost||0;me.owned=save.owned||[];
  me.hasBoat=save.hasBoat||false;
  me.equippedRod=save.equippedRod||'rod_m1';
  me.ownedRods=save.ownedRods||['rod_m1'];
  // Sync rodLv from equipped rod
  const eqU=UPGRADES_BY_ID[me.equippedRod];
  if(eqU)me.rodLv=eqU.val;
  me.activeQuest=save.activeQuest||null;
  me.questProgress=save.questProgress||0;
  me.questIsland=save.questIsland!=null?save.questIsland:-1;
  me.fishIndex=save.fishIndex||{};
  // Retroactively sync any bag fish into index (for old saves)
  for(const f of me.bag){
    if(f.rarity==='junk')continue;
    if(!me.fishIndex[f.name])me.fishIndex[f.name]={count:0,biggest:0};
    if(me.fishIndex[f.name].count===0)me.fishIndex[f.name].count=1;
    if(f.size>me.fishIndex[f.name].biggest)me.fishIndex[f.name].biggest=f.size;
  }
  me.xp=save.xp||0;me.level=save.level||1;me.xpToNext=save.xpToNext||50;
  me.totalEarned=save.totalEarned||0;

// ========== HELPERS ==========
function $(id){return document.getElementById(id)}

function rand(a,b){return Math.random()*(b-a)+a}
function clamp(v,a,b){return Math.max(a,Math.min(b,v))}
function tileAt(px,py){const tx=Math.floor(px/T),ty=Math.floor(py/T);if(tx<0||ty<0||tx>=MW||ty>=MH)return-1;return map[ty][tx]}
function walkable(px,py){const t=tileAt(px,py);return t===0||t===2||t===3||t===4||t===5}
function nearWater(px,py){for(let dy=-1;dy<=1;dy++)for(let dx=-1;dx<=1;dx++)if(tileAt(px+dx*T,py+dy*T)===1)return true;return false}
function onShop(px,py){return tileAt(px,py)===3}

// ========== GAME UPDATE ==========
function update(dt){
  if(!gameStarted||!me)return;
  // Auto sailing animation on ocean map
  if(sailing){
    time+=dt;
    sailTimer+=dt;
    const tgt=ISLAND_POS[sailTargetIsland];
    const src=ISLAND_POS[sailFrom];
    const totalDist=Math.sqrt(Math.pow(tgt.x-src.x,2)+Math.pow(tgt.y-src.y,2));
    const sailSpeed=50;
    const totalTime=totalDist/sailSpeed;
    const t=Math.min(1,sailTimer/totalTime);
    // Smooth easing
    const ease=t<0.5?2*t*t:(1-Math.pow(-2*t+2,2)/2);
    sailX=src.x+(tgt.x-src.x)*ease;
    sailY=src.y+(tgt.y-src.y)*ease;
    if(t>=1){finishSailing();updateIslandName()}
    return;
  }
  time+=dt;
  const p=me;
  const spd=(60+p.speedBoost*20)*dt;

  // Boss fight update
  if(bossFight){
    const bossSpeed=30+curWorld*15;
    bossHitZone+=bossHitDir*bossSpeed*dt;
    if(bossHitZone>85){bossHitZone=85;bossHitDir=-1}
    if(bossHitZone<15){bossHitZone=15;bossHitDir=1}
    if(Math.random()<dt*2)bossHitDir*=-1;
    const swingSpeed=60+me.rodLv*10;
    bossSwingPos+=bossSwingDir*swingSpeed*dt;
    if(bossSwingPos>95){bossSwingPos=95;bossSwingDir=-1}
    if(bossSwingPos<5){bossSwingPos=5;bossSwingDir=1}
    bossAttackTimer-=dt;
    if(bossAttackTimer<=0){
      bossAttackTimer=2.5-curWorld*0.3;
      bossPlayerHP-=10+curWorld*5;
      if(bossPlayerHP<=0){
        bossFight=false;me.state='idle';
        me.toast={fish:null,msg:'BOSS WINS! Try again!',lost:true};me.toastT=3;
      }
    }
    if(jp('Space')){
      const hitW=12-curWorld*1.5;
      if(Math.abs(bossSwingPos-bossHitZone)<hitW){
        const weaponBonus=me.bossWeapons.includes('boss_w'+curWorld)?3:1;
        const dmg=(10+me.rodLv*2)*weaponBonus;
        bossHP-=dmg;
        bossDmgTimer=0.3;
        if(bossHP<=0){
          bossFight=false;bossActive=false;
          me.bossesDefeated.push(curWorld);
          const reward=5000*(curWorld+1);
          me.coins+=reward;me.totalEarned+=reward;
          me.state='idle';
          if(curWorld<4){
            me.toast={fish:null,msg:'BOSS DEFEATED! WORLD '+(curWorld+2)+' UNLOCKED! +$'+reward};me.toastT=5;
          }else{
            me.toast={fish:null,msg:'YOU BEAT THE GAME!!! +$'+reward};me.toastT=6;
          }
          saveGame();
        }
      }else{
        bossPlayerHP-=5;
        if(bossPlayerHP<=0){
          bossFight=false;me.state='idle';
          me.toast={fish:null,msg:'BOSS WINS! Try again!',lost:true};me.toastT=3;
        }
      }
    }
    bossDmgTimer-=dt;
    camX=clamp(p.x-RW/2,0,MW*T-RW);
    camY=clamp(p.y-RH/2,0,MH*T-RH);
    updateHUD();
    if(p.toastT>0){p.toastT-=dt;if(p.toastT<=0)p.toast=null}
    return;
  }

  if(p.state==='idle'){
    let dx=0,dy=0;
    if(keysDown['KeyW']||keysDown['ArrowUp']){dy=-1;p.dir='up'}
    if(keysDown['KeyS']||keysDown['ArrowDown']){dy=1;p.dir='down'}
    if(keysDown['KeyA']||keysDown['ArrowLeft']){dx=-1;p.dir='left'}
    if(keysDown['KeyD']||keysDown['ArrowRight']){dx=1;p.dir='right'}
    if(dx||dy){
      const len=Math.sqrt(dx*dx+dy*dy);
      const nx=p.x+(dx/len)*spd,ny=p.y+(dy/len)*spd;
      if(walkable(nx,p.y))p.x=nx;
      if(walkable(p.x,ny))p.y=ny;
      p.x=clamp(p.x,6,MW*T-6);p.y=clamp(p.y,6,MH*T-6);
      p.moveT+=dt;p.frame=Math.floor(p.moveT*5)%4;
    }else{p.frame=0}
    if(jp('Space')||jp('Enter')){
      // Check boss proximity first
      let startedBoss=false;
      if(bossActive && bossPos.x>0){
        const bdist=Math.sqrt(Math.pow(me.x-bossPos.x,2)+Math.pow(me.y-bossPos.y,2));
        if(bdist<T*3){
          bossFight=true;
          bossHP=100+curWorld*50;
          bossMaxHP=bossHP;
          bossPlayerHP=100;
          bossPlayerMaxHP=100;
          bossHitZone=50;
          bossSwingPos=20;
          bossSwingDir=1;
          bossHitDir=1;
          bossAttackTimer=3;
          me.state='bossfight';
          startedBoss=true;
        }
      }
      if(!startedBoss){
        if(onShop(p.x,p.y))openShop();
        else if(nearQuestGiver(p.x,p.y))openQuest();
        else if(nearWater(p.x,p.y)){p.state='casting';p.castPow=0;p.castDir=1}
      }
    }
  }
  if(p.state==='casting'){
    p.castPow+=p.castDir*130*dt;
    if(p.castPow>=100){p.castPow=100;p.castDir=-1}
    if(p.castPow<=0){p.castPow=0;p.castDir=1}
    if(jp('Space')||jp('Enter')){
      const pow=p.castPow/100;
      const dirs={down:[0,1],up:[0,-1],left:[-1,0],right:[1,0]};
      const d=dirs[p.dir];
      let bxx=p.x+d[0]*(20+pow*80),byy=p.y+d[1]*(20+pow*80);
      if(tileAt(bxx,byy)!==1){for(let r=1;r<8;r++)for(let a=0;a<12;a++){
        const ang=a*Math.PI/6,tx=p.x+Math.cos(ang)*r*T,ty=p.y+Math.sin(ang)*r*T;
        if(tileAt(tx,ty)===1){bxx=tx;byy=ty;r=99;break}
      }}
      const ab2=p===me?getRodAbility():'none';
      let wait=rand(1.5,4.5);
      if(ab2==='quickBite')wait*=0.5;
      p.bobX=bxx;p.bobY=byy;p.state='waiting';p.waitT=wait;
    }
  }
  if(p.state==='waiting'){p.waitT-=dt;if(p.waitT<=0){
    p.state='bite';
    const ab3=p===me?getRodAbility():'none';
    let bt=2;
    if(ab3==='longBite')bt=3;
    if(ab3==='longBite2')bt=5;
    p.biteT=bt;
  }}
  if(p.state==='bite'){
    p.biteT-=dt;
    if(jp('Space')||jp('Enter')){
      p.curFish=pickFish(p.rodLv);
      p.reelProg=0;
      p.state='reeling';
      // Fisch-style minigame state
      p.barPos=50; // player indicator 0-100
      p.barVel=0;
      p.fishPos=50; // fish target 0-100
      p.fishVel=0;
      p.fishBehavior=0; // timer for next fish movement
    }
    if(p.biteT<=0)p.state='idle';
  }
  if(p.state==='reeling'){
    const f=p.curFish;if(!f){p.state='idle'}else{
      // Player bar - speed scales with rod power
      const ab=getRodAbility();
      const holding=keysDown['Space']||keysDown['Enter'];
      let rodSpeed=80+p.rodLv*40;
      if(ab==='superFast')rodSpeed*=1.8;
      const accel=holding?rodSpeed*2:-rodSpeed*1.6;
      p.barVel+=accel*dt;
      p.barVel*=0.88;
      p.barVel=clamp(p.barVel,-rodSpeed,rodSpeed);
      p.barPos+=p.barVel*dt;
      // Bounce off walls
      if(p.barPos<5){p.barPos=5;p.barVel=Math.abs(p.barVel)*0.3}
      if(p.barPos>95){p.barPos=95;p.barVel=-Math.abs(p.barVel)*0.3}

      // Fish AI - moves around randomly based on fight stat
      const slowMult=(ab==='slowFish')?0.5:1;
      p.fishBehavior-=dt;
      if(p.fishBehavior<=0){
        p.fishVel=(Math.random()-0.5)*f.fight*60*slowMult;
        p.fishBehavior=rand(0.3,1.2)/Math.max(1,f.fight*0.5);
      }
      p.fishPos+=p.fishVel*dt;
      if(p.fishPos<10){p.fishPos=10;p.fishVel=Math.abs(p.fishVel)}
      if(p.fishPos>90){p.fishPos=90;p.fishVel=-Math.abs(p.fishVel)}

      // Bar width based on rod power (wider = easier)
      let barW=4+p.rodLv*1.2;
      if(ab==='wideCursor')barW*=1.6;
      // Reel speed with abilities
      let reelSpd=35+p.rodLv*7;
      if(ab==='fastReel')reelSpd*=1.4;
      if(ab==='fireBurst')reelSpd*=1.3;
      // Check overlap
      const overlap=Math.abs(p.barPos-p.fishPos)<barW;
      if(overlap){
        p.reelProg+=reelSpd*dt;
      }else{
        let drainMult=1;
        if(ab==='unbreakable')drainMult=0.2; // 80% less drain
        p.reelProg-=(f.fight*8)*dt*drainMult;
      }
      p.reelProg=clamp(p.reelProg,-5,100);
      if(p.reelProg>=100){
        if(p.bag.length<p.bagMax){p.bag.push(f);p.toast={fish:f,msg:'CAUGHT!'};p.toastT=2.5;p.holdFish=f;p.holdTimer=9999;
          // Double catch ability + XP gain
          if(p===me){
            const ab4=ab;
            if((ab4==='doubleCatch'&&Math.random()<0.15)&&p.bag.length<p.bagMax){
              const bonus={...f};p.bag.push(bonus);
              p.toast={fish:f,msg:'DOUBLE CATCH!'};p.toastT=2.8;
            }
          }
          let xpGain={junk:1,common:5,uncommon:10,rare:20,epic:40,legendary:80,boss:200}[f.rarity]||5;
          if(p===me){
            if(ab==='xpBoost')xpGain=Math.round(xpGain*1.25);
            if(ab==='xpBoost2')xpGain*=2;
            if(ab==='zephyr')xpGain=Math.round(xpGain*1.5);
          }
          p.xp+=xpGain;
          while(p.xp>=p.xpToNext){p.xp-=p.xpToNext;p.level++;p.xpToNext=Math.floor(50+p.level*20)}
          // Quest progress
          if(p===me&&me.activeQuest){
            const q=me.activeQuest;
            if(q.type==='catch_name'&&f.name===q.fish)me.questProgress++;
            else if(q.type==='catch_count'&&f.rarity!=='junk')me.questProgress++;
            else if(q.type==='catch_size'&&f.name===q.fish&&f.size>=q.size)me.questProgress=1;
          }
          // Fish index tracking
          if(p===me&&f.rarity!=='junk'){
            if(!me.fishIndex[f.name])me.fishIndex[f.name]={count:0,biggest:0};
            me.fishIndex[f.name].count++;
            if(f.size>me.fishIndex[f.name].biggest)me.fishIndex[f.name].biggest=f.size;
          }
        }
        else{p.toast={fish:f,msg:'BAG FULL!',full:true};p.toastT=2.5}
        p.state='idle';p.curFish=null;
      }
      if(p.reelProg<-4){p.toast={fish:f,msg:'ESCAPED!',lost:true};p.toastT=1.5;p.state='idle';p.curFish=null}
    }
  }
  if(p.toastT>0){p.toastT-=dt;if(p.toastT<=0)p.toast=null}
  if(p.holdTimer>0){p.holdTimer-=dt;if(p.holdTimer<=0)p.holdFish=null}


  camX=clamp(p.x-RW/2,0,MW*T-RW);
  camY=clamp(p.y-RH/2,0,MH*T-RH);

  updateHUD();
  updateBP();
  updateLB();
  updateQuestTracker();
}

function updateHUD(){
  $('h-coins').textContent=me.coins;
  $('h-bag').textContent=me.bag.length;
  $('h-bmax').textContent=me.bagMax;
  $('h-level').textContent=me.level;
  $('h-xp').textContent=me.xp;
  $('h-xpmax').textContent=me.xpToNext;
  let st='';
  if(me.state==='casting')st='Release SPACE to cast!';
  else if(me.state==='waiting'&&me.waitT>0)st='Waiting for a bite...';
  else if(me.state==='bite')st='!! BITE !! Press SPACE!';
  else if(me.state==='reeling')st='Hold SPACE to reel in!';
  else if(onShop(me.x,me.y))st='Press SPACE for Shop';
  else if(nearQuestGiver(me.x,me.y))st='Press SPACE to talk';
  else if(nearWater(me.x,me.y))st='Press SPACE to cast';
  else st='Walk to water to fish | Visit shop or quest giver';
  if(bossActive && bossPos.x>0 && me.state==='idle'){
    const bdist=Math.sqrt(Math.pow(me.x-bossPos.x,2)+Math.pow(me.y-bossPos.y,2));
    if(bdist<T*3)st='Press SPACE to fight the BOSS!';
  }
  if(bossFight)st='BOSS FIGHT! Press SPACE to attack!';
  $('h-status').textContent=st;
}

function renderIndexTab(el){

  let html=`<h4 style="color:#5be0f5">Fish Index (${caught}/${total})</h4>`;
  const rarityOrder=['common','uncommon','rare','epic','legendary','boss'];
  for(const rar of rarityOrder){
    const rarFish=allFish.filter(f=>f.rarity===rar);
    if(rarFish.length===0)continue;
    html+=`<div style="color:${RARITY_COL[rar]};font-size:11px;text-transform:uppercase;margin:6px 0 3px;font-weight:700">${rar}</div>`;

      const data=me.fishIndex[f.name];
      if(data){
        html+=`<div class="bp-item">

            <div class="bp-item-icon" style="background:${RARITY_COL[f.rarity]}">&#9641;</div>
            <div>
              <div class="bp-item-name" style="color:${RARITY_COL[f.rarity]}">${f.name}</div>
              <div class="bp-item-detail">x${data.count} | Best: ${data.biggest}cm</div>
            </div>
          </div>

        html+=`<div class="bp-item" style="opacity:0.4">

            <div class="bp-item-icon" style="background:#1a1a2e">?</div>
            <div>

              <div class="bp-item-detail">Not caught</div>
            </div>
          </div>

}

window.sellFish=function(i){const f=me.bag[i];if(!f||f.fav)return;if(me.holdFish&&me.holdFish.name===f.name&&me.holdFish.size===f.size){me.holdFish=null;me.holdTimer=0}const v=fishVal(f);me.coins+=v;me.totalEarned=(me.totalEarned||0)+v;trackEarn(v);me.bag.splice(i,1);updateBP();if($('shop-modal').style.display==='flex')openShop();saveGame()};
window.sellAll=function(){const kept=[];for(const f of me.bag){if(f.fav){kept.push(f);continue}if(me.holdFish&&me.holdFish.name===f.name&&me.holdFish.size===f.size){me.holdFish=null;me.holdTimer=0}const v=fishVal(f);me.coins+=v;me.totalEarned=(me.totalEarned||0)+v;trackEarn(v)}me.bag=kept;updateBP();if($('shop-modal').style.display==='flex')openShop();saveGame()};

// ========== SHOP ==========
function openShop(){
  $('shop-modal').style.display='flex';
  // Filter: show universal items (island=-1) and items for this island
  const available=UPGRADES.filter(u=>{
    if(u.type==='boss_weapon')return u.island===curIsland;
    return u.island===-1||u.island===curIsland;
  });
  const items=available.map(u=>{
    const isRod=u.type==='rod';
    const isBossWeapon=u.type==='boss_weapon';
    const owned=isRod?me.ownedRods.includes(u.id):isBossWeapon?me.bossWeapons.includes(u.id):me.owned.includes(u.id);
    const equipped=isRod&&me.equippedRod===u.id;
    const can=me.coins>=u.price&&!owned;
    const tag=u.island>=0&&!isBossWeapon?` <span style="color:#5be0f5;font-size:9px">[${ISLANDS[u.island].name}]</span>`:'';
    const bossTag=isBossWeapon?' <span style="color:#ff4444;font-size:9px">[BOSS WEAPON]</span>':'';
    let btn='';
    if(isRod){
      if(equipped)btn='<span class="shop-owned">EQUIPPED</span>';
      else if(owned)btn=`<button class="shop-buy" onclick="equipRod('${u.id}')">EQUIP</button>`;
      else btn=`<button class="shop-buy" ${!can?'disabled':''} onclick="buyUp('${u.id}')">BUY</button>`;
    }else if(isBossWeapon){
      btn=owned?'<span class="shop-owned">OWNED</span>':`<button class="shop-buy" ${!can?'disabled':''} onclick="buyBossWeapon('${u.id}')" style="background:#ff4444;border-color:#aa2222">BUY</button>`;
    }else{
      btn=owned?'<span class="shop-owned">OWNED</span>':`<button class="shop-buy" ${!can?'disabled':''} onclick="buyUp('${u.id}')">BUY</button>`;
    }
    return`<div class="shop-item"${isBossWeapon?' style="border-color:#ff4444"':''}><div><h4>${u.name}${tag}${bossTag}</h4><p>${u.desc} - $${u.price}</p></div>${btn}</div>`;
  }).join('');
  $('shop-content').innerHTML=`<h2>${ISLANDS[curIsland].name} SHOP</h2><div class="shop-coins-d">Coins: $${me.coins}</div>${items}<button class="shop-close" onclick="closeShop()">CLOSE</button>`;
}

window.buyBossWeapon=function(uid){
  const u=UPGRADES_BY_ID[uid];
  if(!u||me.coins<u.price)return;
  if(me.bossWeapons.includes(uid))return;
  me.coins-=u.price;
  me.bossWeapons.push(uid);
  saveGame();
  openShop();
};
window.buyUp=function(uid){
  const u=UPGRADES_BY_ID[uid];
  if(!u||me.coins<u.price)return;
  if(u.type==='rod'){
    if(me.ownedRods.includes(uid))return;
    me.coins-=u.price;me.ownedRods.push(uid);
    me.equippedRod=uid;me.rodLv=u.val;
  }else{
    if(me.owned.includes(uid))return;
    me.coins-=u.price;me.owned.push(uid);
    if(u.type==='bag')me.bagMax=u.val;
    if(u.type==='speed')me.speedBoost=u.val;
    if(u.type==='boat')me.hasBoat=true;
  }
  saveGame();
  openShop();
};

window.equipRod=function(uid){
  const u=UPGRADES_BY_ID[uid];
  if(!u||!me.ownedRods.includes(uid))return;
  me.equippedRod=uid;me.rodLv=u.val;
  saveGame();
  if(bpOpen)renderBpTab();
};
window.closeShop=function(){$('shop-modal').style.display='none'};

// ========== QUESTS ==========
function nearQuestGiver(px,py){
  const dx=px-questGiverPos.x,dy=py-questGiverPos.y;
  return Math.sqrt(dx*dx+dy*dy)<24;
}

function questDesc(q){
  if(q.type==='catch_name')return`Catch ${q.count} ${q.fish}${q.count>1?'s':''}`;
  if(q.type==='catch_count')return`Catch any ${q.count} fish`;
  if(q.type==='catch_size')return`Catch a ${q.fish} at least ${q.size}cm long`;
  if(q.type==='earn_coins')return`Earn $${q.amount} from selling fish`;
  return'???';
}

function questComplete(q,progress){
  if(q.type==='catch_size')return progress>=1;
  if(q.type==='earn_coins')return progress>=q.amount;
  return progress>=q.count;
}

function questProgressText(q,progress){
  if(q.type==='catch_size')return progress>=1?'Done!':'0/1';
  if(q.type==='earn_coins')return`$${progress}/$${q.amount}`;
  return`${progress}/${q.count}`;
}

function openQuest(){
  const modal=$('quest-modal');
  modal.style.display='flex';
  const giverName=QUEST_NAMES[curIsland];
  let html=`<h2>Quest Board</h2><div class="giver-name">- ${giverName} -</div>`;

  // If has active quest
  if(me.activeQuest&&me.questIsland===curIsland){
    const q=me.activeQuest;
    const done=questComplete(q,me.questProgress);
    html+=`<div class="quest-desc"><b style="color:#5be0f5">${q.title}</b><br>${questDesc(q)}</div>`;
    html+=`<div class="quest-progress">${questProgressText(q,me.questProgress)}</div>`;
    html+=`<div class="quest-reward">Reward: $${q.reward} + ${q.xp} XP</div>`;
    html+='<div class="quest-btn-row">';
    if(done){
      html+='<button class="quest-btn quest-turn-in" onclick="turnInQuest()">TURN IN</button>';
    }else{
      html+='<button class="quest-btn quest-close-btn" onclick="abandonQuest()">ABANDON</button>';
    }
    html+='<button class="quest-btn quest-close-btn" onclick="closeQuest()">CLOSE</button>';
    html+='</div>';
  }else if(me.activeQuest){
    html+=`<div class="quest-desc">You already have a quest from <b>${QUEST_NAMES[me.questIsland]}</b>. Finish or abandon it first!</div>`;
    html+='<div class="quest-btn-row"><button class="quest-btn quest-close-btn" onclick="closeQuest()">CLOSE</button></div>';
  }else{
    // Offer a random new quest
    const pool=QUEST_TEMPLATES[curIsland];
    if(!pool||pool.length===0){
      html+='<div class="quest-desc">No quests here right now.</div>';
      html+='<div class="quest-btn-row"><button class="quest-btn quest-close-btn" onclick="closeQuest()">CLOSE</button></div>';
    }else{
      const q=pool[Math.floor(Math.random()*pool.length)];
      html+=`<div class="quest-desc">"Ahoy! I need help with this..."<br><br><b style="color:#5be0f5">${q.title}</b><br>${questDesc(q)}</div>`;
      html+=`<div class="quest-reward">Reward: $${q.reward} + ${q.xp} XP</div>`;
      html+='<div class="quest-btn-row">';
      html+=`<button class="quest-btn quest-accept" onclick='acceptQuest(${JSON.stringify(q).replace(/'/g,"&#39;")})'>ACCEPT</button>`;
      html+='<button class="quest-btn quest-close-btn" onclick="closeQuest()">DECLINE</button>';
      html+='</div>';
    }
  }
  $('quest-content').innerHTML=html;
}

window.acceptQuest=function(q){
  me.activeQuest=q;
  me.questProgress=0;
  me.questIsland=curIsland;
  saveGame();
  closeQuest();
};

window.abandonQuest=function(){
  me.activeQuest=null;me.questProgress=0;me.questIsland=-1;
  saveGame();
  openQuest();
};

window.turnInQuest=function(){
  const q=me.activeQuest;
  me.coins+=q.reward;
  me.totalEarned=(me.totalEarned||0)+q.reward;
  me.xp+=q.xp;
  while(me.xp>=me.xpToNext){me.xp-=me.xpToNext;me.level++;me.xpToNext=Math.floor(50+me.level*20)}
  me.activeQuest=null;me.questProgress=0;me.questIsland=-1;
  saveGame();
  closeQuest();
};

window.closeQuest=function(){$('quest-modal').style.display='none'};

function updateQuestTracker(){
  const el=$('quest-tracker');
  if(!me.activeQuest){el.style.display='none';return}
  const q=me.activeQuest;
  const done=questComplete(q,me.questProgress);
  let pct=0;
  if(q.type==='earn_coins')pct=Math.min(100,(me.questProgress/q.amount)*100);
  else if(q.type==='catch_size')pct=done?100:0;
  else pct=Math.min(100,(me.questProgress/q.count)*100);

  el.style.display='block';
  el.className=done?'complete':'';
  el.innerHTML=`
    <div class="qt-label">${done?'✓ COMPLETE':'Active Quest'}</div>
    <div class="qt-title">${q.title}</div>
    <div class="qt-desc">${questDesc(q)}</div>
    <div class="qt-progress-bar"><div class="qt-progress-fill" style="width:${pct}%"></div></div>
    <div class="qt-progress-text">${questProgressText(q,me.questProgress)}</div>
    <div class="qt-reward">$${q.reward} + ${q.xp} XP${done?' - Return to giver!':''}</div>
  `;
}

window.changeName=function(){
  const newName=prompt('Enter new name:',me.name);
  if(newName&&newName.trim()){
    me.name=newName.trim().slice(0,14);
    saveGame();
  }
};

// ========== BOAT / TRAVEL ==========
function onBoatDock(px2,py2){return tileAt(px2,py2)===5}

function findSafeSpawn(){
  // Search outward from center for a grass tile
  const cx2=Math.floor(MW/2),cy2=Math.floor(MH/2);
  for(let r=0;r<Math.max(MW,MH);r++){
    for(let dy=-r;dy<=r;dy++)for(let dx=-r;dx<=r;dx++){
      const tx=cx2+dx,ty=cy2+dy;
      if(tx>=0&&ty>=0&&tx<MW&&ty<MH&&map[ty][tx]===0){
        return{x:tx*T+T/2,y:ty*T+T/2};
      }
    }
  }
  return{x:cx2*T,y:cy2*T};
}

function updateIslandName(){
  const w=WORLDS[ISLANDS[curIsland].world||0];
  $('island-name').textContent=w.name+' - '+ISLANDS[curIsland].name;
  $('island-name').style.display='block';
}

function islandUnlocked(isl){
  if(isl.id===0)return true;
  if(!me)return false;
  const world=isl.world||0;
  if(world>0 && !me.bossesDefeated.includes(world-1))return false;
  // First island of each world is free if world is unlocked
  const worldIslands=ISLANDS.filter(i=>i.world===world);
  if(isl.id===worldIslands[0].id)return true;
  // Other islands need boat and level
  if(!me.hasBoat)return false;
  if(me.level<isl.level)return false;
  return true;
}

  $('travel-modal').style.display='flex';
  travelWorldTab=ISLANDS[curIsland].world||0;

function renderTravelModal(){
  let html='<h2>SET SAIL</h2>';
  // World tabs
  html+='<div style="display:flex;gap:4px;margin-bottom:10px;flex-wrap:wrap;justify-content:center">';
  for(const w of WORLDS){
    const unlocked=w.id===0 || me.bossesDefeated.includes(w.id-1);
    const active=w.id===travelWorldTab;
    html+=`<button onclick="switchWorldTab(${w.id})" style="padding:4px 10px;font-family:monospace;font-size:11px;border:1px solid ${active?w.color:'#2a3a5a'};background:${active?w.color+'33':'#0a0a2e'};color:${unlocked?'#fff':'#3a3a5a'};cursor:${unlocked?'pointer':'default'};border-radius:4px;${!unlocked?'opacity:0.4':''}">${unlocked?w.name:'???'}</button>`;
  }
  html+='</div>';
  // Current world info
  const cw=WORLDS[travelWorldTab];
  const cwUnlocked=cw.id===0||me.bossesDefeated.includes(cw.id-1);
  if(cwUnlocked){
    html+=`<div style="text-align:center;color:${cw.color};font-size:13px;margin-bottom:8px">${cw.name} - ${cw.desc}</div>`;
    const bossDefeated=me.bossesDefeated.includes(cw.id);
    html+=`<div style="text-align:center;font-size:11px;color:${bossDefeated?'#4ade80':'#ff4444'};margin-bottom:8px">Boss: ${cw.bossName} ${bossDefeated?'DEFEATED':'UNDEFEATED'}</div>`;
  }
  // Islands for this world tab
  const worldIslands=ISLANDS.filter(i=>i.world===travelWorldTab);
  for(const isl of worldIslands){
    const isCurrent=isl.id===curIsland;
    const unlocked=islandUnlocked(isl);
    const bossDefeated=isl.isBossIsland && me.bossesDefeated.includes(travelWorldTab);
    const isBoss=isl.isBossIsland;
    const bossStyle=isBoss?'border-color:'+(bossDefeated?'#4ade80':'#ff3030'):'';
    if(isCurrent){
      html+=`<div class="island-card current" style="${bossStyle}">
        <div><h4>${isBoss?'&#128081; ':''}${isl.name}</h4><p>${isl.desc}</p>${isBoss?'<span style="color:'+(bossDefeated?'#4ade80':'#ff4444')+';font-size:10px">BOSS'+(bossDefeated?' DEFEATED':'')+'</span>':''}</div>
        <span class="island-current">YOU ARE HERE</span></div>`;
    }else if(unlocked){
      html+=`<div class="island-card" style="${bossStyle}" onclick="travelTo(${isl.id})">
        <div><h4>${isBoss?'&#128081; ':''}${isl.name}</h4><p>${isl.desc}</p>${isBoss?'<span style="color:'+(bossDefeated?'#4ade80':'#ff4444')+';font-size:10px">BOSS'+(bossDefeated?' DEFEATED':'')+'</span>':''}</div>
        <span class="island-unlocked">SAIL HERE</span></div>`;
    }else{
      let lockReason='';
      if(!me.hasBoat)lockReason='Need Boat';
      else if(me.level<isl.level)lockReason=`Lv.${isl.level} needed`;
      else lockReason='Locked';
      html+=`<div class="island-card locked" style="${bossStyle}">
        <div><h4>${isBoss?'&#128081; ':''}${isl.name}</h4><p>${isl.desc}</p></div>
        <span class="island-price">${lockReason}</span></div>`;
    }
  }
  html+=`<p style="text-align:center;color:#5a7a9a;font-size:11px;margin-top:8px">Your Level: ${me.level}</p>`;
  html+='<button class="travel-close" onclick="closeTravel()">CLOSE</button>';
  $('travel-content').innerHTML=html;
}

window.switchWorldTab=function(wid){
  const unlocked=wid===0 || me.bossesDefeated.includes(wid-1);
  if(!unlocked)return;
  travelWorldTab=wid;
  renderTravelModal();
};

window.travelTo=function(i){
  const isl=ISLANDS[i];
  if(!islandUnlocked(isl)||i===curIsland)return;
  closeTravel();
  sailing=true;
  sailTimer=0;
  sailFrom=curIsland;
  sailTargetIsland=i;
  sailX=ISLAND_POS[curIsland].x;
  sailY=ISLAND_POS[curIsland].y;
  curWorld=isl.world||0;
};

function finishSailing(){
  sailing=false;
  curIsland=sailTargetIsland;
  curWorld=ISLANDS[curIsland].world||0;
  genIslandMap(ISLANDS[sailTargetIsland]);
  const sp2=findSafeSpawn();me.x=sp2.x;me.y=sp2.y;
  me.state='idle';
  closeTravel();
  updateIslandName();
  saveGame();
};

function drawPlayerSprite(cx,p,px,py,isMe){
  const col=p.color||COLORS[p.colorIdx||0];
  // Shadow (oval)
  cx.fillStyle='rgba(0,0,0,0.2)';
  cx.beginPath();cx.ellipse(px,py+6,5,2.5,0,0,Math.PI*2);cx.fill();
  // Feet/shoes
  cx.fillStyle='#4a3020';
  const walk=(p.frame||0)%4;
  if(walk===0||walk===2){cx.fillRect(px-2,py+4,2,3);cx.fillRect(px+1,py+4,2,3)}
  else if(walk===1){cx.fillRect(px-3,py+3,2,3);cx.fillRect(px+2,py+5,2,3)}
  else{cx.fillRect(px-2,py+5,2,3);cx.fillRect(px+1,py+3,2,3)}
  // Legs
  cx.fillStyle=col.dark;
  if(walk===0||walk===2){cx.fillRect(px-2,py+2,2,3);cx.fillRect(px+1,py+2,2,3)}
  else if(walk===1){cx.fillRect(px-3,py+1,2,3);cx.fillRect(px+2,py+3,2,3)}
  else{cx.fillRect(px-2,py+3,2,3);cx.fillRect(px+1,py+1,2,3)}
  // Body/shirt
  cx.fillStyle=col.body;cx.fillRect(px-3,py-3,7,6);
  // Shirt detail
  cx.fillStyle=col.light;cx.fillRect(px-1,py-2,3,1);
  // Rod colors by type (uses module-level _ROD_COLORS)
  const eqRod=p.equippedRod||'rod_m1';
  const rc=_ROD_COLORS[eqRod]||_ROD_COLORS_DEFAULT;

  // ---- ROD + ARMS (clean pixel art, always visible) ----
  const rodUpgrade=UPGRADES_BY_ID[eqRod];
  const rodPower=rodUpgrade?rodUpgrade.val:1;
  const rodLen=10+rodPower; // longer = better rod

  // Draw rod as pixel line in a direction (no rotation - clean pixels)
  function drawRodPixel(cx2,bx2,by2,ex2,ey2){
    const dx2=ex2-bx2,dy2=ey2-by2;
    const rodLen=Math.sqrt(dx2*dx2+dy2*dy2);
    // Perpendicular unit vector (for rod width)
    const nx=-dy2/rodLen,ny=dx2/rodLen;
    // Direction unit
    const ux=dx2/rodLen,uy=dy2/rodLen;

    // ---- HANDLE (cork/leather grip at base) ----
    // Goes from bx,by backwards (opposite direction from rod)
    const handleLen=4;
    const hx=bx2-ux*handleLen,hy=by2-uy*handleLen;
    // Handle cork (light brown base)
    cx2.fillStyle='#b8825a';
    for(let s=0;s<=handleLen;s++){
      const t=s/handleLen;
      const sx=Math.round(bx2-ux*s),sy=Math.round(by2-uy*s);
      cx2.fillRect(sx-1,sy-1,2,2);
    }
    // Handle grip wraps (dark bands)
    cx2.fillStyle='#3a2010';
    for(let s=1;s<=handleLen;s+=2){
      const sx=Math.round(bx2-ux*s),sy=Math.round(by2-uy*s);
      cx2.fillRect(sx-1,sy,2,1);
    }
    // Handle end cap
    cx2.fillStyle='#2a1a0a';
    cx2.fillRect(Math.round(hx)-1,Math.round(hy)-1,2,2);

    // ---- REEL (perpendicular to rod, at base) ----
    const reelX=Math.round(bx2+nx*2);
    const reelY=Math.round(by2+ny*2);
    // Reel seat (silver mount)
    cx2.fillStyle='#5a5a6a';
    cx2.fillRect(Math.round(bx2+nx*1)-1,Math.round(by2+ny*1)-1,2,2);
    // Reel body (side profile)
    cx2.fillStyle='#2a2a3a';
    cx2.fillRect(reelX-1,reelY-2,3,3);
    cx2.fillStyle='#4a4a5a';
    cx2.fillRect(reelX,reelY-2,2,2);
    // Reel spool shine
    cx2.fillStyle='#7a7a8a';
    cx2.fillRect(reelX,reelY-1,1,1);
    // Reel handle/crank
    cx2.fillStyle='#3a3a4a';
    cx2.fillRect(reelX+2,reelY-1,1,1);
    cx2.fillStyle='#8a8a9a';
    cx2.fillRect(reelX+3,reelY-1,1,1);

    // ---- SHAFT (tapered with realistic colors) ----
    const steps=Math.ceil(rodLen);
    for(let s=0;s<=steps;s++){
      const t=s/Math.max(1,steps);
      const lx2=Math.round(bx2+dx2*t);
      const ly2=Math.round(by2+dy2*t);

      // Tapered width - thick at base, thin at tip
      if(t<0.15){
        // Base section - thickest with reel seat
        cx2.fillStyle=rc[0];
        cx2.fillRect(lx2,ly2,2,1);
        cx2.fillRect(lx2-1,ly2,1,1);
        // Highlight
        cx2.fillStyle=rc[1];
        cx2.fillRect(lx2,ly2,1,1);
      }else if(t<0.4){
        // Lower shaft - thick
        cx2.fillStyle=rc[0];
        cx2.fillRect(lx2,ly2,2,1);
        // Shine line
        if(s%2===0){cx2.fillStyle=rc[1];cx2.fillRect(lx2,ly2,1,1)}
      }else if(t<0.7){
        // Mid shaft - medium
        cx2.fillStyle=rc[0];
        cx2.fillRect(lx2,ly2,2,1);
      }else if(t<0.9){
        // Upper shaft - thinner
        cx2.fillStyle=rc[1];
        cx2.fillRect(lx2,ly2,1,1);
      }else{
        // Tip - thinnest
        cx2.fillStyle=rc[1];
        cx2.fillRect(lx2,ly2,1,1);
      }
    }

    // ---- LINE GUIDES (metal rings along rod) ----
    const guideCount=4;
    for(let g=1;g<=guideCount;g++){
      const t=0.2+g*0.18;
      const gx=Math.round(bx2+dx2*t);
      const gy=Math.round(by2+dy2*t);
      // Guide ring (silver)
      cx2.fillStyle='#b0b0c0';
      cx2.fillRect(gx+Math.round(nx),gy+Math.round(ny),1,1);
      cx2.fillRect(gx-Math.round(nx),gy-Math.round(ny),1,1);
      // Outer ring
      cx2.fillStyle='#7a7a8a';
      cx2.fillRect(gx+Math.round(nx*2),gy+Math.round(ny*2),1,1);
    }

    // ---- TIP (very light) ----
    cx2.fillStyle='#e0e0f0';
    cx2.fillRect(ex2,ey2,1,1);
    cx2.fillStyle='#b0b0c0';
    cx2.fillRect(ex2-Math.round(ux),ey2-Math.round(uy),1,1);
  }

  cx.fillStyle=col.body;
  const isFishing=p.state==='waiting'||p.state==='bite'||p.state==='reeling';
  const isCasting=p.state==='casting';

  if(isCasting){
    // Arms raised
    cx.fillRect(px-4,py-4,2,3);
    cx.fillRect(px+3,py-5,2,3);
    // Casting animation - rod swings up based on power
    const cpow=(p.castPow||0)/100;
    const swing=Math.floor(cpow*rodLen);
    // Rod goes from pointing right to pointing up
    if(p.dir==='down'){
      drawRodPixel(cx, px+4,py-4, px+4+rodLen-swing,py-4-swing);
    }else if(p.dir==='up'){
      drawRodPixel(cx, px+4,py-4, px+4+rodLen-swing,py-4-swing);
    }else if(p.dir==='left'){
      drawRodPixel(cx, px-3,py-4, px-3-rodLen+swing,py-4-swing);
    }else{
      drawRodPixel(cx, px+4,py-4, px+4+rodLen-swing,py-4-swing);
    }
    // Power glow at tip
    if(cpow>0.6){
      const tipX=p.dir==='left'?px-3-rodLen+swing:px+4+rodLen-swing;
      cx.fillStyle=`rgba(255,220,80,${cpow*0.5})`;
      cx.fillRect(tipX-1,py-4-swing-1,3,3);
    }
  }else if(isFishing){
    // Arms holding rod out
    cx.fillRect(px-4,py-3,2,3);
    cx.fillRect(px+3,py-4,2,3);
    // Rod points toward bobber direction
    const wobble=p.state==='reeling'?Math.floor(Math.sin(time*8)*2):
                 p.state==='bite'?Math.floor(Math.sin(time*12)*2):0;
    const tipBob=p.state==='reeling'?Math.floor(Math.sin(time*10)*3):0;
    if(p.dir==='down'){
      drawRodPixel(cx, px+4,py-3, px+4,py-3+rodLen+tipBob);
    }else if(p.dir==='up'){
      drawRodPixel(cx, px+4,py-3, px+4+wobble,py-3-rodLen+tipBob);
    }else if(p.dir==='left'){
      drawRodPixel(cx, px-3,py-3, px-3-rodLen,py-3+wobble+tipBob);
    }else{
      drawRodPixel(cx, px+4,py-3, px+4+rodLen,py-3+wobble+tipBob);
    }
  }else{
    // Idle/walking - rod on shoulder (diagonal up-right)
    const walkBob=p.frame%2===1?1:0;
    cx.fillRect(px-4,py-2+walkBob,2,4); // left arm swings
    cx.fillRect(px+3,py-3,2,4); // right arm holds rod
    // Rod rests diagonally upward
    drawRodPixel(cx, px+4,py-3, px+4+Math.floor(rodLen*0.6),py-3-Math.floor(rodLen*0.8));
  }
  // Skin (hands)
  cx.fillStyle='#f5c06a';cx.fillRect(px-4,py+1,1,1);cx.fillRect(px+4,py+1,1,1);
  // Head
  cx.fillStyle='#f5c06a';cx.fillRect(px-2,py-7,5,5);
  // Hair/hat
  cx.fillStyle=col.dark;cx.fillRect(px-3,py-8,7,2);cx.fillRect(px-2,py-9,5,2);
  // Brim
  cx.fillStyle=col.dark;
  if(p.dir==='down')cx.fillRect(px-3,py-7,7,1);
  else if(p.dir==='left')cx.fillRect(px-4,py-7,5,1);
  else if(p.dir==='right')cx.fillRect(px,py-7,5,1);
  // Eyes
  if(p.dir==='down'){cx.fillStyle='#222';cx.fillRect(px-1,py-5,1,1);cx.fillRect(px+1,py-5,1,1);
    cx.fillStyle='#fff';cx.fillRect(px-1,py-6,1,1);cx.fillRect(px+1,py-6,1,1)}
  else if(p.dir==='left'){cx.fillStyle='#222';cx.fillRect(px-2,py-5,1,1);cx.fillStyle='#fff';cx.fillRect(px-2,py-6,1,1)}
  else if(p.dir==='right'){cx.fillStyle='#222';cx.fillRect(px+2,py-5,1,1);cx.fillStyle='#fff';cx.fillRect(px+2,py-6,1,1)}
  // Name + Chat drawn later on full-res canvas (see textOverlays)
  if(typeof textOverlays!=='undefined'){
    textOverlays.push({type:'name',text:p.name||'???',x:px,y:py-12,isMe});
    if(p.chatT>0&&p.chatMsg){
      textOverlays.push({type:'chat',text:p.chatMsg,x:px,y:py-20});
    }
  }
  // Cast bar
  if(p.state==='casting'){
    cx.fillStyle='#111';cx.fillRect(px-12,py-24,24,3);
    const pct=(p.castPow||0)/100;
    cx.fillStyle=pct>0.7?'#e03030':pct>0.4?'#f5a623':'#22c55e';
    cx.fillRect(px-12,py-24,Math.floor(24*pct),3);
  }
  // Line+bobber
  if(p.state==='waiting'||p.state==='bite'||p.state==='reeling'){
    const bpx=Math.floor((p.bobX||0)-camX),bpy=Math.floor((p.bobY||0)-camY);
    cx.strokeStyle='rgba(200,200,200,0.5)';cx.lineWidth=0.5;
    cx.beginPath();cx.moveTo(px,py);cx.lineTo(bpx,bpy);cx.stroke();cx.lineWidth=1;
    // Bobber shadow on water
    cx.fillStyle='rgba(0,0,0,0.15)';
    cx.beginPath();cx.ellipse(bpx,bpy+3,3,1.5,0,0,Math.PI*2);cx.fill();
    // Water ripples (continuous)
    for(let ri=0;ri<2;ri++){
      const rr=((time*0.8+ri*0.4)%1)*10;
      cx.strokeStyle=`rgba(150,200,255,${0.25*(1-rr/10)})`;cx.lineWidth=0.5;
      cx.beginPath();cx.ellipse(bpx,bpy+1,rr+2,rr*0.5+1,0,0,Math.PI*2);cx.stroke();cx.lineWidth=1;
    }
    // Bobber body
    const bobDip=p.state==='bite'?Math.sin(time*12)*2:Math.sin(time*2)*0.5;
    cx.fillStyle='#fff';cx.fillRect(bpx-1,bpy-2+bobDip,3,4);
    cx.fillStyle='#e03030';cx.fillRect(bpx-1,bpy-3+bobDip,3,2);
    cx.fillStyle='#fff';cx.fillRect(bpx,bpy-4+bobDip,1,2); // antenna
    // Bite indicator
    if(p.state==='bite'){
      // "!" drawn on full-res canvas
      if(typeof textOverlays!=='undefined')textOverlays.push({type:'bite',x:bpx,y:bpy-12+bobDip});
      // Splash
      cx.fillStyle='rgba(180,220,255,0.4)';
      for(let s=0;s<3;s++){
        const sa=time*8+s*2.1,sr=3+Math.sin(sa)*2;
        cx.fillRect(bpx+Math.cos(sa)*sr,bpy-2+Math.sin(sa*1.3)*sr,1,1);

    }
    if(p.state==='reeling'){
      cx.fillStyle='#111';cx.fillRect(bpx-10,bpy-7,20,2);
      cx.fillStyle='#22c55e';cx.fillRect(bpx-10,bpy-7,Math.floor(20*((p.reelProg||0)/100)),2);
    }
  }

  // Holding caught fish above head
  if(p.holdFish&&p.holdTimer>0){
    const f=p.holdFish;
    const alpha=Math.min(1,p.holdTimer);
    cx.globalAlpha=alpha;
    const maxSz=FISH_BY_NAME[f.name]||f;
    const sizeRatio=maxSz?f.size/maxSz.maxSz:0.5;
    const sc=0.7+sizeRatio*0.8; // scale factor
    const fishX=px;
    const fishY=py-18;
    const bob=Math.sin(time*3)*1;
    const fy=fishY+bob;

    // Shadow
    cx.fillStyle='rgba(0,0,0,0.15)';
    cx.beginPath();cx.ellipse(fishX,fy+8*sc,5*sc,2,0,0,Math.PI*2);cx.fill();

    // Draw unique sprite per fish type
    const n=f.name;
    if(n==='Seaweed'){
      cx.fillStyle='#2a6a3a';
      for(let i=0;i<4;i++){
        const sy=fy-i*3*sc+Math.sin(time*2+i)*sc;
        cx.fillRect(fishX-1*sc+Math.sin(time+i)*sc,sy,2*sc,3*sc);
      }
      cx.fillStyle='#3a8a4a';
      cx.fillRect(fishX-3*sc,fy+4*sc,2*sc,1*sc);
      cx.fillRect(fishX+2*sc,fy+4*sc,2*sc,1*sc);
    }else if(n==='Old Boot'){
      cx.fillStyle='#3a2a1a';
      cx.fillRect(fishX-4*sc,fy-1*sc,5*sc,5*sc);
      cx.fillRect(fishX-4*sc,fy-4*sc,3*sc,4*sc);
      cx.fillStyle='#5a4030';
      cx.fillRect(fishX-3*sc,fy,3*sc,2*sc);
      cx.fillStyle='#2a6a3a';
      cx.fillRect(fishX+1*sc,fy-3*sc,1*sc,1*sc); // algae
    }else if(n==='Tin Can'){
      cx.fillStyle='#8a8a9a';
      cx.fillRect(fishX-3*sc,fy-3*sc,6*sc,6*sc);
      cx.fillStyle='#aaaabc';
      cx.fillRect(fishX-3*sc,fy-3*sc,6*sc,1*sc);
      cx.fillRect(fishX-3*sc,fy+2*sc,6*sc,1*sc);
      cx.fillStyle='#6a6a7a';
      cx.fillRect(fishX-2*sc,fy-1*sc,4*sc,2*sc);
    }else if(n==='Plastic Bottle'){
      cx.fillStyle='rgba(180,220,255,0.7)';
      cx.fillRect(fishX-2*sc,fy-4*sc,4*sc,8*sc);
      cx.fillStyle='#60a0c0';
      cx.fillRect(fishX-1*sc,fy-5*sc,2*sc,2*sc);
      cx.fillStyle='#e03030';
      cx.fillRect(fishX-2*sc,fy-1*sc,4*sc,1*sc); // label
    }else if(n==='Old Tire'){
      cx.fillStyle='#1a1a1a';
      cx.beginPath();cx.arc(fishX,fy,6*sc,0,Math.PI*2);cx.fill();
      cx.fillStyle='#0a0a0a';
      cx.beginPath();cx.arc(fishX,fy,3*sc,0,Math.PI*2);cx.fill();
      cx.fillStyle='#2a2a2a';
      for(let i=0;i<6;i++){
        const a=i*Math.PI/3;
        cx.fillRect(fishX+Math.cos(a)*5*sc,fy+Math.sin(a)*5*sc,1*sc,1*sc);
      }
    }else if(n==='Driftwood'){
      cx.fillStyle='#6a4a2a';
      cx.fillRect(fishX-5*sc,fy-1*sc,10*sc,3*sc);
      cx.fillStyle='#8a6a3a';
      cx.fillRect(fishX-5*sc,fy-1*sc,10*sc,1*sc);
      cx.fillStyle='#4a2a1a';
      cx.fillRect(fishX-4*sc,fy+1*sc,1*sc,1*sc);
      cx.fillRect(fishX+2*sc,fy+1*sc,1*sc,1*sc);
    }else if(n==='Frog'){
      // Green frog body
      cx.fillStyle='#3a8a3a';
      cx.fillRect(fishX-4*sc,fy-2*sc,8*sc,5*sc); // body
      cx.fillStyle='#4aaa4a';
      cx.fillRect(fishX-3*sc,fy-1*sc,6*sc,3*sc); // belly
      // Eyes (big bulging)
      cx.fillStyle='#4aaa4a';
      cx.fillRect(fishX-4*sc,fy-4*sc,3*sc,3*sc);
      cx.fillRect(fishX+1*sc,fy-4*sc,3*sc,3*sc);
      cx.fillStyle='#fff';
      cx.fillRect(fishX-3*sc,fy-3*sc,2*sc,2*sc);
      cx.fillRect(fishX+2*sc,fy-3*sc,2*sc,2*sc);
      cx.fillStyle='#111';
      cx.fillRect(fishX-3*sc,fy-3*sc,1*sc,1*sc);
      cx.fillRect(fishX+2*sc,fy-3*sc,1*sc,1*sc);
      // Legs
      cx.fillStyle='#3a8a3a';
      cx.fillRect(fishX-5*sc,fy+3*sc,2*sc,2*sc);
      cx.fillRect(fishX+3*sc,fy+3*sc,2*sc,2*sc);
      // Feet
      cx.fillStyle='#2a6a2a';
      cx.fillRect(fishX-6*sc,fy+4*sc,3*sc,1*sc);
      cx.fillRect(fishX+3*sc,fy+4*sc,3*sc,1*sc);
    } else if(n==='Turtle'){
      // Shell
      cx.fillStyle='#6a5a3a';
      cx.beginPath();cx.ellipse(fishX,fy,5*sc,4*sc,0,0,Math.PI*2);cx.fill();
      cx.fillStyle='#8a7a4a';
      cx.beginPath();cx.ellipse(fishX,fy-1*sc,4*sc,3*sc,0,0,Math.PI*2);cx.fill();
      // Shell pattern
      cx.fillStyle='#6a5a3a';
      cx.fillRect(fishX-1*sc,fy-2*sc,2*sc,4*sc);
      cx.fillRect(fishX-3*sc,fy-0.5*sc,6*sc,1*sc);
      // Head
      cx.fillStyle='#5a8a4a';
      cx.fillRect(fishX-7*sc,fy-1*sc,3*sc,3*sc);
      cx.fillStyle='#111';cx.fillRect(fishX-6*sc,fy-1*sc,1*sc,1*sc);
      // Legs
      cx.fillStyle='#5a8a4a';
      cx.fillRect(fishX-4*sc,fy+3*sc,2*sc,2*sc);
      cx.fillRect(fishX+2*sc,fy+3*sc,2*sc,2*sc);
    } else if(n==='Eel'||n==='Electric Eel'){
      // Long wavy body
      cx.fillStyle='#4a4a8a';
      for(let i=0;i<6;i++){
        const ex=fishX-6*sc+i*2*sc;

      cx.fillStyle='#6a6aba';
      for(let i=0;i<5;i++){
        const ex=fishX-5*sc+i*2*sc;

        cx.fillRect(ex,ey2-0.5*sc,2*sc,1*sc);
      }
      // Eye
      cx.fillStyle='#ff0';cx.fillRect(fishX-5*sc,fy-1.5*sc+Math.sin(time*4)*1.5*sc,1*sc,1*sc);
      // Lightning bolts
      if(n==='Electric Eel'){
        cx.fillStyle='#ff0';
        cx.fillRect(fishX+Math.sin(time*6)*3*sc,fy-3*sc,1*sc,2*sc);
        cx.fillRect(fishX+Math.cos(time*5)*2*sc,fy+2*sc,1*sc,2*sc);
      }
    } else if(n==='Octopus'){
      // Head
      cx.fillStyle='#8a3a6a';
      cx.beginPath();cx.ellipse(fishX,fy-2*sc,4*sc,3*sc,0,0,Math.PI*2);cx.fill();

      cx.fillStyle='#111';cx.fillRect(fishX-1*sc,fy-2*sc,1*sc,1*sc);cx.fillRect(fishX+1*sc,fy-2*sc,1*sc,1*sc);
      // Tentacles (wavy)
      cx.fillStyle='#8a3a6a';
      for(let t=0;t<4;t++){
        const tx2=fishX+(-3+t*2)*sc;
        const ty2=fy+1*sc+Math.sin(time*3+t)*1.5*sc;
        cx.fillRect(tx2,ty2,1.5*sc,3*sc);

    } else if(n==='Kraken'){
      // Big version of octopus
      cx.fillStyle='#4a1a3a';

      cx.fillStyle='#6a2a5a';
      cx.beginPath();cx.ellipse(fishX,fy-3*sc,5*sc,3*sc,0,0,Math.PI*2);cx.fill();
      cx.fillStyle='#f00';cx.fillRect(fishX-3*sc,fy-4*sc,2*sc,2*sc);cx.fillRect(fishX+1*sc,fy-4*sc,2*sc,2*sc);
      cx.fillStyle='#fff';cx.fillRect(fishX-2*sc,fy-3*sc,1*sc,1*sc);cx.fillRect(fishX+2*sc,fy-3*sc,1*sc,1*sc);
      cx.fillStyle='#4a1a3a';
      for(let t=0;t<6;t++){const tx2=fishX+(-5+t*2)*sc;cx.fillRect(tx2,fy+2*sc+Math.sin(time*3+t)*2*sc,1.5*sc,4*sc)}
    } else if(n==='Dragon'||n==='Golden Dragon'){
      // Dragon body

      cx.fillStyle='#c8a030';cx.fillRect(fishX-6*sc,fy-2*sc,3*sc,3*sc);
      // Horns

      // Eye
      cx.fillStyle='#f00';cx.fillRect(fishX-5*sc,fy-1*sc,1*sc,1*sc);
      // Wings
      cx.fillStyle='#c89030';
      cx.beginPath();cx.moveTo(fishX,fy-3*sc);cx.lineTo(fishX+3*sc,fy-7*sc);cx.lineTo(fishX+5*sc,fy-2*sc);cx.fill();
      // Tail
      cx.fillStyle='#c8a030';
      cx.fillRect(fishX+4*sc,fy-1*sc,3*sc,2*sc);
      cx.fillRect(fishX+6*sc,fy-2*sc,2*sc,1*sc);

    } else if(n==='Phoenix'){
      // Fiery bird-fish
      cx.fillStyle='#e05020';

      cx.fillStyle='#f0e040';
      cx.beginPath();cx.moveTo(fishX+4*sc,fy);cx.lineTo(fishX+7*sc,fy-1*sc);cx.lineTo(fishX+5*sc,fy);cx.lineTo(fishX+7*sc,fy+1*sc);cx.fill();
      // Eye
      cx.fillStyle='#fff';cx.fillRect(fishX-2*sc,fy-1*sc,2*sc,1*sc);

    } else if(n==='Koi'){
      // White and orange koi

      // Eye

      cx.fillStyle='#fff';cx.fillRect(fishX-3*sc,fy-1*sc,1*sc,1*sc);

    } else if(n==='Minnow'){
